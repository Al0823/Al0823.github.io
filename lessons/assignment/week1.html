<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Form</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: rgb(33, 33, 33);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


form {
  width: 360px;
  display: flex;
  flex-direction: column;
}


label.title {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
  color: rgb(255, 255, 255);
}


.radio-outside {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.radio-inside {
  position: relative;
  width: 350px;
  height: 50px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  padding-left: 10px;
  transition: background 0.3s ease;
}


.radio-inside:hover {
  background-color: rgb(60, 60, 60);
  cursor: pointer;
}


.radio-inside input[type="radio"] {
  position: absolute;
  opacity: 0;
  cursor: pointer;
}



/* Outer ring */
.radio-inside label::before {
  content: "";
  position: absolute;
  left: 22px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 3px solid rgb(128, 0, 128);
  background-color: transparent;
  transition: all 0.3s ease;
}

/* Inner circle — ALWAYS visible */
.radio-inside label::after {
  content: "";
  position: absolute;
  left: 22px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background-color: rgb(128, 0, 128); /* purple by default */
  transition: all 0.3s ease;
}

/* Checked state — turn BOTH green */
.radio-inside input[type="radio"]:checked + label::before {
  border-color: rgb(168, 255, 0);
}

.radio-inside input[type="radio"]:checked + label::after {
  background-color: rgb(168, 255, 0);
}


.radio-inside label span {
  margin-left: 45px;
  color: rgb(255, 255, 255);
  font-weight: normal;
  position: relative; 
  z-index: 1;
}


button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, rgb(255,0,255), rgb(255,0,255));
  color: rgb(255,255,255);
  font-size: 16px;
  cursor: pointer;
  transition: all 2s ease;
}


button:hover {
  background: linear-gradient(90deg, rgb(168,255,0), rgb(208,255,122));
  transform: scale(1.05);
}
</style>
</head>

<body>

<form>
  <label class="title">My favorite thing in the world:</label>
  <div class="radio-outside">
    <div class="radio-inside">
      <input type="radio" id="pizza" name="favorite" value="Pizza">
      <label for="pizza"><span>Pizza</span></label>
    </div>

    <div class="radio-inside">
      <input type="radio" id="bacon" name="favorite" value="Bacon">
      <label for="bacon"><span>Bacon</span></label>
    </div>

    <div class="radio-inside">
      <input type="radio" id="cats" name="favorite" value="Cats">
      <label for="cats"><span>Cats</span></label>
    </div>

    <div class="radio-inside">
      <input type="radio" id="dogs" name="favorite" value="Dogs">
      <label for="dogs"><span>Dogs</span></label>
    </div>
  </div>

  <button type="submit">Save</button>
</form>

</body>
</html>
