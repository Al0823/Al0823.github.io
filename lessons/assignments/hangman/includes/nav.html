<div class="nav" id="main-nav"></div>

<script>
  const nav = document.getElementById('main-nav');
  const currentURL = window.location.href;

  const navLinks = [
    { label: 'Homepage', href: vars.APATHVAR + 'index.html' },
    { label: 'Login',    href: vars.APATHVAR + 'login.html' },
    { label: 'Settings', href: vars.APATHVAR + 'settings.html' },
  ];

  const adminLinks = [
    { label: 'Words Admin',   href: vars.DPATHVAR + 'HMadminHM/words/index.html' },
    { label: 'Members Admin', href: vars.DPATHVAR + 'HMadminHM/members/index.html' },
  ];

  function buildLinks(links) {
    links.forEach(({ label, href }) => {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentURL === a.href) a.classList.add('activenav');
      nav.appendChild(a);
    });
  }

  buildLinks(navLinks);

  const studentId = getCookie('Student');
  if (studentId === '2594' || studentId === '2559') buildLinks(adminLinks);

  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }
</script>
