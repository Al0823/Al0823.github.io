<script type="text/javascript">
var isDay = false;
function toggleDay() {
var bg = document.getElementById("background");
var moon = document.getElementById("moon");
var stars = document.getElementById("stars");
if (!bg || !moon || !stars) return;
if (!isDay) {
moon.setAttribute("fill", "#FFD34D");
bg.setAttribute("fill", "#87CEEB");
stars.setAttribute("visibility", "hidden");
if (moon.style) moon.style.fill = "#FFD34D";
if (bg.style) bg.style.fill = "#87CEEB";
if (stars.style) stars.style.visibility = "hidden";
}
else {
moon.setAttribute("fill", "#FFFFFF");
bg.setAttribute("fill", "#2B2587");
stars.setAttribute("visibility", "visible");
if (moon.style) moon.style.fill = "#FFFFFF";
if (bg.style) bg.style.fill = "#2B2587";
if (stars.style) stars.style.visibility = "visible";
}
isDay = !isDay;
}
</script>
