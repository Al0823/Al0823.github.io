<script type="text/javascript">
function blind() {
	const sun = document.getElementById("bright");
	const svg = sun.ownerSVGElement;
	const box = sun.getBBox();
	const centerX = svg.viewBox.baseVal.width / 2;
	const centerY = svg.viewBox.baseVal.height / 2;
	const currentX = box.x + box.width / 2;
	const currentY = box.y + box.height / 2;
	const dx = centerX - currentX;
	const dy = centerY - currentY;
	sun.style.transition = "transform 1s ease-in-out";
	sun.style.transform = `translate(${dx}px, ${dy}px) scale(1)`;
	setTimeout(() => {
		sun.style.transition = "transform 0.8s ease-in-out";
		sun.style.transform = `translate(${dx}px, ${dy}px) scale(20)`;
	}, 1000);
}
</script>
