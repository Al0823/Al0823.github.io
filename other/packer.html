<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RPG Maker Hybrid Packer</title>

<style>
body{
  background:#111;
  color:#0f0;
  font-family:monospace;
  padding:20px;
}
button,input{
  margin-top:15px;
  padding:10px;
  background:#0f0;
  border:none;
  font-weight:bold;
}
#status{margin-top:10px;color:#0ff}
</style>
</head>
<body>

<h2>RPG Maker Hybrid HTML Packer</h2>

<input type="file" id="folder" webkitdirectory multiple>
<br>
<button id="build">Build Packed HTML</button>
<div id="status">No folder loaded</div>

<script>
var files=[];
var status=document.getElementById("status");

// =========================
// FOLDER PICKER (CHROMEBOOK SAFE)
// =========================
document.getElementById("folder").onchange=function(e){
  files=[].slice.call(e.target.files);
  status.textContent=files.length+" files loaded";
};

// =========================
// BUILD BUTTON
// =========================
document.getElementById("build").onclick=async function(){

  if(!files.length){
    alert("Select your exported RPG Maker folder first!");
    return;
  }

  function read(f){
    return new Promise(function(res){
      var fr=new FileReader();
      fr.onload=function(){res(fr.result);};
      fr.readAsText(f);
    });
  }

  var scripts="";
  var json="";

  status.textContent="Packing...";

  for(var i=0;i<files.length;i++){
    var f=files[i];
    var name=f.name.toLowerCase();

    // =========================
    // INLINE JS
    // =========================
    if(name.endsWith(".js")){
      scripts+="\n/* "+f.name+" */\n"+await read(f)+"\n";
    }

    // =========================
    // BASE64 JSON (bulletproof)
    // =========================
    if(name.endsWith(".json")){
      var raw=await read(f);
      var b64=btoa(unescape(encodeURIComponent(raw)));
      json+='window.__JSON["'+f.name+'"]="'+b64+'";\n';
    }
  }

  // =========================
  // BUILD OUTPUT HTML
  // =========================
  var out="";
  out+="<!DOCTYPE html><html><head><meta charset='UTF-8'>";
  out+="<title>Packed RPG Maker</title></head><body>";
  out+="<div id='game'></div>";

  // JSON Loader
  out+="<script>window.__JSON={};\n"+json;
  out+="var oOpen=XMLHttpRequest.prototype.open;";
  out+="XMLHttpRequest.prototype.open=function(m,u){this._u=u.split('/').pop();return oOpen.apply(this,arguments);};";
  out+="var oSend=XMLHttpRequest.prototype.send;";
  out+="XMLHttpRequest.prototype.send=function(){var n=this._u;";
  out+="if(window.__JSON[n]){this.status=200;";
  out+="this.responseText=decodeURIComponent(escape(atob(window.__JSON[n])));";
  out+="this.onload&&this.onload();return;}return oSend.apply(this,arguments);};";
  out+="<\/script>";

  // Inline Scripts
  out+="<script>\n"+scripts+"\n<\/script>";
  out+="</body></html>";

  // =========================
  // DOWNLOAD
  // =========================
  var blob=new Blob([out],{type:"text/html"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="index_packed.html";
  a.click();

  status.textContent="Done! index_packed.html downloaded";
};
</script>

</body>
</html>
