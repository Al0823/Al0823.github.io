<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Processing...</title>
</head>
<body>

<div id="output">Processing...</div>

<script>
function setCookie(name, value, days) {
  const d = new Date();
  d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
  document.cookie = name + "=" + value + ";expires=" + d.toUTCString() + ";path=/";
}

function getParams() {
  const params = new URLSearchParams(window.location.search);
  return Object.fromEntries(params.entries());
}

// fallback for POST (if needed)
async function getPostData() {
  const formData = new FormData();
  const params = new URLSearchParams(window.location.search);
  return Object.fromEntries(params.entries());
}

(async function main() {

  const params = getParams();
  const action = params.action;

  // ---------------- LOGIN ----------------
  if (action === "login") {

    const uname = params.uname;
    const pword = params.pword;

    // Load admins XML
    const res = await fetch("admins.xml");
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const admins = xml.getElementsByTagName("admin");

    let success = false;

    // Check admin users
    for (let i = 0; i < admins.length; i++) {
      const u = admins[i].getElementsByTagName("username")[0].textContent;
      const p = admins[i].getElementsByTagName("password")[0].textContent;

      if (uname === u && pword === p) {
        setCookie("loggedIn", "true", 1);
        setCookie("user", uname, 1);
        setCookie("role", "admin", 1);
        success = true;
        break;
      }
    }

    if (!success) {
      // Check localStorage users (signup users)
      const stored = localStorage.getItem("user_" + uname);

      if (stored) {
        const user = JSON.parse(stored);

        if (user.password === pword) {
          setCookie("loggedIn", "true", 1);
          setCookie("user", uname, 1);
          setCookie("role", "user", 1);
          success = true;
        }
      }
    }

    if (success) {
      window.location.href = "index.html";
    } else {
      document.getElementById("output").innerHTML = `
        No such Username/Password found.<br><br>
        <a href="index.html">Try again</a>
      `;
    }
  }

  // ---------------- SIGNUP ----------------
  else if (action === "signup") {

    const uname = params.uname;
    const pword = params.pword;
    const fname = params.fname;
    const lname = params.lname;
    const email = params.email;

    // Check if already exists in localStorage
    if (localStorage.getItem("user_" + uname)) {
      document.getElementById("output").innerHTML = `
        Sorry ${uname} already taken <br><br>
        <a href="index.html">Go back</a>
      `;
      return;
    }

    // Save user locally
    const user = {
      fname,
      lname,
      email,
      username: uname,
      password: pword
    };

    localStorage.setItem("user_" + uname, JSON.stringify(user));

    // Set cookies (auto login after signup)
    setCookie("loggedIn", "true", 1);
    setCookie("user", uname, 1);
    setCookie("role", "user", 1);

    document.getElementById("output").innerHTML = `
      Account created successfully.<br>
      Redirecting...
    `;

    setTimeout(() => {
      window.location.href = "index.html?action=newaccount";
    }, 1000);
  }

})();
</script>

</body>
</html>
