<header>
  <link id="mainStylesheet" rel="stylesheet" href="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <div class="header">
    A.t.A. Tech Wiki
  </div>

  <audio id="backgroundAudio" autoplay loop>
    <source src="" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,es,fr,de,it,pt,zh-CN,ja,ko,ar,ru',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');
}
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script src="${JSVAR}settings.js"></script>

  <script>
    (function () {

      function initHeader() {
        if (!window.vars) return false;

        if (window.vars.CSSVAR) {
          const mainLink = document.getElementById("mainStylesheet");
          if (mainLink) {
            mainLink.href = window.vars.CSSVAR + "style.css";
          }
        }

        window.updatePageTitle = function () {
          const pageTitle = typeof PAGETITLE !== "undefined" ? PAGETITLE : "";

          const fullTitle =
            (window.vars.WEBSITETITLE || "") +
            (pageTitle ? " - " + pageTitle : "");

          document.title = fullTitle;

          const titleEl = document.getElementById("pageTitle");
          if (titleEl) titleEl.textContent = fullTitle;
        };

        if (window.updatePageTitle) {
          window.updatePageTitle();
        }

        var audioEl = document.getElementById("backgroundAudio");

        if (audioEl && window.vars.AUDIOVAR) {
          var now = new Date();
          var hour = now.getHours();

          if (hour >= 8 && hour < 22) {
            audioEl.src = window.vars.AUDIOVAR + "bgmusic.mp3";
          } else {
            audioEl.src = window.vars.AUDIOVAR + "latenight.mp3";
          }

          audioEl.load();
          audioEl.play().catch(function () { });
        }

        return true;
      }

      function waitForVars() {
        if (!initHeader()) {
          setTimeout(waitForVars, 50);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", waitForVars);
      } else {
        waitForVars();
      }

    })();
  </script>
</header>
