<footer>
  <span id="dateTime"></span>

  <script>
    (function setFooterText() {
      function update() {
        const dateSpan = document.getElementById("dateTime");
        if (!dateSpan) {
          // Retry if element isn't loaded yet
          setTimeout(update, 50);
          return;
        }

        const currentYear = new Date().getFullYear();
        const startYear = 2025;

        // Use HTML entity for copyright symbol
        dateSpan.innerHTML = `&copy; A.t.A. Projects ${startYear}-${currentYear}`;
      }

      update();
    })();
  </script>
</footer>
