<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
<title>data.win Decoder</title>
</head>
<body>
<div id="app">

  <div id="header">
    <div>
      <h1>data.win Decoder</h1>
      <div class="sub">GameMaker Studio data.win parser</div>
    </div>

    <div>
      <button class="btn" id="new-file-btn">Open new file</button>
      <button class="btn primary" id="export-json">Export JSON</button>
      <button class="btn" id="export-zip">Export ZIP</button>
    </div>
  </div>

  <div id="main">

    <!-- DROP SCREEN -->
    <div id="drop-screen">
      <div id="drop-zone">
        <div class="icon">📦</div>
        <h2>Drop your data.win file</h2>
        <p>or click to select a file</p>
        <label>
          Select File
          <input type="file" id="file" />
        </label>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div id="workspace">

      <div id="sidebar">
        <div id="sidebar-top">
          <span>Chunks</span>
        </div>
        <div id="chunk-list"></div>
      </div>

      <div id="panel">
        <div id="panel-tabs">
          <div class="tab active">Summary</div>
          <div class="tab">Hex</div>
          <div class="tab">Sprites</div>
          <div class="tab">Audio</div>
          <div class="tab">Strings</div>
        </div>

        <div id="panel-body"></div>
      </div>

    </div>

  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
