        const fps = Math.round(fpsStat.n * 1000 / (now - fpsStat.t0)), inf = renderer.info.render;
        fpsBox.textContent = `${fps} fps   worst frame ${Math.round(fpsStat.worst)} ms\n${inf.calls} draws   ${Math.round(inf.triangles / 1000)}k tris (per frame)\n${segAt(Math.floor(walkZ / CH)).type}   seed ${WORLD}   ${Math.round(walkZ)} m\n${innerWidth}x${innerHeight} @${renderer.getPixelRatio().toFixed(2)}x`;
        fpsBox.style.color = fps >= 50 ? '#bfe8a8' : fps >= 30 ? '#f3dfb8' : '#ff9a8a';
      }
      fpsStat.t0 = now; fpsStat.n = 0; fpsStat.worst = 0;
    }
  }
  renderer.info.reset();
  T += dt;

  // walk the path
  const slope = Math.hypot(1, px(walkZ + 0.5) - px(walkZ - 0.5));
  walkZ += WALK_SPEED * dt / slope;
  const cx = px(walkZ), cz = walkZ, footY = surfaceY(cx, walkZ);
  camFoot = camFoot === null ? footY : camFoot + (footY - camFoot) * (1 - Math.exp(-raw * 2.5));
  const cy = camFoot + EYE + Math.sin(T * 5.4) * 0.025;
  const want = Math.atan2(px(walkZ + 9) - cx, 9);
  heading += (want - heading) * (1 - Math.exp(-raw * 1.5));
  const idle = (performance.now() - lastInput) / 1000;
  autoAmt += ((idle > 8 && !dragging ? 1 : 0) - autoAmt) * (1 - Math.exp(-raw * 0.35));
  const autoYaw = 0.85 * Math.sin(T * 0.13) + 0.25 * Math.sin(T * 0.047), autoPitch = 0.06 + 0.14 * Math.sin(T * 0.11 + 1.3) + 0.04 * Math.sin(T * 0.037);
  const yawGoal = yawT + (autoYaw - yawT) * autoAmt, pitchGoal = pitchT + (autoPitch - pitchT) * autoAmt;
  yaw += (yawGoal - yaw) * (1 - Math.exp(-raw * 8)); pitch += (pitchGoal - pitch) * (1 - Math.exp(-raw * 8));
  camera.position.set(cx, cy, cz);
  const a = heading + yaw;
  lookAt.set(cx + Math.sin(a) * Math.cos(pitch), cy + Math.sin(pitch) - 0.05, cz + Math.cos(a) * Math.cos(pitch));
  camera.lookAt(lookAt);
  sky.position.copy(camera.position); mountains.position.set(cx, 0, cz);

  // stream chunks: build one ahead per frame, drop the ones behind
  const camC = Math.floor(walkZ / CH);
  for (let c = camC - 1; c <= camC + AHEAD; c++) if (!chunks.has(c)) { genChunk(c); break; }
  for (const c of [...chunks.keys()]) if (c < camC - 2) dropChunk(c);

  // town vs woods: light and fog
  const tn = townness(walkZ + 10);
  hemi.intensity = 0.62 + 0.0 * tn; moon.intensity = 0.95 + 0.15 * tn;
  FOG.copy(FOG_WOOD).lerp(FOG_TOWN, tn);
  scene.fog.near = 22 + 18 * tn; scene.fog.far = 230 + 170 * tn;
  bloom.strength = 0.85 - 0.1 * tn;

  // moon shadows follow the walker
  const ahead = tmpV.set(cx + Math.sin(heading) * 20, cy, cz + Math.cos(heading) * 20);
  if (shadowDirty || ahead.distanceTo(shadowAt) > 3) {
    shadowAt.copy(ahead); shadowDirty = false;
    moon.target.position.copy(ahead); moon.position.copy(ahead).addScaledVector(MOON_DIR, 180);
    moon.target.updateMatrixWorld(); shadowNeed = true;
  }

  // cows: heads drift down to graze and back up, each on its own slow rhythm
  for (const ch of chunks.values()) for (const a of ch.anims) {
    if (Math.abs(a.position.z - cz) > 90) continue;
    const u = a.userData.anim, n = Math.sin(T * u.sp + u.ph) + 0.45 * Math.sin(T * u.sp * 2.3 + u.ph * 1.7) + (u.graze ? 0.4 : -0.2);
    const down = SS(n, -0.1, 0.5);
    u.tilt.rotation.z = -1.0 * down + 0.04 * Math.sin(T * 1.7 + u.ph);
    u.tilt.rotation.y = 0.3 * Math.sin(T * 0.4 + u.ph) * (1 - down);
  }

  // flicker + light pool: the nearest lanterns get real lights
  const ff = 0.8 + 0.12 * Math.sin(T * 11) + 0.08 * Math.sin(T * 23.7) + (running ? 0.08 * (Math.random() - 0.5) : 0);
  LANT.forEach((m, i) => m.color.copy(m.userData.base).multiplyScalar(flick(i, T, ff)));
  GLASS.forEach(m => m.color.copy(m.userData.base).multiplyScalar(0.92 + 0.08 * Math.sin(T * 2.3 + m.userData.ph) * Math.sin(T * 5.1 + m.userData.ph)));
  FORGE.color.copy(FORGE.userData.base).multiplyScalar(ff); FORGE_WALL.color.copy(FORGE_WALL.userData.base).multiplyScalar(0.85 + 0.15 * ff);
  JACK.color.copy(JACK.userData.base).multiplyScalar(0.8 + 0.2 * ff);
  MUSH.forEach((m, i) => m.color.copy(m.userData.base).multiplyScalar(0.8 + 0.2 * Math.sin(T * 0.9 + i * 2)));
  const cands = [], chimList = [], fireList = [];
  const fx = Math.sin(heading), fz = Math.cos(heading);
  for (const ch of chunks.values()) {
    for (const l of ch.lights) { const dx = l.pos.x - cx, dz = l.pos.z - cz, d = Math.hypot(dx, dz); if (d < 46) cands.push({ l, d, s: d + ((dx * fx + dz * fz) < -6 ? 12 : 0) }); }
    for (const p of ch.chims) chimList.push(p);
    for (const p of ch.fires) fireList.push(p);
  }
  cands.sort((p, q2) => p.s - q2.s);
  pool.forEach((L, i) => {
    const c = cands[i];
    if (!c) { L.intensity = 0; return; }
    L.position.copy(c.l.pos); L.color.copy(c.l.color); L.distance = c.l.range;
    L.intensity = c.l.power * flick(c.l.fi, T, ff) * (1 - SS(c.d, 30, 44)) * (0.85 + 0.15 * tn);
  });

  // smoke: the nearest chimneys smoke; a slot keeps its chimney while it stays near
  const near = chimList.filter(p => byDist(p) < 110).sort((p, q2) => byDist(p) - byDist(q2)).slice(0, SMOKE_SLOTS);
  for (const s of slots) if (s.pos && !near.includes(s.pos)) s.pos = null;
  for (const p of near) if (!slots.some(s => s.pos === p)) { const free = slots.find(s => !s.pos); if (free) free.pos = p; }
  const sp = smoke.geometry.attributes.position.array, ss = smoke.geometry.attributes.aSize.array, sa = smoke.geometry.attributes.aAlpha.array, LIFE = 7.5;
  slots.forEach((s, si) => {
    for (let k = 0; k < SMOKE_N; k++) {
      const i = si * SMOKE_N + k;
      if (!s.pos) { sa[i] = 0; continue; }
      const age = (T + k / SMOKE_N * LIFE + s.ph) % LIFE, u = age / LIFE;
      sp[i * 3] = s.pos.x + WIND.x * age * 0.9 + Math.sin(age * 1.3 + k) * 0.6 * u;
      sp[i * 3 + 1] = s.pos.y + age * 1.1;
      sp[i * 3 + 2] = s.pos.z + WIND.z * age * 0.9 + Math.cos(age * 1.1 + k) * 0.6 * u;
      ss[i] = 0.6 + u * 4.2; sa[i] = SS(u, 0, 0.12) * Math.pow(1 - u, 1.3) * 0.28;
    }
  });
  smoke.geometry.attributes.position.needsUpdate = smoke.geometry.attributes.aSize.needsUpdate = smoke.geometry.attributes.aAlpha.needsUpdate = true;

  // bonfire (nearest) flames + sparks
  sky.material.uniforms.uTime.value = T;
  rippleTex.offset.y -= dt * 0.18;
  swayTime.value = T;
  const F = fireList.sort((p, q2) => byDist(p) - byDist(q2))[0];
  {
    const p = fire.geometry.attributes.position.array, sz = fire.geometry.attributes.aSize.array, al = fire.geometry.attributes.aAlpha.array;
    const s2 = sparks.geometry.attributes.position.array, ss2 = sparks.geometry.attributes.aSize.array, sa2 = sparks.geometry.attributes.aAlpha.array;
    const on = F && byDist(F) < 90;
    fireData.forEach((f, i) => {
      if (!on) { al[i] = 0; return; }
      const u = (T * f.sp + f.off) % 1, r = f.r * (1 - u * 0.8), sw = Math.sin(T * 6 + f.a * 3) * 0.12 * u;
      p[i * 3] = F.x + Math.cos(f.a) * r + sw; p[i * 3 + 1] = F.y + 0.25 + u * 1.9 * ff; p[i * 3 + 2] = F.z + Math.sin(f.a) * r;
      sz[i] = 0.75 * (1 - u) + 0.2; al[i] = Math.pow(1 - u, 1.4) * 0.9;
    });
    sparkData.forEach((s, i) => {
      if (!on) { sa2[i] = 0; return; }
      const age = (T * 0.45 + s.off) % 1 * 2.4;
      s2[i * 3] = F.x + Math.cos(s.a) * age * 0.5 + Math.sin(T * 3 + s.ph) * 0.3 * age + WIND.x * age;
      s2[i * 3 + 1] = F.y + 0.8 + age * s.up;
      s2[i * 3 + 2] = F.z + Math.sin(s.a) * age * 0.5 + WIND.z * age;
      ss2[i] = 0.07; sa2[i] = Math.max(0, 1 - age / 2.4) * (0.6 + 0.4 * Math.sin(T * 20 + s.ph));
    });
    for (const g of [fire.geometry, sparks.geometry]) g.attributes.position.needsUpdate = g.attributes.aSize.needsUpdate = g.attributes.aAlpha.needsUpdate = true;
  }

  // fireflies drift around the walker, thicker in the woods
  const fp = flies.geometry.attributes.position.array, fs = flies.geometry.attributes.aSize.array, fa = flies.geometry.attributes.aAlpha.array;
  flyData.forEach((f, i) => {
    if (Math.hypot(f.b.x - cx, f.b.z - cz) > 26) {
      const a2 = mr(-1.2, 1.2) + heading, r = mr(7, 25);
      f.b.set(cx + Math.sin(a2) * r, 0, cz + Math.cos(a2) * r); f.b.y = groundY(f.b.x, f.b.z) + mr(0.5, 3.2);
    }
    fp[i * 3] = f.b.x + Math.sin(T * f.f1 + f.ph) * 0.9;
    fp[i * 3 + 1] = f.b.y + Math.sin(T * f.f2 + f.ph) * 0.4;
    fp[i * 3 + 2] = f.b.z + Math.cos(T * f.f1 * 0.7 + f.ph) * 0.9;
    fs[i] = 0.15; fa[i] = Math.pow(0.5 + 0.5 * Math.sin(T * f.f3 + f.ph), 3) * (1.1 - 0.6 * tn);
  });
  flies.geometry.attributes.position.needsUpdate = flies.geometry.attributes.aSize.needsUpdate = flies.geometry.attributes.aAlpha.needsUpdate = true;

  // falling leaves
  for (let i = 0; i < LEAF_N; i++) {
    const l = leafData[i];
    if (!l.init) spawnLeaf(l, cx, cz, false);
    if (l.rest > 0) { l.rest -= dt; if (l.rest <= 0) spawnLeaf(l, cx, cz, true); }
    else if (dt > 0) {
      l.p.y -= l.fall * dt;
      l.p.x += (Math.sin(T * l.f + l.ph) * l.sway + WIND.x) * dt;
      l.p.z += (Math.cos(T * l.f * 0.8 + l.ph) * l.sway * 0.6 + WIND.z) * dt;
      l.rot.x += l.spin.x * dt; l.rot.y += l.spin.y * dt; l.rot.z += l.spin.z * dt;
      const gy = groundY(l.p.x, l.p.z) + 0.1;
      if (l.p.y < gy) { l.p.y = gy; l.rest = mr(2, 6); l.rot.set(-Math.PI / 2, 0, mr(0, 6)); }
    }
    if (Math.abs(l.p.x - cx) > LR || l.p.z < cz - LR * 0.6 || l.p.z > cz + LR * 1.4) spawnLeaf(l, cx, cz, true);
    dummy.position.copy(l.p); dummy.rotation.copy(l.rot); dummy.scale.setScalar(1); dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  }
  leaves.instanceMatrix.needsUpdate = true;

  // normal + depth pass (layer 0 only) -> ink lines, then the real render
  camera.layers.set(0); scene.overrideMaterial = normalMat;
  renderer.setRenderTarget(normalRT); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); scene.overrideMaterial = null; camera.layers.enableAll();
  if (shadowNeed) { renderer.shadowMap.needsUpdate = true; shadowNeed = false; }
  composer.render(raw);
  if (!fadedIn) { fadedIn = true; requestAnimationFrame(() => { fade.style.opacity = '0'; }); }
}
frame();


</script>
</body>
</html>
