// ================ RENDERING ================
function renderPassage() {
    gameState.visitedPassages[gameState.currentPassage] = true;

    var p = passages[gameState.currentPassage];
    if (!p) {
        document.getElementById('story').textContent = "Error: passage " + gameState.currentPassage + " not found.";
        return;
    }

    let displayText = typeof p.text === 'function' ? p.text() : p.text;
    document.getElementById('story').textContent = displayText;
    document.getElementById('location-display').textContent = p.location + " — " + gameState.currentDate;

    var choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    let visibleChoices = p.choices.filter(choice => {
        const used = gameState.usedChoices[gameState.currentPassage] || [];
        if (used.includes(choice.label)) return false;
        if (choice.condition && !choice.condition()) return false;
        return true;
    });

    visibleChoices.forEach((choice) => {
        var btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.onclick = () => {
            if (choice.next !== gameState.currentPassage) {
                if (!gameState.usedChoices[gameState.currentPassage])
                    gameState.usedChoices[gameState.currentPassage] = [];
                if (!gameState.usedChoices[gameState.currentPassage].includes(choice.label)) {
                    gameState.usedChoices[gameState.currentPassage].push(choice.label);
                }
            }
            if (choice.effect) choice.effect();
            gameState.lastPassage = gameState.currentPassage;
            gameState.currentPassage = choice.next;
            renderPassage();
        };
        choicesDiv.appendChild(btn);
    });

    updateStatusBar();
}

function updateStatusBar() {
    if (passages[gameState.currentPassage]) {
        document.getElementById('status-bar').textContent = `Location: ${passages[gameState.currentPassage].location} — ${gameState.currentDate}`;
    }
}

// ================ ADMIN PANEL ================
function toggleAdminPanel() {
    const panel = document.getElementById('admin-panel');
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    if (panel.style.display === 'block') refreshAdminPanel();
}

function refreshAdminPanel() {
    const container = document.getElementById('state-list');
    container.innerHTML = '';
    for (let key in gameState) {
        const value = gameState[key];
        const row = document.createElement('div');
        row.style.margin = '8px 0';
        row.style.padding = '8px';
        row.style.background = '#222222';
        row.style.borderRadius = '4px';
        row.innerHTML = `
            <strong>${key}:</strong> 
            <input type="text" value="${value}" 
                   onchange="updateGameState('${key}', this.value)" 
                   style="background:#333; color:#ddd; border:none; padding:4px; width:65%;">
        `;
        container.appendChild(row);
    }
}

function updateGameState(key, newValue) {
    const current = gameState[key];
    if (typeof current === 'number') gameState[key] = Number(newValue);
    else if (typeof current === 'boolean') gameState[key] = (newValue.toLowerCase() === 'true');
    else gameState[key] = newValue;
    refreshAdminPanel();
}

function quickSet(key, value) {
    gameState[key] = value;
    refreshAdminPanel();
    alert(`Set ${key} = ${value}`);
}

function jumpToPassage() {
    const num = parseInt(document.getElementById('jump-input').value);
    if (!isNaN(num) && passages[num]) {
        gameState.currentPassage = num;
        toggleAdminPanel();
        renderPassage();
    } else {
        alert("Invalid passage number!");
    }
}

function resetGameState() {
    if (confirm("Reset ALL game state?")) location.reload();
}

// Hotkey: Ctrl + Shift + A
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        toggleAdminPanel();
    }
});

// ================ MODALS ================
function openModal(type) {
    var modal = document.getElementById('modal');
    var title = document.getElementById('modal-title');
    var content = document.getElementById('modal-content');

    if (type === 'stats') {
        title.textContent = "GAME STATS";
        if (!gameState.statsUnlocked) {
            content.innerHTML = "<p>Stats will be revealed as you progress through the story.</p>";
        } else {
            content.innerHTML = `Family Tension: ${gameState.familyTension}<br>Supernatural Affinity: ${gameState.supernaturalAffinity}<br>Lirael Bond: ${gameState.liraelBond}<br>Father Bond: ${gameState.issacFatherBond}<br>Mother Bond: ${gameState.issacMotherBond}<br>Sister Bond: ${gameState.issacSisterBond}<br>Lira Bond: ${gameState.issacLiraBond}<br>Theo Resurrection Progress: ${gameState.theoResurrectionProgress}%`;
        }
    } else if (type === 'options') {
        title.textContent = "OPTIONS";
        content.innerHTML = `Text Speed: <input type="range" min="1" max="100" value="50"><br><br>Sound Effects: <input type="checkbox" checked>`;
    } else if (type === 'system') {
        title.textContent = "SAVE / LOAD";
        content.innerHTML = `<div class="modal-button" onclick="saveGame()">Save Game</div><div class="modal-button" onclick="loadGame()">Load Game</div>`;
    } else if (type === 'about') {
        title.textContent = "THE DEMON AND I";
        content.innerHTML = `<p>A text-based erotic adventure<br>Isaac Byrd & the trapped she-demon</p>`;
    }
    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('modal').style.display = "none";
}

function saveGame() {
    localStorage.setItem('demonAndISave', JSON.stringify(gameState));
    alert("Game Saved!");
}

function loadGame() {
    var save = localStorage.getItem('demonAndISave');
    if (save) {
        Object.assign(gameState, JSON.parse(save));
        renderPassage();
        alert("Game Loaded!");
    } else {
        alert("No save file found.");
    }
}

function restartGame() {
    if (confirm("Restart the entire story from the beginning?")) {
        location.reload();
    }
}

window.onload = function() {
    renderPassage();
    setInterval(() => {
        var t = document.getElementById('title-text');
        t.style.visibility = (t.style.visibility === 'hidden') ? 'visible' : 'hidden';
    }, 700);
};
