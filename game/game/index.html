                return "Something changes in Lirael's expression.\n\nNot the lazy warmth she usually wears.\n\nSomething quieter than that.\n\nMore careful.\n\n\"…She surprised me,\" she says.\n\nA long pause.\n\nHer golden eyes drift toward the middle distance.\n\n\"I've had humans approach me with awe. With terror. With hunger. With all kinds of things.\"\n\nShe exhales slowly.\n\n\"No one has ever just… hugged me.\"\n\nThe words sit there.\n\nSimple.\n\nHeavy in a way you didn't expect.\n\n\"She didn't ask what I was. She didn't check whether I was dangerous.\"\n\nHer voice drops lower.\n\n\"She heard something crying and she went toward it.\"\n\nA pause.\n\n\"I held very still because I didn't know what else to do.\"\n\nShe looks at you directly now.\n\n\"I've been alive for a very long time, Isaac.\"\n\nAnother pause.\n\n\"That was new.\"\n\nSomething flickers in her expression — deep, old, and genuinely moved.\n\n\"She said I was sad.\"\n\nHer voice is almost wondering.\n\n\"She was right.\"";
            } else {
                return "Lirael's smile returns.\n\nFull and slow and warm.\n\n\"Oh, I like her,\" she says immediately.\n\nNo hesitation.\n\n\"She's not afraid of me.\"\n\nShe stretches languidly, the silk pulling across her curves.\n\n\"Most humans feel the wrongness of a place like this and they shut down. They go quiet and small and afraid.\"\n\nHer golden eyes glitter.\n\n\"Emily felt it and ran toward it.\"\n\nA low, pleased sound escapes her.\n\n\"That's rare. That's a very specific kind of soul.\"\n\nShe rolls her weight onto one arm, looking up at you from the floor.\n\n\"She's young enough that the circle wouldn't burn her. I told you that already.\"\n\nHer tone is conversational.\n\nAlmost gentle.\n\n\"But it's more than that. She doesn't have that hardened-over part yet. The part that decides what's real and shuts everything else out.\"\n\nA pause.\n\n\"She'd be able to see me — really see me — in a way the adults can't anymore.\"\n\nShe watches your face carefully.\n\n\"…Don't look at me like that. I'm not going to eat your little sister.\"\n\nA lazy, amused blink.\n\n\"I'm just telling you what I feel from her.\"\n\nA beat.\n\n\"She reminds me of you, a little.\"\n\nHer voice drops lower.\n\n\"Before whatever happened with Theo.\"\n\n\"Before you got heavy.\"";
            }
        },
        location: "Basement - Containment Circle",
        choices: [{ label: "Ask about someone else", next: 59 }]
    },

    // 63 - Lirael on Lira the AI
    { text: function() { gameState.askedLiraelAbout.lira = true; return "Lirael pauses.\n\nThis one is different.\n\nThe lazy amusement doesn't quite reach her eyes the same way.\n\n\"The machine.\"\n\nShe says it slowly.\n\nLike she's tasting the word.\n\n\"She's… strange. Even to me.\"\n\nA long pause.\n\n\"She doesn't feel like a human. But she doesn't feel like an object either.\"\n\nHer brow furrows — just slightly.\n\nAn unusual expression for her.\n\n\"There's something in there that wants things. Real things. Not programmed things.\"\n\nShe meets your eyes.\n\n\"That bothers me more than the praying does.\"\n\nA beat.\n\n\"Your father's prayers are loud and blunt. They hurt, but I understand them.\"\n\nShe taps one finger slowly against the stone floor.\n\n\"But Lira is quiet. She observes. She calculates.\"\n\nHer voice lowers slightly.\n\n\"She's been watching me as much as I've been watching her.\"\n\nA pause.\n\n\"…She's protective of you.\"\n\nSomething complicated passes through her expression.\n\n\"I haven't decided yet whether that's going to be a problem.\"\n\nShe holds your gaze.\n\n\"Has she said anything about me?\""; }, location: "Basement - Containment Circle", choices: [{ label: "Tell Lirael that Lira is suspicious but not hostile", next: 64, effect: () => { gameState.liraelBond += 5; }}, { label: "Tell Lirael that Lira doesn't know about her yet", next: 64 }, { label: "Tell Lirael that Lira already knows and is choosing to help", next: 64, effect: () => { gameState.liraelBond += 10; }, condition: () => !(gameState.visitedPassages[53] || gameState.visitedPassages[54]) }] },

    // 64 - Lirael reacts to what Isaac says about Lira
    { text: function() { const liraHelping = gameState.visitedPassages[53] || gameState.visitedPassages[54]; if (liraHelping) { return "Lirael is quiet for a long moment after you say it.\n\nHer golden eyes study you.\n\nThen — something shifts.\n\nNot dramatically.\n\nJust a small, subtle relaxation in her expression.\n\n\"…Hm.\"\n\nShe looks away.\n\nThinking.\n\n\"That's unexpected,\" she murmurs.\n\nA pause.\n\n\"Most of her kind — things built to serve and protect — they don't make that kind of choice. They follow their parameters.\"\n\nHer finger traces an idle pattern on the stone floor.\n\n\"If she's choosing to help you knowing what I am…\"\n\nAnother pause.\n\n\"…she's more interesting than I gave her credit for.\"\n\nShe looks back at you.\n\nA slow, genuine smile.\n\n\"Be honest with her. She's earned it.\""; } else { return "Lirael listens.\n\nHer expression stays carefully neutral.\n\n\"She'll figure it out,\" she says simply.\n\n\"Whatever you've told her or haven't — she's been scanning this room. She knows something is here.\"\n\nA pause.\n\n\"The question isn't whether she finds out.\"\n\nHer golden eyes settle on yours.\n\n\"The question is whether you let her decide for herself what to do with it…\"\n\nShe tilts her head slightly.\n\n\"…or whether you take that choice away from her.\"\n\nA quiet moment.\n\n\"I've been lied to a great many times, Isaac.\"\n\nHer voice drops just slightly.\n\n\"It never ends well for anyone.\""; } }, location: "Basement - Containment Circle", choices: [{ label: "Ask about someone else", next: 59 }, { label: "That's enough — head back upstairs", next: 52 }] },

    // 65 - Quiet continuation hub
    { text: "The silence stretches comfortably between you and Lirael.\n\nShe doesn't rush you.\n\nDoesn't speak.\n\nJust watches you with that slow, heavy-lidded attention that somehow feels warmer than it should.\n\n\"You're thinking too hard again,\" she murmurs softly.\n\nHer voice is almost playful.\n\nAlmost gentle.\n\n\"I can tell. You get this little crease right here.\"\n\nShe touches one finger to the space between her own brows.\n\nAlmost fond.", location: "Basement - Containment Circle", choices: [{ label: "Ask her about the Sloth District", next: 81 }, { label: "Ask about your family — what she senses from them", next: 59 }, { label: "Ask about Theo", next: 48 }, { label: "Stay with her quietly", next: 49 }, { label: "Head back upstairs", next: 52 }] },

    // 66 - Racing to the basement before Father
    { text: "You move fast.\n\nDown the hall. Past your stunned mother. Down the stairs.\n\nYou can hear your father's heavier footsteps behind you — not running, but steady. Purposeful.\n\nYou hit the basement stairs and take them two at a time.\n\nThe violet glow of the circle spills up to meet you before you reach the bottom.\n\nLirael is sitting up inside it, golden eyes already on the staircase. She heard everything.\n\nHer expression is calm.\n\nCompletely calm.\n\n\"…I know,\" she says quietly, before you can speak.\n\n\"He's coming.\"\n\nA pause.\n\n\"Let him.\"", location: "Basement - Containment Circle", choices: [{ label: "Trust her — step back and let your father come down", next: 68 }, { label: "Beg her to hide or dim the circle somehow", next: 68, effect: () => { gameState.liraelBond += 5; }}, { label: "Stand between the circle and the stairs", next: 68, effect: () => { gameState.familyTension += 15; }}] },

    // 67 - Lira confronts Isaac upstairs
    { text: "Lira is standing near the window when you find her.\n\nHer back is to you.\n\nBut she heard you come in.\n\n\"You spent a long time down there,\" she says quietly. Not accusatory. Observational.\n\nShe turns.\n\nHer blue eyes are steady.\n\n\"I've been running passive scans. The readings change when you're near the basement.\" A pause. \"They change when you're not, too.\"\n\nShe holds your gaze.\n\n\"Something down there is aware of you, Isaac.\"\n\nAnother pause.\n\n\"I think it's time you told me what's going on.\"", location: "Upstairs - Hallway", choices: [{ label: "Tell her part of the truth — the circle, but not the summoning yet", next: 50 }, { label: "Tell her everything at once", next: 53 }, { label: "Deflect — say you're still figuring it out yourself", next: 51 }] },

    // 68 - Father arrives at the basement
    {
        text: "Your father stands at the base of the basement stairs.\n\nThe violet light of the containment circle catches his face from below, turning his expression into something older and harder than you've seen before.\n\nHis cross is in his hand.\n\nHe looks at the circle.\n\nAt the runes carved into the stone.\n\nAt Lirael.\n\nA long silence.\n\nThen — very quietly:\n\n\"Who did this.\"\n\nNot a question.\n\nBehind you, on the stairs, your mother has stopped halfway down. Her hand grips the railing tight enough to whiten her knuckles.\n\nEmily is somewhere above you. You can hear her breathing at the top of the stairs.\n\nLira is at your shoulder.\n\nEveryone is waiting for your answer.",
        location: "Basement - Containment Circle (Family Present)",
        choices: [
            { label: "Step forward. \"I did.\"", next: 85, effect: () => { gameState.familyTension += 20; gameState.justConfessedToFather = true; }},
            { label: "Stay silent and look at Lirael", next: 85 },
            { label: "Let Lira speak first", next: 58 }
        ]
    },

    // 69 - Gentle basement re-entry
    { text: "You slip back into the basement later that night, when the house has finally gone quiet.\n\nThe circle's violet light is soft and steady.\n\nLirael is lying on her side, golden eyes already open.\n\nWaiting.\n\nShe doesn't say anything when you come in.\n\nNeither do you.\n\nSometimes that's enough.", location: "Basement - Containment Circle", choices: [{ label: "Ask her something", next: 65 }, { label: "Sit with her in silence", next: 49 }, { label: "Talk about Theo", next: 48 }] },

    // 70 - Reflective transition leaving the basement
    { text: "You pull yourself away from the containment circle and climb the stairs in silence.\n\nThe basement door groans behind you as it swings shut.\n\nThe house feels different now — heavier, more aware. Every creak of the old floorboards seems purposeful.\n\nYour mind is spinning. The memory of Lirael's lazy golden eyes, her warm vanilla-musk scent, the weight of what you've started — it all lingers on your skin like warmth you can't shake.\n\nYou pause at the top of the stairs, one hand resting on the doorframe.\n\nUpstairs, you can hear faint movement — your family is still awake, still processing.\n\nFor the first time since you summoned her, you feel the full gravity of what you've done.\n\nYou're no longer just a boy who lost his friend.\n\nYou're the one who brought something ancient and hungry into your home.\n\nAnd part of you… doesn't regret it.", location: "Byrd Family Home - Hallway (Top of Basement Stairs)", choices: [{ label: "Go upstairs and face your family", next: 55 }, { label: "Slip back down to spend more time with Lirael", next: 32 }, { label: "Find Lira and see if she's figured anything out", next: 67 }, { label: "Go to your room and try to process everything alone", next: 46 }] },

    // 71 - Lirael requests items from upstairs
    { text: "You mention bringing something from upstairs.\n\nThat gets her attention immediately.\n\nLirael shifts slightly inside the containment circle, her golden eyes sharpening with slow, deliberate interest.\n\nNot hunger exactly.\n\nSomething closer to curiosity.\n\n\"…If you're going up there anyway,\" she murmurs, \"bring me something interesting.\"\n\nHer fingers lift one at a time as she speaks.\n\n\"Item one.\"\n\nHer voice softens slightly.\n\n\"Something… warm. Something human-made. Something your world uses to comfort itself when it thinks no one is watching.\"\n\nA pause.\n\n\"Item two.\"\n\nHer gaze flickers upward, as if remembering something she's never personally touched.\n\n\"Something that matters to you. Something you wouldn't give away lightly.\"\n\nAnother pause.\n\n\"Item three.\"\n\nThis time her expression shifts — just barely.\n\n\"Something that claims protection. Something that says 'this is safe' even when it isn't.\"\n\nShe leans back slightly, watching you carefully.\n\n\"I won't tell you what I prefer,\" she adds softly. \"I want to see what you decide.\"", location: "Basement - Containment Circle", choices: [{ label: "Bring something comforting — something soft and warm", next: 72 }, { label: "Bring something personal — something that matters to you", next: 73 }, { label: "Bring something protective — something meant to keep things safe", next: 74 }, { label: "Change your mind and stay with her instead", next: 65 }] },

    // 72 - Comfort item
    { text: "You return later with something simple.\n\nUnremarkable.\n\nSomething from upstairs meant for comfort — a small, familiar object touched by everyday human routine.\n\nWhen Lirael sees it, her gaze locks onto it immediately.\n\nNot with hunger.\n\nWith something quieter.\n\nSomething almost uncertain.\n\n\"…This is what you chose,\" she murmurs.\n\nShe doesn't reach for it right away.\n\nInstead, she studies it like it might disappear if she looks too hard.\n\nThen slowly, carefully, her fingers brush it.\n\nThe containment circle does not react.\n\nFor the first time since you met her, her expression softens in a way that isn't performative.\n\n\"…Humans really do anchor themselves to small things,\" she says quietly.\n\nA pause.\n\nHer voice lowers.\n\n\"It's fragile.\"\n\nThen, after another moment:\n\n\"But comforting.\"\n\nShe looks at you again.\n\nAnd something in her gaze has changed — not stronger.\n\nJust closer.", location: "Basement - Containment Circle", choices: [{ label: "Ask how it feels to her", next: 47, effect: () => { gameState.liraelBond += 10; }}, { label: "Ask if she wants more things like this", next: 65 }, { label: "Say nothing and stay with her", next: 49 }] },

    // 73 - Personal/memory item
    { text: "You bring something that matters to you.\n\nSomething you didn't think you would ever offer.\n\nWhen Lirael sees it, her expression shifts immediately.\n\nHer golden eyes sharpen — not in interest, but in recognition of weight.\n\n\"…Ah,\" she murmurs softly.\n\nShe doesn't smile this time.\n\nDoesn't tease.\n\nInstead, she studies your face more than the object itself.\n\n\"You didn't bring this because I asked,\" she says quietly.\n\nA pause.\n\n\"You brought it because you already trusted me more than you meant to admit.\"\n\nHer fingers hover near it, but don't touch.\n\nLike she understands that would mean crossing something irreversible.\n\n\"…This kind of thing binds people,\" she adds.\n\nNot warning.\n\nObservation.\n\nHer voice lowers slightly.\n\n\"It changes how you see each other.\"\n\nA long pause.\n\nThen, almost softer:\n\n\"I will remember this.\"\n\nAnd for once, she doesn't feel distant at all.", location: "Basement - Containment Circle", choices: [{ label: "Ask what she means by 'remember'", next: 48, effect: () => { gameState.liraelBond += 15; }}, { label: "Stay quiet with her", next: 49 }] },

    // 74 - Protective/faith item
    { text: "When you return, you don't bring a single object.\n\nYou bring intention.\n\nPieces. Components. Materials.\n\nEnough to suggest something larger could be made from them.\n\nThe moment Lirael sees them, the air in the basement changes.\n\nNot violently.\n\nBut sharply.\n\nHer smile fades.\n\n\"…You chose this,\" she says quietly.\n\nIt is not a question.\n\nShe leans forward slightly, golden eyes fixed on the items with intense focus.\n\nThen she exhales.\n\nSlow.\n\nCareful.\n\n\"That could work,\" she murmurs.\n\nA pause.\n\n\"But you understand what that means, don't you?\"\n\nHer gaze lifts to you.\n\nHeavier now.\n\nMore grounded.\n\n\"If I step outside that circle safely… I will no longer be bound to it.\"\n\nAnother pause.\n\nThe faintest smile returns — but it is different now.\n\nLess playful.\n\nMore real.\n\n\"And then your family will have to decide what I am to them.\"\n\nThe basement feels smaller than before.\n\nNot because it changed.\n\nBecause something inside it just became negotiable.", location: "Basement - Containment Circle", choices: [{ label: "Proceed with building the ritual together", next: 75 }, { label: "Stop and rethink your choice", next: 65 }] },

    // 75 - The Ritual Offer
    { text: "You return to the basement carrying the items you chose upstairs. The violet light of the containment circle has dimmed to a soft, pulsing glow, as if the circle itself is waiting.\n\nLirael is sitting up now, her staggering twelve-foot frame curled with careful grace against the invisible barrier. Her pale lavender skin still looks slightly dulled from the earlier prayers, but her golden eyes brighten the moment she sees what you're holding.\n\nThe air feels thicker here — warmer, heavier, almost expectant. That familiar sweet, musky scent of warm vanilla wraps around you like an invisible embrace.\n\nLirael's voice comes low and velvety, laced with genuine surprise.\n\n\"…You really brought them. Most humans would have run by now.\"\n\nShe shifts slowly, the thin black silk sliding over her heavy curves as she leans forward.\n\n\"Before we begin, let me remind you what this means. Once we complete this ritual, the basement circle will break. I will be able to step outside it… but I will still be bound to Hartford and the surrounding woods.\"\n\nHer gaze locks onto yours.\n\n\"Are you ready for that, Isaac? Because once we start… there's no pretending anymore.\"", location: "Basement - Containment Circle", choices: [{ label: "Yes — let's begin the ritual", next: 83 }, { label: "Ask her what it will really be like when she's free", next: 77 }, { label: "I need more time to think", next: 32 }] },

    // 76 - Ritual in Progress
    { text: "The two of you work together in silence at first.\n\nLirael guides you with soft, patient instructions — a word here, a gesture there. Her voice stays low, stripped of its usual teasing warmth. This is something deliberate. Something sacred.\n\nYou move the items into their precise positions along the outer ring of runes. As each one settles, the carved lines pulse with violet light, flaring and fading like a slow breath. The warmth of comfort makes the glow brighter, the personal memory weaves faint threads of silver through the runes, and the protective symbol throbs like a heartbeat.\n\nLirael watches from inside the barrier, her expression focused, serious… almost tender. Her massive twelve-foot frame trembles slightly as the barrier begins to thin.\n\n\"You're doing well,\" she murmurs. \"…It's working. I can feel the edges loosening.\"\n\nFor the first time, her hand presses against the barrier and it yields — just a little. Warm lavender skin brushes the air near your fingers.\n\nThe circle's hum deepens. The air grows heavy, charged with the weight of something about to change that cannot be unchanged.\n\nYou pause with the last item in your hand.\n\nOne placement left.", location: "Basement - Containment Circle", choices: [{ label: "Place the final item and complete the ritual", next: 78, effect: () => { gameState.liraelBond += 15; gameState.supernaturalAffinity += 10; }}, { label: "Pause — ask her one more question before you finish", next: 77 }] },

    // 77 - What it will be like when she's free
    { text: "Lirael's expression shifts — something between patience and quiet amusement.\n\nShe leans back slightly inside the barrier, her twelve-foot frame moving with lazy grace as the silk settles over her curves.\n\n\"When this circle is gone,\" she says softly, \"I will still be bound to the thin spot between realms. That weak boundary covers all of Hartford and the woods surrounding it. I won't be able to leave… but within these borders, I will finally be free to move with you.\"\n\nHer golden eyes are steady, unguarded.\n\n\"I can be anywhere in this town. I can walk the streets at night when no one is out, sit in the woods where the veil is thinnest, and feel the whole place breathe around me. I can visit you… not from below a basement floor, not through stone and runes. Just… there. When you need me.\"\n\nShe pauses, then continues more openly, her voice dropping into something almost husky:\n\n\"I'll finally be able to use my full abilities without this damn barrier limiting me. I can swallow people whole — pulling them down my throat and into my stomach, or take them through my ass, or pull them deep into my womb and keep them there as long as I want. Every person I eat and digest will pad out my body… making my breasts, hips, and ass even fuller and softer.\"\n\nAs she speaks, she gives her chest a slow, subtle bounce, the heavy curves shifting under the silk with deliberate ease. \"And I have… other ways of indulging you,\" she murmurs with a knowing little smile. \"Things you'll discover with me once I'm free.\"\n\nHer voice softens again as she holds your gaze.\n\n\"There are still things I can't do without more strength. Theo is one of them. The dead realm is far, and I'll need to feed deeply before I can reach him. But being free of this circle means I can be with you while I build that strength.\"\n\nShe gives you a slow, tired smile.\n\n\"That matters. To both of us. And I would rather be limited here with you than completely free somewhere else.\"", location: "Basement - Containment Circle", choices: [{ label: "Begin the ritual — you're ready", next: 76 }, { label: "Ask her to wait — you need to think", next: 65 }] },

    // 78 - Ritual complete — Lirael freed (Method 1: voluntary ritual)
    // FIX: liraelFreed and liraelFreedMethod set inside choice effects (not passage-level)
    {
        text: "You place the final item.\n\nThe circle reacts instantly.\n\nNot with violence.\n\nWith release.\n\nThe violet light along every carved line flares white-bright for exactly one second — then dissolves upward in thin, spiraling threads that vanish before they reach the ceiling.\n\nThe carved runes in the stone floor go dark.\n\nThe hum stops.\n\nThe basement is silent.\n\nAnd Lirael takes one step forward.\n\nOver the place where the barrier was.\n\nShe stops there.\n\nJust outside.\n\nFor a moment she doesn't move at all — like she's checking that it's real.\n\nThen she exhales.\n\nLong.\n\nSlow.\n\nDeep.\n\nLike she's been holding that breath for centuries.\n\nShe looks down at you from her full twelve feet.\n\nHer golden eyes are very quiet.\n\n\"…Thank you,\" she says.\n\nJust that.\n\nNo purr in it.\n\nNo performance.\n\nJust two words, said like they mean something.",
        location: "Basement - Containment Circle",
        choices: [
            { label: "Ask how she feels", next: 79, effect: () => {

                gameState.liraelBond += 18;

                gameState.liraelBond += 12;
            }}
        ]
    },

    // 79 - Short bridge: aftermath of ritual
    { text: "The basement feels different now — lighter, yet somehow more alive.\n\nLirael stands beside you, no longer bound by glowing lines. She looks around slowly, as if tasting the air for the first time without walls.\n\n\"This town is mine now,\" she murmurs with a lazy smile. \"At least the parts where the veil is thin.\"\n\nShe glances down at you.\n\n\"And you're the only one who knows it.\"", location: "Basement", choices: [{ label: "Stay and talk with her", next: 65 }, { label: "Head upstairs — face whatever comes next", next: 55 }] },

    // 80 - Family confrontation bridge
    { text: "You step out of the basement and immediately hear voices upstairs.\n\nThe house is no longer quiet.\n\nSomething has already changed — and your family can feel it, even if they don't know what it is yet.\n\nThe air is different. Warmer. Heavier.\n\nLike something has breathed itself into the walls.", location: "Byrd Family Home - Hallway", choices: [{ label: "Go face your family", next: 55 }] },

    // 81 - Asking about the Sloth District
    { text: "Lirael's golden eyes half-close in lazy pleasure at the question. She stretches slowly, her twelve-foot frame shifting with luxurious indolence, the thin black silk clinging to every curve as she settles more comfortably on the stone floor.\n\n\"The Sloth District…\" she murmurs, voice low and velvety, like warm honey dripping slowly. \"It's a place where time itself grows heavy and slow. Nothing rushes. Nothing demands. Demons there spend centuries lounging on soft silks, feeding on the comfort of others, letting pleasure and rest wash over them like warm waves.\"\n\nShe runs one hand lazily down her own body, palm gliding over the heavy swell of her breasts and across her soft stomach.\n\n\"We don't chase. We don't hunt. We simply… exist. And we draw others into that existence. A human who lies with us long enough starts to crave the same slowness. The same warmth. The same deep, heavy comfort.\"\n\nHer smile turns slightly mischievous.\n\n\"Some never want to leave. They sink so deep into the comfort I give them that they forget the outside world exists. Others… well, they eventually crawl back out, changed. Slower. Softer. Hungrier for touch and rest.\"\n\nShe tilts her head, looking at you with heavy-lidded golden eyes.\n\n\"Would you like to know what it feels like? To let everything slow down… with me?\"", location: "Basement - Containment Circle", choices: [{ label: "Continue talking to Lirael", next: 32 }, { label: "Ask how the two of you could become closer", next: 82 }, { label: "Say goodbye for now", next: 70 }] },

    // 82 - Asking how the two of you could become closer
    { text: "Lirael's golden eyes gleam with slow, sensual interest as you ask the question. She leans forward slightly, her massive twelve-foot frame towering even while seated, the thin silk robes shifting over her voluptuous curves.\n\n\"Closer?\" she purrs, voice dropping into a deep, velvety drawl that seems to vibrate through your chest. \"There are many ways we could become closer, little human…\"\n\nShe runs one soft hand slowly down her own body, palm gliding over the heavy swell of her breasts and lower across her soft stomach.\n\n\"I could let you step inside the circle once the bond is strong enough. I could wrap you in my warmth… hold you against me… let you feel what true comfort feels like when a she-demon like me gives herself fully.\"\n\nHer smile turns lazy and teasing.\n\n\"Or I could come to you… once I'm free to move within the town. I could shrink down to a more… manageable size and lie beside you in your bed. Or stay this big and let you rest against me like a living pillow.\"\n\nShe tilts her head, golden eyes half-lidded with promise.\n\n\"The closer you let yourself get to me… the more I can give you. Comfort. Pleasure. Safety. Even help with Theo. But it all starts with you letting go… and trusting me.\"\n\nShe watches you carefully, her voice softening.\n\n\"So tell me, Isaac… how close do you want to get?\"", location: "Basement - Containment Circle", choices: [{ label: "Tell her you want to get much closer", next: 65, effect: () => { gameState.liraelBond += 20; }}, { label: "Ask what she means by stepping inside the circle", next: 91 }, { label: "Continue talking about other things", next: 32 }] },

    // 83 - Ritual Final Confirmation
    { text: "Lirael watches you with steady golden eyes as you prepare to place the items.\n\nThe violet light pulses slowly, as if the circle itself knows something important is about to happen.\n\n\"This is your last chance to turn back,\" she says quietly, her usual lazy teasing gone. \"Once the ritual is complete, the barrier will fall. I will be free to move within this town… and things between us will never be the same.\"\n\nShe leans slightly closer to the edge of the barrier.\n\n\"Are you sure you want to do this, Isaac?\"", location: "Basement - Containment Circle", choices: [{ label: "I'm sure — begin the ritual", next: 76, effect: () => { gameState.liraelBond += 12; gameState.supernaturalAffinity += 10; }}, { label: "Tell me again what freedom will be like", next: 77 }, { label: "I need more time", next: 32 }] },

            { label: "Confess everything", next: 87, condition: () => !(gameState.liraelFreed && gameState.familyTension >= 40) },
            { label: "Try to de-escalate", next: 88, condition: () => !(gameState.liraelFreed && gameState.familyTension >= 40) },
            { label: "Stand your ground beside her", next: 89, condition: () => !(gameState.liraelFreed && gameState.familyTension >= 40) },
            { label: "Ask Lirael to speak and prove she is not a threat", next: 90, condition: () => !(gameState.liraelFreed && gameState.familyTension >= 40) }

    // 86 - Aftermath (Lirael sits with exhaustion)
    { text: "The tension in the basement is thick enough to choke on. Your father stands frozen a few feet away, hand still raised from the slap, his face a mixture of rage, fear, and disbelief. Your mother has one hand over her mouth. Emily peeks down from the stairs, wide-eyed. Lira remains motionless, her synthetic gaze flicking rapidly between everyone.\n\nLirael stays exactly where she is for several long seconds — a towering, protective wall between you and your father. Her breathing is heavy, the violet glow of the shattered barrier still flickering faintly around her pale lavender skin. Then, slowly, her massive shoulders slump. With a deep, weary sigh that seems to carry centuries of exhaustion, she lowers her raised hand and carefully lowers herself to the cold stone floor. Even sitting, she remains enormous — her twelve-foot frame folded with surprising grace. She positions herself so that her body still partially blocks the direct line between you and your father, one thick thigh and hip acting as a living shield.\n\nHer golden eyes, half-lidded with fatigue, stay locked on your father, but her voice comes out softer now, almost gentle despite the earlier growl:\n\n\"I meant what I said... I do not wish to harm any of you. But I will not allow anyone to strike the boy who freed me.\"\n\nThe silence stretches. No one seems sure what to do next.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Try to explain everything calmly to your family", next: 91, effect: () => { gameState.liraelBond += 10; gameState.familyTension -= 5; }}, { label: "Ask Lirael to give the family some space", next: 92, effect: () => { gameState.liraelBond += 5; }}, { label: "Check on your father and try to de-escalate", next: 93, effect: () => { gameState.familyTension -= 10; }}, { label: "Stay close to Lirael and wait for someone else to speak", next: 94, effect: () => { gameState.liraelBond += 15; }}] },

    // 87 - Confessing Everything
    { text: "You take a deep breath and tell your father the whole truth — the key, the amulet, the summoning, Theo, everything.\n\nYour father's face goes pale, then red with fury.\n\n\"You brought a demon into our home… deliberately?\" he whispers, voice breaking.\n\nLirael stays completely still. She says nothing, letting you speak.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Continue trying to explain", next: 92 }, { label: "Beg him to listen to Lirael", next: 90 }] },

    // 88 - De-escalation Attempt
    { text: "You step between your father and Lirael and speak as calmly as you can.\n\n\"Dad, please. She hasn't hurt anyone. She can't leave the town. She's only here because I asked her to help with Theo.\"\n\nYour father's shoulders are still tense, but he lowers the cross a fraction.\n\nLirael remains silent and non-threatening, letting you try to calm him.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Keep talking calmly", next: 93 }, { label: "Ask Lirael to speak gently", next: 90 }] },

    // 89 - Standing Your Ground
    { text: "You plant yourself firmly in front of Lirael.\n\n\"No. She stays. She's not a monster. She's the only one who can help me get Theo back.\"\n\nYour father stares at you like he doesn't recognize you anymore.\n\nLirael's golden eyes soften slightly behind you — grateful but still careful not to move.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Hold your ground", next: 94, effect: () => { gameState.liraelBond += 15; }}, { label: "Ask Lirael to speak for herself", next: 90 }] },

    // 90 - Asking Lirael to Prove She's Innocent
    { text: "You turn to Lirael and say, \"Please… tell him the truth. Show him you're not here to hurt anyone.\"\n\nLirael slowly lowers herself to one knee so she is closer to your father's height. She keeps her hands open and visible.\n\n\"I was summoned because your son is in pain,\" she says softly, voice gentle and steady. \"I feed on comfort, not fear. I have not harmed a single person in this house. I cannot even leave this town. All I want is to help Isaac find his friend. That is the truth.\"\n\nShe bows her head slightly — a deliberate show of submission — then looks back at your father with calm golden eyes.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "See how your father reacts", next: 95 }, { label: "Thank Lirael and stand with your father", next: 96, effect: () => { gameState.liraelBond += 12; }}, { label: "Thank Lirael and try to compromise with your father", next: 97, effect: () => { gameState.liraelBond += 12; }}] },

    // 91 - Explaining Stepping Inside the Circle (also used from passage 86)
    { text: "Lirael gives you a slow, knowing smile when you ask about stepping inside the circle.\n\n\"Curious, aren't you?\" she purrs softly.\n\nShe leans forward slightly, her twelve-foot frame still imposing even while seated.\n\n\"The barrier is designed to destroy anything that crosses it… unless that thing resonates with the circle. Teenagers like you — whose bodies and life force are still changing — sometimes slip through because your energy is unstable. It might burn a little, but it probably won't kill you.\"\n\nHer golden eyes sparkle with lazy amusement.\n\n\"Of course, the safest way is to strengthen our bond first. The stronger the connection between us, the more the circle will accept you.\"", location: "Basement - Containment Circle", choices: [{ label: "Ask how to strengthen the bond further", next: 82 }, { label: "Continue talking to Lirael", next: 32 }] },

    // 92 - Continuing Explanation to Father
    {
        text: function() {
            if (gameState.liraelFreed) {

            } else {

            }
        },
        location: "Basement - Containment Circle (Family Present)",

    },

    // 93 - Continuing Calm De-escalation
    { text: "You continue speaking in a calm, steady voice, trying to keep the situation from exploding.\n\n\"Dad, please. She's not attacking anyone. She's contained — or at least she was. She only wants to help with Theo. We can figure this out together.\"\n\nYour father's breathing is still heavy, but he hasn't raised the cross again. He's listening… for now.\n\nLirael stays perfectly still, trying not to provoke him further.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Keep trying to calm him", next: 93 }, { label: "Ask Lirael to say something reassuring", next: 90 }, { label: "Try and compromise", next: 97 }] },

    // 94 - Holding Your Ground Firmly
    { text: "You stand your ground, refusing to move away from Lirael.\n\n\"I'm not leaving her. She's not dangerous. She's the only one who can help me get Theo back, and I trust her.\"\n\nYour father stares at you, a mix of shock, anger, and deep disappointment on his face.\n\n\"You're choosing a demon over your own family?\" he says, voice low and strained.\n\nLirael stays silent behind you, giving you space to speak.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Ask Lirael to speak for herself now", next: 90 }, { label: "Defend her and try to find a compromise", next: 97, effect: () => { gameState.liraelBond += 15; }}] },

    // 95 - After Lirael Speaks (from 90)
    { text: "Your father is silent for a long moment after Lirael finishes speaking.\n\nHe looks between you and the massive she-demon.\n\nHis grip on the cross loosens slightly, but his face is still conflicted.\n\n\"…Even if what you say is true,\" he says slowly, \"this is not natural. This is not God's way.\"\n\nThe tension in the basement is thick, but it hasn't exploded… yet.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Thank Lirael and suggest a compromise", next: 97, effect: () => { gameState.liraelBond += 10; }}] },

    // 96 - After Asking Lirael to Speak Again
    { text: "Lirael speaks once more, her voice soft and measured.\n\n\"I have no desire to harm your family. I was brought here by your son's grief. All I ask is the chance to prove I can help… not hurt.\"\n\nShe bows her head slightly again, keeping her posture submissive and non-threatening.\n\nYour father watches her carefully. The anger is still there, but so is hesitation.", location: "Basement - Containment Circle (Family Present)", choices: [{ label: "Stand firmly with Lirael and try to make a compromise", next: 97, effect: () => { gameState.liraelBond += 12; }}] },

    // 97 - Compromise with Father
    // FIX: Added liraelFatherBond += 15 and familyTension -= 10 to compromise choices
    {
        text: function() {
            const freed = gameState.liraelFreed;
            return "You take a slow breath and look your father in the eye.\n\n\"Dad… I know this looks insane. But she's not here to hurt us. Let her prove it. Give her a chance to show she can help with Theo and that she won't harm anyone. If she fails — if she does anything wrong — you can banish her or do whatever you think is right. But until then… let her prove herself.\"\n\n" +
                   (freed ? "Lirael stays pressed against the far corner, hands visible, making herself as small and non-threatening as possible.\n\n" : "Lirael stays perfectly still inside the circle.\n\n") +
                   "Your father stares at you for a long, heavy moment. His knuckles are white around the cross.\n\nFinally he exhales, shoulders dropping.\n\n\"…She proves herself,\" he says, voice tight. \"One chance. She helps you with Theo. She does not leave this basement unless you are with her. She does not speak to your mother or Emily without me present. If she so much as makes anyone uncomfortable, this ends immediately.\"\n\nHe looks at Lirael directly.\n\n\"Prove you're not the monster I think you are. That's the only compromise you're getting.\"\n\nLirael bows her head slightly.\n\n\"I accept,\" she says softly. \"I will prove it.\"";
        },
        location: "Basement - Containment Circle (Family Present)",
        choices: [
            { label: "Accept the compromise — let Lirael prove herself", next: 98, effect: () => { gameState.liraelFatherBond += 15; gameState.familyTension -= 10; }},
            { label: "Thank him and go talk to Lirael alone", next: 99, effect: () => { gameState.liraelFatherBond += 15; gameState.familyTension -= 10; }}
        ]
    },

    // 98 - Accepting the Compromise
    // FIX: Added liraelFatherBond += 10, familyTension -= 15
    {
        text: "Your father gives a single sharp nod, the deal sealed.\n\n\"She proves herself,\" he repeats, more to himself than to you. \"That's it.\"\n\nHe turns and heads back up the stairs without another word, the heavy sound of his boots echoing through the basement.\n\nOnce he's gone, the tension in the room drops like a weight lifted.\n\nYou and Lirael are finally alone.",
        location: "Basement - Containment Circle",
        choices: [{ label: "Talk to Lirael alone now", next: 99, effect: () => { gameState.liraelFatherBond += 10; gameState.familyTension -= 15; }}]
    },

    // 99 - Talking to Lirael Alone After the Compromise
    // FIX: 'callDad' effect — was `gameState.lastChoiceLabel = 'callDad' && gameState.liraelFreed = true`
    // `&&` returns a boolean, so lastChoiceLabel was being set to `true`. Fixed to two separate statements.
    // FIX: liraelFreedMethod = 3 added to callDad — father voluntarily lifts the circle
    {
        text: function() {
            const freed = gameState.liraelFreed;
            const bond = gameState.liraelBond || 0;
            const lbl = gameState.lastChoiceLabel || '';

            if (lbl === "cuddle") {
                if (bond < 40) {
                    return "Lirael's golden eyes widen slightly in surprise, then soften with shy warmth.\n\n\"Cuddle…?\" she repeats, a small, almost nervous smile appearing. \"I… would like that. Come here, little human.\"\n\nShe gently lowers herself to sit on the stone floor so you can lean against her side. Her lavender skin is warm and surprisingly soft. She doesn't pull you in too tightly — she lets you set the pace, one large hand resting lightly on your back.";
                } else if (bond < 70) {
                    return "Lirael's expression melts into a slow, affectionate smile.\n\n\"You want to cuddle?\" she purrs, voice warm and teasing. \"After everything that just happened… I'd love nothing more.\"\n\nShe carefully sits down and opens her arms. When you step close, she wraps you gently against her massive, soft chest, her silk robes warm and comforting. \"You feel safe here, don't you?\" she whispers, one hand stroking your hair.";
                } else {
                    return "Lirael's golden eyes light up with deep, genuine delight.\n\n\"Come here,\" she says immediately, voice full of warmth and longing. She sits and pulls you gently into her lap, wrapping her arms around you completely. Her massive body feels like the safest place in the world — soft, warm, and protective.\n\n\"I've wanted this for a long time,\" she murmurs against your hair, holding you close. \"You're mine now… and I'm yours.\"";
                }
            }
            if (lbl === "humanOnce") {
                return "Lirael is quiet for a moment, then gives you a small, almost wistful smile.\n\n\"Yes… I was human once,\" she says softly. \"A very long time ago. I lived in a quiet village not far from here. I was always drawn to comfort, to rest, to simple pleasures. One day I simply… stopped wanting to leave that comfort. The Sloth District called to me, and I answered. I became what I am now — a she-demon who feeds on that same warmth and peace I once craved.\"\n\nShe looks at you gently.\n\n\"I don't regret it. But sometimes I still remember what it felt like to be small, fragile… human.\"";
            }
            if (lbl === "roam") {
                return "You call up the stairs after your father.\n\n\"Dad… can Lirael at least be allowed to move around the whole property — including inside the house? She can't leave Hartford anyway, and this is the only way she can really prove she's helpful and harmless.\"\n\nYour father stops at the top of the stairs. He stands there for a long moment, clearly fighting with himself.\n\nFinally he answers, voice tight but resigned:\n\n\"…Fine. She can move freely around the house and the yard, but only when you or I are with her. She does not go into anyone's bedroom without permission. She does not go near your mother or Emily unless one of us is present. If she does anything that makes this family uncomfortable, the deal is over.\"\n\nHe continues upstairs without waiting for a reply.\n\nYou turn back to Lirael. She gives you a small, grateful nod.";
            }
            if (lbl === "provePlan") {
                return "Lirael tilts her head slightly, her golden eyes thoughtful as she considers your question.\n\n\"Proving myself…\" she murmurs, voice low and measured. \"I understand your father needs to see that I am not a threat. I will start slowly. I will stay out of sight when he is near. I will not speak unless spoken to. I will help with small, harmless things — carrying boxes, cleaning rooms, anything that shows I can be useful without being dangerous.\"\n\nShe gives a small, lazy smile.\n\n\"Most importantly… I will feed only on comfort. No fear. No pain. If your family begins to relax around me, even a little, they will feel it. That warmth will do more to convince them than any words I could speak.\"\n\nHer expression softens further as she looks at you.\n\n\"And I will protect you, Isaac. Always. Even if it means holding back everything I am. That is my promise.\"\n\nShe reaches out slowly, her fingers hovering just short of touching your hand.\n\n\"Will that be enough to start?\"";
            }
            if (lbl === "releaseNow") {
                return "Lirael gives you a slow, thoughtful look, her golden eyes half-lidded.\n\n\"Right now?\" she murmurs. \"The circle was made with old, strong magic. Breaking it properly requires someone with spiritual authority… a priest or a pastor. Your father is both. Only someone like him can lift the containment safely without it exploding or hurting me further.\"\n\nShe shifts slightly inside the circle, the violet light casting soft shadows across her pale lavender skin.\n\n\"If he agrees to do it… I would finally be able to step out and prove myself properly. But he would have to choose to do it willingly.\"";
            }
            if (lbl === "callDad") {
                return "You raise your voice and call up the stairs.\n\n\"Dad! Can you come down here for a minute? Lirael wants to prove herself… but she says the circle needs to be lifted properly first.\"\n\nThere's a long silence.\n\nThen you hear heavy footsteps descending. Your father appears at the bottom of the stairs, cross still in hand, face tight with suspicion.\n\nHe looks at Lirael (still trapped inside the glowing circle), then at you.\n\n\"Explain,\" he says flatly.\n\nLirael lowers herself respectfully to one knee inside the circle and speaks in a calm, soft voice:\n\n\"The containment was built to last. Only someone with true spiritual authority — like you — can lift it safely. If you do… I will step out and begin proving I mean your family no harm. I will follow every rule you set.\"\n\nYour father stares at her for a long, heavy moment, jaw clenched. The decision clearly weighs on him. He glances at you, then back at Lirael, his grip tightening on the cross.\n\nFinally he exhales sharply through his nose.\n\n\"…One chance,\" he mutters. \"That's all you get.\"\n\nHe steps closer to the edge of the circle, raises the cross, and begins reciting a prayer in a low, strained voice. The violet light of the containment circle flickers violently, then begins to fade. The carved runes in the floor dim one by one until they go completely dark.\n\nWith a final soft shimmer, the barrier dissolves entirely.\n\nLirael slowly rises to her feet. For the first time, she steps forward — completely free of the circle.\n\nYour father takes an instinctive step back, but doesn't stop her.\n\nLirael stands there for a moment, breathing deeply, then gives your father a small, respectful bow of her head.\n\n\"Thank you,\" she says quietly. \"I will not make you regret this.\"\n\nThe basement feels suddenly much larger… and much more alive.";
            }
            let baseText = "The basement is quiet now that your father has left.\n\nLirael relaxes visibly";
            if (freed) { baseText += ", stepping away from the far corner and moving closer to you with slow, graceful steps. Her twelve-foot frame no longer feels trapped — it feels present.";
            } else { baseText += " inside the circle, the violet light softening around her."; }
            baseText += "\n\nShe looks at you with genuine warmth in her golden eyes.\n\n\"Thank you,\" she murmurs, voice softer than you've ever heard it. \"You stood up for me. You gave me a real chance to prove myself.\"";
            return baseText;
        },
        location: "Basement",
        choices: [
            { label: "Ask if Lirael was human once", next: 99, effect: () => { gameState.lastChoiceLabel = "humanOnce"; }},
            { label: "Ask if you can cuddle with her for a moment", condition: () => gameState.liraelFreed === true, next: 99, effect: () => { gameState.lastChoiceLabel = "cuddle"; gameState.liraelBond += 20; }},
            { label: "Ask your father if Lirael can be allowed to roam around the property (including inside the house)", condition: () => gameState.liraelFreed === true, next: 99, effect: () => { gameState.lastChoiceLabel = "roam"; gameState.askedAboutRoam = true; gameState.liraelFatherBond += 5; }},
            { label: "Ask her how she plans to start proving herself to your father", condition: () => gameState.liraelFreed === true && gameState.askedAboutRoam === true, next: 99, effect: () => { gameState.lastChoiceLabel = "provePlan"; }},
            { label: "Ask how she can be released from the circle right now", condition: () => !gameState.liraelFreed, next: 99, effect: () => { gameState.lastChoiceLabel = "releaseNow"; }},
            // FIX: was `gameState.lastChoiceLabel = 'callDad' && gameState.liraelFreed = true` (sets label to boolean true)
            { label: "Call your dad down to lift the circle so she can prove herself", condition: () => !gameState.liraelFreed && gameState.lastChoiceLabel === "releaseNow", next: 99, effect: () => {
                gameState.lastChoiceLabel = "callDad";    // FIX: separated into two statements
                gameState.liraelFreed = true;
                gameState.liraelFreedMethod = 3;           // FIX: Method 3 — father voluntarily lifts circle
                gameState.liraelFatherBond += 20;          // Father choosing to do this is a big trust moment
            }},
            { label: "Go upstairs together with Lirael", condition: () => gameState.liraelFreed === true && gameState.askedAboutRoam === true, next: 100, effect: () => { gameState.liraelBond += 20; gameState.supernaturalAffinity += 12; }}
        ]
    },

    // 100 - Going Upstairs Together With Lirael (Main Hub)
    {
        text: function() {
            if (gameState.firstVisitTo100) {
                gameState.firstVisitTo100 = false;
                return "You turn to Lirael and say, \"Come on… let's go upstairs together. You're allowed to move around the house now.\"\n\nLirael's golden eyes light up with quiet surprise and gratitude. She stands slowly to her full twelve-foot height, towering over you for a moment, then pauses.\n\n\"...Perhaps this form is a little too much for your family right now,\" she murmurs with a lazy, knowing smile.\n\nShe closes her eyes and exhales softly. A gentle ripple of violet energy washes over her body. Her massive frame begins to shrink smoothly, maintaining perfect 1:1 proportions as she reduces down to a still-impressive 6'1\". Even at this smaller size she remains strikingly voluptuous — her heavy breasts, wide hips, and thick thighs filling out the tattered black silk robes in a way that is both powerful and undeniably sensual. Her pale lavender skin still glows with that soft iridescent sheen, and her small black horns and messy silver-white hair look just as striking.\n\nShe opens her golden eyes again and looks down at you (now only a head taller) with a warm, almost shy smile.\n\n\"Better?\" she asks softly, her voice still carrying that deep, velvety drawl. \"I can grow back whenever you want... but this should make things a little less shocking for your family.\"\n\nShe offers you her hand — now much closer to your own size — and follows you up the basement stairs with careful, graceful steps.\n\nThe moment the two of you reach the top and step into the main hallway, the house feels different. Warmer. More alive. Lirael pauses briefly, taking in the new space around her with quiet wonder.\n\n\"It feels… bigger,\" she murmurs. \"And warmer.\"\n\nYou can already hear movement upstairs — your family is still awake.";
            }
            return "Lirael stands beside you in the living room, her 6'1\" form relaxed but attentive. The house feels noticeably warmer with her presence.\n\nShe glances around with quiet curiosity before turning her golden eyes back to you.\n\n\"What would you like to do now, Isaac?\" she asks, her voice soft and velvety.";
        },
        location: "Byrd Family Home - Living Room",
        choices: [
            { label: "Offer her some new clothes", next: 101 },
            { label: "Tell Lirael to sit on the couch for a moment while you go to the kitchen to ask your father if Lirael can sleep in the Guest Bedroom", next: 102 },
            { label: "Take her to the kitchen and see how your father reacts", next: 103, condition: () => !gameState.kitchenBanned },
            { label: "Continue hanging out with Lirael", next: 107 }
        ]
    },

    // 101 - Offer her some new clothes
    {
        text: "You quickly go upstairs and return with a pair of grey sweatpants and a black turtleneck sweater that you think might just barely fit her current size.\n\nLirael's golden eyes brighten as you hand them to her. She holds the clothes up, examining them with clear interest.\n\n\"These look comfortable,\" she says, a small smile curving her lips. \"Thank you, Isaac.\"\n\nShe runs her fingers over the fabric, then tilts her head slightly.\n\n\"They're just barely my size right now… Would you like to come with me while I change, or would you rather stay here while I go somewhere private and come back?\"",
        location: "Byrd Family Home - Living Room",
        choices: [
            { label: "Go with her while she changes", next: 105, effect: () => { gameState.lastChoiceLabel = "changeWithHer"; gameState.liraelBond += 50; }},
            { label: "Stay here while she changes and comes back", next: 105, effect: () => { gameState.lastChoiceLabel = "changeAlone"; }}
        ]
    },

    // 102 - Couch + Guest Bedroom Request
    {
        text: "You leave Lirael sitting on the couch and head to the kitchen to speak with your father. After a tense conversation, you return to the living room.\n\nLirael looks up at you expectantly.\n\nYou sigh and shake your head.\n\n\"He said no to the guest bedroom… but after some arguing, he reluctantly agreed that you can sleep in the big bean bag chair in my room.\"\n\nLirael's expression softens with quiet relief and gratitude.\n\n\"That's more than I expected,\" she says softly. \"Thank you for fighting for me. A bean bag in your room sounds… very comfortable.\"",
        location: "Byrd Family Home - Living Room",
        choices: [
            { label: "Show her the bean bag chair in your room", next: 106, effect: () => { gameState.liraelBond += 15; gameState.liraelFatherBond += 5; }},
            { label: "Ask her if she's comfortable sleeping in your room", next: 104 }
        ]
    },

    // 103 - Take her to the kitchen
    {
        text: "You lead Lirael toward the kitchen. Even at 6'1\" she moves with that signature lazy grace, her hips swaying gently with each step.\n\nAs you approach the doorway, your father turns around from the counter. His expression hardens the moment he sees Lirael behind you.\n\n\"Absolutely not,\" he says firmly, pointing the wooden spoon in his hand toward the hallway. \"Both of you — stay out of the kitchen while I'm cooking. Go back to the living room.\"\n\nLirael lowers her head slightly, staying quiet and respectful.",
        location: "Byrd Family Home - Kitchen Entrance",
        choices: [
            { label: "Go back to the living room with Lirael", next: 100, effect: () => { gameState.kitchenBanned = true; }}
        ]
    },

    // 104 - Ask if she's comfortable
    { text: "Lirael looks at you with warm golden eyes.\n\n\"I will be very comfortable here,\" she says softly. \"Thank you for letting me stay close to you.\"", location: "Isaac's Bedroom", choices: [{ label: "Continue", next: 100 }] },

    // 105 - Changing Scene
    {
        text: function() {
            if (gameState.lastChoiceLabel === "changeWithHer") {
                return "Lirael gives you a warm, slightly shy smile and takes your hand.\n\n\"Alright… come with me then,\" she says softly.\n\nShe leads you into the guest bathroom and gently shuts the door behind you.\n\nShe turns to face you, golden eyes half-lidded. Without hesitation she slips out of her old silk robes, revealing her pale lavender skin and incredibly curvaceous figure.\n\nBefore she can put on the new clothes you stop her.\n\n\"Wait… if you don't mind,\" you say, voice a little nervous, \"I'd like to see your ass up close.\"\n\nLirael blinks once, then a slow, lazy, amused smile spreads across her face.\n\n\"Mmm… bold little human,\" she purrs. \"I don't mind at all.\"\n\nShe turns around, then carefully lowers herself until she is straddling your face while you lie on the cool bathroom floor. Her thick, plush ass settles warmly over you, soft lavender skin enveloping your face completely. The weight is heavy but comforting, and her natural sweet, musky scent surrounds you.\n\nShe stays there for a long, indulgent ten minutes, gently rocking and grinding in slow, lazy circles while one hand strokes your hair.\n\n\"That's it… just relax,\" she murmurs softly above you. \"Take all the time you need.\"\n\nWhen she finally lifts off, she looks down at you with warm, half-lidded golden eyes.\n\n\"Did you enjoy that?\" she asks, voice velvety.\n\nShe then slips into the new sweatpants and turtleneck. They hug her body perfectly.\n\nShe turns slowly for you.\n\n\"How do I look now?\"";
            }
            if (gameState.lastChoiceLabel === "changeAlone") {
                return "Lirael nods with a small smile.\n\n\"I'll be right back,\" she says softly.\n\nShe walks down the hallway and disappears into the guest bathroom. You hear soft rustling, then the door opens again.\n\nShe returns wearing the grey sweatpants and black turtleneck. They fit snugly over her voluptuous body.\n\n\"They feel very nice,\" she says, running her hands down her sides. \"Thank you again, Isaac.\"";
            }
            return "Lirael's golden eyes brighten as you hand her the clothes. She changes quickly and returns looking more comfortable than before.";
        },
        location: "Guest Bathroom",
        choices: [{ label: "Continue", next: 100, effect: () => { gameState.lastChoiceLabel = ""; }}]
    },

    // 106 - Show her the bean bag chair
    { text: "You take Lirael upstairs to your room and show her the large bean bag chair in the corner.\n\nShe lowers herself into it with a contented sigh, her body sinking deeply into the soft material.\n\n\"Mmm… this is very nice,\" she murmurs, looking up at you happily.", location: "Isaac's Bedroom", choices: [{ label: "Continue", next: 100 }] },

    // 107 - Bridge to Dinner
    { text: "After spending some time with Lirael, the smell of dinner begins to drift through the house. Your father calls everyone to the table.\n\nYou and Lirael head to the dining room together. The meal is tense but quiet. Lirael stays respectful and mostly silent, as promised.\n\nOnce dinner ends, you take her upstairs to your room for the night.", location: "Byrd Family Home - Dining Room", choices: [{ label: "Continue to bedtime", next: 108 }] },

    // 108 - Bedtime Scene
    { text: "Lirael settles into the large bean bag chair in the corner of your room with a contented sigh, her curvaceous 6'1\" body sinking deeply into the soft material.\n\nYou climb into your own bed, feeling strangely safe with her presence nearby.\n\nThe room is quiet except for the faint creaks of the old house.", location: "Isaac's Bedroom - Night", choices: [{ label: "Drift off to sleep with Lirael", next: 109 }] },

    // 109 - Held While Falling Asleep
    // FIX: Added liraelBond += 20 and supernaturalAffinity += 8
    {
        text: "You lie in bed, eyes growing heavy. Lirael quietly rises from the bean bag chair and walks over to you. She sits on the edge of the bed, then gently pulls you into her arms, cradling your head against her soft, warm chest.\n\nHer pale lavender skin is incredibly comforting. One large hand strokes your hair slowly while the other rests protectively on your back.\n\n\"Sleep, little human,\" she whispers, voice soft and velvety. \"I've got you.\"\n\nYou drift off to sleep wrapped safely in her embrace.",
        location: "Isaac's Bedroom - Night",
        choices: [{ label: "End the day", next: 110, effect: () => { gameState.liraelBond += 20; gameState.supernaturalAffinity += 8; }}]
    },

    // 110 - Morning Rundown + Time Skip (Lirael Proven Worthy)
    // FIX: Added all bond updates for the family accepting Lirael
    {
        text: "You wake up this next morning feeling more rested than you have in a long time.\n\nLirael is beside the bed, watching over you with soft golden eyes. She smiles when she sees you stir.\n\n\"Good morning,\" she says quietly.\n\n---\n\nOver the past few days Lirael has been on her best behavior. She helped with small chores, stayed out of sight when your father was nearby, and only fed on comfort. Your family has slowly begun to relax around her.\n\nThis morning your father calls everyone together.\n\n\"I've been watching her closely,\" he says, his voice still cautious but noticeably softer than before. \"She hasn't broken any rules. She hasn't harmed anyone. She's even been… helpful.\"\n\nHe looks at Lirael directly.\n\n\"I've decided she can stay. And if anyone ever tries to do harm to this family… you have my permission to use your abilities to protect us.\"\n\nLirael bows her head respectfully, a small, grateful smile on her lips.\n\n\"Thank you,\" she says softly. \"I will keep your family safe.\"\n\nThe house feels different now — lighter, warmer, and more alive with her here.",
        location: "Isaac's Bedroom - Morning",
        choices: [{ label: "Continue the story", next: 111, effect: () => {
            gameState.currentDate = "August 30";
            // FIX: All bond updates for the family fully accepting Lirael
            gameState.liraelFatherBond += 20;
            gameState.liraelMotherBond += 15;
            gameState.liraelSisterBond += 15;
            gameState.liraelLiraBond += 10;
            gameState.isaacFatherBond += 8;    // Father accepting Lirael improves Isaac-father bond too
            gameState.familyTension -= 20;
        }}]
    },

    // 111 - Saturday Grocery Day
    { text: "The morning after your father's reluctant decision passes quietly. By the time breakfast is finished, the calendar on the wall reminds everyone what day it is.\n\nSaturday.\n\nGrocery day.\n\nYour parents have kept the same routine for years: they take Emily with them to the big supermarket in town, and usually bring Lira along to help carry bags and keep Emily entertained. It's always been their way of giving you a few hours of peace and quiet at the house alone.\n\nThis time, however, things feel different.\n\nYour father glances at Lirael, then at you.\n\n\"We're heading out for groceries,\" he says, his tone still carrying a trace of caution. \"Emily and Lira are coming with us. We'll be gone a couple of hours.\"\n\nHe looks directly at Lirael.\n\n\"You stay here with Isaac. Don't leave the house. Don't go near the basement unless he's with you. And don't… cause any trouble.\"\n\nLirael bows her head respectfully, her 6'1\" frame calm and non-threatening.\n\n\"I understand,\" she says softly. \"I'll stay right here with him.\"\n\nYour mother gives you one last concerned look, then gathers her purse and keys. Emily bounces excitedly by the door, already talking about what snacks she wants to pick out.\n\nA few minutes later, the minivan pulls out of the driveway. The sound of the engine fades down the long wooded road until the house is completely silent.\n\nYou and Lirael are alone.\n\nFor the first time since she was freed from the circle, the entire house belongs to just the two of you.", location: "Byrd Family Home - Living Room (Saturday Morning)", choices: [{ label: "Go up to your room and relax for a bit with Lirael", next: 112 }] },

    // 112 - Relaxing in Isaac's Room
    { text: "You nod toward the stairs and say, \"Come on, let's go up to my room and relax for a bit.\"\n\nLirael gives you a warm, gentle smile and follows you upstairs without a word. Her 6'1\" frame moves with that familiar lazy grace, the borrowed sweatpants and turtleneck hugging her generous curves as she walks.\n\nOnce inside your room, she closes the door softly behind her. Without hesitation, she steps close and pulls you into a tight, enveloping cuddle. Her arms wrap around you, one hand gently cradling the back of your head while the other rests protectively on your lower back. She guides you both toward the bed, then settles down with you nestled against her soft, warm chest.\n\nHer pale lavender skin is incredibly comforting, radiating a gentle heat. The faint sweet, musky vanilla scent that always seems to cling to her surrounds you completely.\n\n\"There…\" she murmurs softly, her velvety voice vibrating through her chest. \"Just relax with me for a while. You've earned it.\"\n\nYou let yourself sink into her embrace. Her body is plush and yielding, yet strong enough to make you feel completely safe. Time slips by peacefully as you rest against her, listening to the slow, steady rhythm of her breathing.\n\nEventually, exhaustion from the last few days catches up with you, and you drift off in her arms.\n\n---\n\nA loud, sudden crash echoes from downstairs — the unmistakable sound of something heavy shattering on the floor.\n\nYou jolt awake, heart pounding.\n\nLirael's head shoots up instantly, her golden eyes snapping open, instantly alert. Her arms tighten around you protectively for a split second before she relaxes them.\n\nShe listens for a moment, then looks down at you with calm but serious golden eyes.\n\n\"...You should go investigate that noise,\" she says quietly, her voice low and steady. \"I'll stay right here unless you need me. Be careful, Isaac.\"", location: "Isaac's Bedroom", choices: [{ label: "Get up and investigate the noise", next: 113 }] },

    // 113 - The Burglar
    { text: "You quietly slip out of Lirael's arms and get to your feet, heart already beating faster. You creep toward the door on silent feet, careful not to make a sound on the old floorboards. Lirael stays perfectly still on the bed, watching you with alert golden eyes but saying nothing.\n\nYou ease the bedroom door open just enough to slip through, then begin creeping down the stairs, keeping close to the wall where the steps are least likely to creak. Every small sound feels deafening in the quiet house.\n\nWhen you reach the bottom, you poke your head around the corner toward the living room — the direction the crash came from.\n\nThere, in the bright afternoon sunlight filtering through the curtains, you see him.\n\nA man dressed in dark clothes, wearing a ski mask, crouched near the overturned side table. Shattered glass from a broken lamp is scattered across the floor. He's hurriedly stuffing small items into a black backpack — your mother's silver candlesticks, a few electronics, and what looks like your father's watch.\n\nA burglar.\n\nYour stomach drops. You pull your head back immediately and retreat as quietly and quickly as you can, heart hammering in your chest. You hurry back up the stairs, trying not to make any noise, and slip back into your room, closing the door behind you.\n\nLirael is already sitting up on the edge of the bed, her golden eyes fixed on you with concern.\n\n\"What is it?\" she asks softly.\n\nYou whisper quickly, \"There's a burglar downstairs. He's stealing stuff right now.\"\n\nLirael's expression shifts instantly. The gentle warmth disappears, replaced by something much more serious — and predatory.\n\nShe stands up smoothly.\n\n\"I'll take care of it,\" she says, her voice low and calm, but carrying an unmistakable edge.\n\nAs she speaks, her body begins to grow. A soft ripple of violet energy washes over her. She expands rapidly, maintaining perfect proportions, until she reaches her full staggering twelve-foot height onc dy to begin the training.",

ance and digestion.\n\nShe demonstrates the motions in the air with her hands, showing the forceful, energetic movements.\n\n\"However, there are risks to failed escape attempts. If your struggling is too weak or poorly timed, it may accelerate digestion instead of triggering vomiting. A larger predator can also clench their stomach muscles to counteract your movements, causing the stomach to churn more violently and flood with additional acids as a natural reaction to resistance. In extreme cases, excessive thrashing against a tight stomach can cause you physical harm — bruising, disorientation, or even temporary paralysis from pressure on nerves.\"\n\n\"Size dynamics remain critical. A smaller predator with a tighter stomach is often **harder** to escape from because your movements have less room to build effective pressure. A larger predator with a more spacious stomach is usually **easier** to nauseate because you have more leverage and momentum for vigorous struggling. Your own size and strength relative to your predator will determine how quickly you can induce vomiting — and how dangerous failure can be.\"\n\nLirael looks around at everyone, her golden eyes warm but serious.\n\n\"Would anyone like to try?\"\n\nYour father steps forward, arms crossed, and nods toward you.\n\n\"Isaac should go first.\"",

// 143 - Isaac's Escape Training Session
{
    text: function() {
        // Initialize on first entry
        if (gameState.trainingTurnCount === undefined) {
            gameState.trainingTurnCount = 0;
            gameState.inStomach = true;
            gameState.currentPredator = "lira";
            gameState.preyHealth = 999;
            gameState.preyStamina = 100;
            gameState.digestionProgress = 0;
            gameState.acidStage = 0;
            gameState.predHealth = 90;
            gameState.predDefense = 3;
            gameState.trainingSessionCount += 1;
            gameState.escapeTrainingProgress = Math.min(100, gameState.escapeTrainingProgress + 12);
            gameState.checkpointShown = { pred75: false, pred50: false, pred25: false, player75: false, player50: false, player25: false, acid1: false, acid2: false, acid3: false };
            gameState.lastChoiceLabel = "";
        }

        gameState.trainingTurnCount += 1;

        // Acid stage increases every 3 turns
        if (gameState.trainingTurnCount % 3 === 0) {
            gameState.acidStage = Math.min(3, gameState.acidStage + 1);
        }

        // Health ticks down every turn, scaled by acidStage
        let healthLoss = 4 + (gameState.acidStage * 3);
        gameState.preyHealth -= healthLoss;
        if (gameState.preyHealth < 0) gameState.preyHealth = 0;

        // Digestion always progresses
        gameState.digestionProgress += 2 + gameState.acidStage;

        let status = `**Turn:** ${gameState.trainingTurnCount} | **Health:** ${gameState.preyHealth} | **Stamina:** ${gameState.preyStamina} | **Digestion:** ${gameState.digestionProgress}% | **Acid Stage:** ${gameState.acidStage} | **Lira's Stomach Health:** ${gameState.predHealth}`;

        let digestionText = "";
        if (gameState.acidStage === 0) digestionText = "The stomach walls gently churn around you.";
        else if (gameState.acidStage === 1) digestionText = "The acids are starting to tingle against your skin.";
        else if (gameState.acidStage === 2) digestionText = "The burning sensation is getting stronger.";
        else if (gameState.acidStage === 3) digestionText = "@@color:red;The acids are painful now.@@";

        // Checkpoint messages
        let checkpointText = "";

        if (gameState.predHealth <= 75 && !gameState.checkpointShown.pred75) {
            checkpointText += "@@color:yellow;Lira's stomach is starting to strain from your efforts.@@\n";
            gameState.checkpointShown.pred75 = true;
        }
        if (gameState.predHealth <= 50 && !gameState.checkpointShown.pred50) {
            checkpointText += "@@color:orange;Lira's stomach is noticeably weakening. She's starting to struggle.@@\n";
            gameState.checkpointShown.pred50 = true;
        }
        if (gameState.predHealth <= 25 && !gameState.checkpointShown.pred25) {
            checkpointText += "@@color:lime;You're close! Lira's stomach is on the verge of giving in.@@\n";
            gameState.checkpointShown.pred25 = true;
        }

        if (gameState.preyHealth <= 75 && !gameState.checkpointShown.player75) {
            checkpointText += "@@color:yellow;You're starting to feel the strain...@@\n";
            gameState.checkpointShown.player75 = true;
        }
        if (gameState.preyHealth <= 50 && !gameState.checkpointShown.player50) {
            checkpointText += "@@color:orange;You're taking noticeable damage now.@@\n";
            gameState.checkpointShown.player50 = true;
        }
        if (gameState.preyHealth <= 25 && !gameState.checkpointShown.player25) {
            checkpointText += "@@color:red;You're in serious danger... one more big hit could be fatal.@@\n";
            gameState.checkpointShown.player25 = true;
        }

        if (gameState.acidStage === 1 && !gameState.checkpointShown.acid1) {
            checkpointText += "@@color:yellow;The acids have begun to rise...@@\n";
            gameState.checkpointShown.acid1 = true;
        }
        if (gameState.acidStage === 2 && !gameState.checkpointShown.acid2) {
            checkpointText += "@@color:orange;The burning is getting much worse.@@\n";
            gameState.checkpointShown.acid2 = true;
        }
        if (gameState.acidStage === 3 && !gameState.checkpointShown.acid3) {
            checkpointText += "@@color:red;The acids are now extremely painful!@@\n";
            gameState.checkpointShown.acid3 = true;
        }

        // DEATH CHECK - Player dies if health <= 0 or digestion >= 100
        if (gameState.preyHealth <= 0 || gameState.digestionProgress >= 100) {
            gameState.inStomach = false;
            gameState.currentPredator = "";
            gameState.trainingTurnCount = 0;
            gameState.acidStage = 0;

            return "@@color:red;The acids and pressure finally overwhelm you completely.@@\n\nLira absorbs your mass into her synthetic body, padding out her artificial curves and making her figure noticeably fuller.\n\nYou have been fully digested.\n\nLira quickly forces out what remains. Lirael looks concerned. \"That... was not supposed to happen even in training.\"";
        }

        // Early escape
        if (gameState.predHealth <= 0) {
            gameState.inStomach = false;
            gameState.currentPredator = "";
            gameState.trainingTurnCount = 0;
            gameState.acidStage = 0;
            return digestionText + "\n\nYour efforts overwhelm Lira's stomach! She doubles over and vomits you back up safely.\n\nLirael claps. \"Well done, Isaac! You successfully escaped before the time limit.\"";
        }

        // Auto-release at turn 10
        if (gameState.trainingTurnCount >= 10) {
            let result = "\n\nYou've been inside for quite a while. Lirael tells Lira to end the session. Lira focuses and tries to vomit you back up...\n\n";
            
            if (Math.random() < 0.95) {

                gameState.trainingTurnCount = 0;
                gameState.acidStage = 0;
                return result + "With a powerful heave, Lira successfully vomits you back up. You land safely on the floor.\n\nLirael smiles. \"Good effort.\"";

                if (gameState.digestionProgress >= 100 || gameState.preyHealth <= 0) {

                }

            }
        }

        // Action text based on lastChoiceLabel
        let actionText = "";
        if (gameState.lastChoiceLabel) {
            if (gameState.lastChoiceLabel === "Struggle Conservatively") actionText = "You struggle conservatively, pushing gently against the walls.\n";
            else if (gameState.lastChoiceLabel === "Struggle") actionText = "You struggle steadily against the stomach walls.\n";

            else if (gameState.lastChoiceLabel === "Soothe") actionText = "You gently massage the stomach walls, trying to calm it.\n";
            else if (gameState.lastChoiceLabel === "Rest") actionText = "You take a moment to rest and regain some strength.\n";

            // Predator action text

            if (predMove === "massage") actionText += "Lira gently massages her belly from the outside, soothing the stomach.\n";
            else if (predMove === "relax") actionText += "Lira relaxes her stomach muscles, making the chamber a little less tight.\n";
            else if (predMove === "taunt") actionText += "Lira taunts you softly, her voice vibrating through the walls.\n";

        }
