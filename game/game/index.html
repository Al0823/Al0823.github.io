// 133 - Lirael's Full Explanation and Offer
{
    text: "The family stands in stunned silence as Lirael finishes speaking. Your father’s face is tight with concern, his arms still crossed over his chest. Your mother looks uneasy but remains composed, holding Emily protectively. Emily herself seems more fascinated than scared, her eyes repeatedly drifting back to Lirael’s massively distended stomach, which continues to gurgle and slosh wetly as Grimmold thrashes inside.\n\nLira (the AI) remains perfectly still, quietly processing everything.\n\nLirael lets out a tired sigh, gently rubbing the enormous, double-sized bulge with slow circles.\n\n\"I have tried to put Grimmold down before,\" she admits quietly. \"Multiple times, in fact. But every time I almost succeed, my body forces him back up before he is truly gone. He always finds a way to survive. This time… I truly believe I have won. The fight took more out of him than before.\"\n\nShe pauses as another loud, thick *gluuuurk* echoes from her heavy stomach, the bulge stretching outward noticeably before slowly settling again.\n\n\"If, for some reason, I do end up vomiting him back up… there is something important you should know. A normal person who eats Grimmold and manages to fully digest him would be guaranteed to go to heaven when they die. The act of finally destroying him carries that kind of spiritual weight.\"\n\nLirael looks directly at Emily, her golden eyes soft but serious.\n\n\"That is why, if it ever comes to that, I would like the person to be Emily. From what I have seen of her myself… and from what Isaac has quietly told me about her… she has the strength and the instincts for it. She would succeed where others might fail.\"\n\nEmily’s cheeks flush slightly, but she doesn’t look afraid — only surprised and a little proud.\n\nLirael continues, her hand still resting on the massive, churning swell.\n\n\"It will take me at least twelve hours to digest him at a natural speed. If I were to instantly digest him right now, the sudden expansion of energy and mass would almost certainly rip my current clothes to shreds. I do not mind being nude… but I would rather not have Emily see me that way. So I will let nature take its course this time.\"\n\nShe offers a small, weary smile to the group.\n\n\"There is much more I could tell you about creatures like him, about the old wars between realms, and about how thin the boundary has become in this town. But for tonight… I am simply glad you are all safe.\"\n\nYour father nods slowly, still processing everything. Your mother glances between Lirael and Emily with quiet worry. Emily, however, looks thoughtful — as if the idea of one day finishing what Lirael started doesn’t frighten her at all.",

            return digestionText + "\n\nYour efforts overwhelm Lira's stomach! She doubles over and vomits you back up safely.\n\nLirael claps. \"Well done, Isaac! You successfully escaped before the time limit.\"";
        }

        // Auto-release attempt after 8 turns
        if (gameState.trainingTurnCount >= 8) {
            let result = "\n\nYou've been inside for quite a while. Lirael tells Lira to end the session. Lira focuses and tries to vomit you back up...\n\n";
            
            if (Math.random() < 0.95) {
                gameState.inStomach = false;
                gameState.currentPredator = "";
                gameState.trainingTurnCount = 0;
                gameState.acidStage = 0;
                return result + "With a powerful heave, Lira successfully vomits you back up. You land safely on the floor.\n\nLirael smiles. \"Good effort.\"";
            } else {
                gameState.acidStage = Math.min(3, gameState.acidStage + 1);
                gameState.digestionProgress += 18;
                gameState.preyHealth -= 15;
                return result + "Lira struggles but fails to bring you up. The acids surge violently.\n\nYou have **one last chance** to escape...";
            }
        }

        return "You are inside **Lira's** stomach for training.\n\nLirael stands outside, giving instructions.\n\n" + status + "\n\n" + digestionText + "\n\nWhat will you do?";
    },
    location: "Inside Lira's Stomach (Safe Training)",
    choices: function() {
        const choices = [];
        
        if (gameState.preyStamina > 0 && gameState.preyHealth > 0) {
            choices.push(
                { label: "Struggle Conservatively", next: 143, effect: () => {
                    gameState.preyStamina -= 8;
                    gameState.predHealth -= Math.clamp(random(3,5) - gameState.predDefense, 0, 100);
                    gameState.digestionProgress += 4 + gameState.acidStage;
                    if (Math.random() < 0.45) gameState.escapeTrainingProgress += 8;
                }},
                { label: "Struggle", next: 143, effect: () => {
                    gameState.preyStamina -= 15;
                    gameState.predHealth -= Math.clamp(random(6,9) - gameState.predDefense, 0, 100);
                    gameState.digestionProgress += 7 + gameState.acidStage;
                    if (Math.random() < 0.6) gameState.escapeTrainingProgress += 12;
                }},
                { label: "Struggle Aggressively", next: 143, effect: () => {
                    gameState.preyStamina -= 25;
                    gameState.preyHealth -= 6;
                    gameState.predHealth -= Math.clamp(random(11,15) - Math.round(gameState.predDefense * 0.7), 0, 100);
                    gameState.digestionProgress += 12 + gameState.acidStage;
                    if (Math.random() < 0.75) gameState.escapeTrainingProgress += 18;
                }},
                { label: "Brace Yourself", next: 143, effect: () => {
                    gameState.preyStamina -= 10;
                    gameState.preyHealth += 12;
                }}
            );
        }
        
        if (gameState.preyResilience > 2 && gameState.preyStamina > 15) {
            choices.push({ label: "Probe", next: 143, effect: () => {
                gameState.preyStamina -= 12;
                gameState.predHealth -= Math.clamp(random(5,8) - gameState.predDefense, 0, 100);
                if (Math.random() < 0.7) gameState.escapeTrainingProgress += 15;
            }});
        }
        
        if (gameState.preyResilience > 4 && gameState.preyStamina > 20) {
            choices.push({ label: "Soothe", next: 143, effect: () => {
                gameState.preyStamina -= 14;
                gameState.digestionProgress = Math.max(0, gameState.digestionProgress - 10);
                if (Math.random() < 0.55) gameState.escapeTrainingProgress += 12;
            }});
        }
        
        choices.push({ label: "Rest", next: 143, effect: () => {
            gameState.preyStamina = Math.min(100, gameState.preyStamina + 18);
        }});
        
        // Manual end session
        choices.push({ label: "Ask Lirael to end the session", next: 145, effect: () => {
            gameState.inStomach = false;
            gameState.currentPredator = "";
            gameState.trainingTurnCount = 0;
            gameState.acidStage = 0;
        }});
        
        return choices;
    }
},


    // 999 - Game End / Content Boundary

    {
        text: "Unfortunately this is where the scene ends because I have not made the next scene yet, sorry folks. But please Stay tuned for updates!",
        location: "GAME END",
        choices: [{ label: "Restart the Game", next: 0 }]
    }
];

// ================ RENDERING ================
function renderPassage() {
    gameState.visitedPassages[gameState.currentPassage] = true;

    var p = passages[gameState.currentPassage];
    if (!p) {
        document.getElementById('story').textContent = "Error: passage " + gameState.currentPassage + " not found.";
        return;
    }

    let displayText = typeof p.text === 'function' ? p.text() : p.text;
    document.getElementById('story').textContent = displayText;
    document.getElementById('location-display').textContent = p.location + " — " + gameState.currentDate;

    var choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    let visibleChoices = p.choices.filter(choice => {
        const used = gameState.usedChoices[gameState.currentPassage] || [];
        if (used.includes(choice.label)) return false;
        if (choice.condition && !choice.condition()) return false;
        return true;
    });

    visibleChoices.forEach((choice) => {
        var btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.onclick = () => {
            if (!gameState.usedChoices[gameState.currentPassage])
                gameState.usedChoices[gameState.currentPassage] = [];
            if (!gameState.usedChoices[gameState.currentPassage].includes(choice.label)) {
                gameState.usedChoices[gameState.currentPassage].push(choice.label);
            }
            if (choice.effect) choice.effect();
            gameState.lastPassage = gameState.currentPassage;
            gameState.currentPassage = choice.next;
            renderPassage();
        };
        choicesDiv.appendChild(btn);
    });

    updateStatusBar();
}

function updateStatusBar() {
    if (passages[gameState.currentPassage]) {
        document.getElementById('status-bar').textContent = `Location: ${passages[gameState.currentPassage].location} — ${gameState.currentDate}`;
    }
}

// ================ ADMIN PANEL ================
function toggleAdminPanel() {
    const panel = document.getElementById('admin-panel');
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    if (panel.style.display === 'block') refreshAdminPanel();
}

function refreshAdminPanel() {
    const container = document.getElementById('state-list');
    container.innerHTML = '';
    for (let key in gameState) {
        const value = gameState[key];
        const row = document.createElement('div');
        row.style.margin = '8px 0';
        row.style.padding = '8px';
        row.style.background = '#222222';
        row.style.borderRadius = '4px';
        row.innerHTML = `
            <strong>${key}:</strong> 
            <input type="text" value="${value}" 
                   onchange="updateGameState('${key}', this.value)" 
                   style="background:#333; color:#ddd; border:none; padding:4px; width:65%;">
        `;
        container.appendChild(row);
    }
}

function updateGameState(key, newValue) {
    const current = gameState[key];
    if (typeof current === 'number') gameState[key] = Number(newValue);
    else if (typeof current === 'boolean') gameState[key] = (newValue.toLowerCase() === 'true');
    else gameState[key] = newValue;
    refreshAdminPanel();
}

function quickSet(key, value) {
    gameState[key] = value;
    refreshAdminPanel();
    alert(`Set ${key} = ${value}`);
}

function jumpToPassage() {
    const num = parseInt(document.getElementById('jump-input').value);
    if (!isNaN(num) && passages[num]) {
        gameState.currentPassage = num;
        toggleAdminPanel();
        renderPassage();
    } else {
        alert("Invalid passage number!");
    }
}

function resetGameState() {
    if (confirm("Reset ALL game state?")) location.reload();
}

// Hotkey: Ctrl + Shift + A
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
        e.preventDefault();
        toggleAdminPanel();
    }
});

// ================ MODALS ================
function openModal(type) {
    var modal = document.getElementById('modal');
    var title = document.getElementById('modal-title');
    var content = document.getElementById('modal-content');

    if (type === 'stats') {
        title.textContent = "GAME STATS";
        if (!gameState.statsUnlocked) {
            content.innerHTML = "<p>Stats will be revealed as you progress through the story.</p>";
        } else {
            content.innerHTML = `Family Tension: ${gameState.familyTension}<br>Supernatural Affinity: ${gameState.supernaturalAffinity}<br>Lirael Bond: ${gameState.liraelBond}<br>Father Bond: ${gameState.issacFatherBond}<br>Mother Bond: ${gameState.issacMotherBond}<br>Sister Bond: ${gameState.issacSisterBond}<br>Lira Bond: ${gameState.issacLiraBond}<br>Theo Resurrection Progress: ${gameState.theoResurrectionProgress}%`;
        }
    } else if (type === 'options') {
        title.textContent = "OPTIONS";
        content.innerHTML = `Text Speed: <input type="range" min="1" max="100" value="50"><br><br>Sound Effects: <input type="checkbox" checked>`;
    } else if (type === 'system') {
        title.textContent = "SAVE / LOAD";
        content.innerHTML = `<div class="modal-button" onclick="saveGame()">Save Game</div><div class="modal-button" onclick="loadGame()">Load Game</div>`;
    } else if (type === 'about') {
        title.textContent = "THE DEMON AND I";
        content.innerHTML = `<p>A text-based erotic adventure<br>Isaac Byrd & the trapped she-demon</p>`;
    }
    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('modal').style.display = "none";
}

function saveGame() {
    localStorage.setItem('demonAndISave', JSON.stringify(gameState));
    alert("Game Saved!");
}

function loadGame() {
    var save = localStorage.getItem('demonAndISave');
    if (save) {
        Object.assign(gameState, JSON.parse(save));
        renderPassage();
        alert("Game Loaded!");
    } else {
        alert("No save file found.");
    }
}

function restartGame() {
    if (confirm("Restart the entire story from the beginning?")) {
        location.reload();
    }
}

window.onload = function() {
    renderPassage();
    setInterval(() => {
        var t = document.getElementById('title-text');
        t.style.visibility = (t.style.visibility === 'hidden') ? 'visible' : 'hidden';
    }, 700);
};
</script>
