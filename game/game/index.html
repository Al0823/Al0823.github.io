<!DOCTYPE html>
<html>
<head>
	<!-- Get out my game you thief-->
<meta charset="UTF-8">
<title>The Demon and I</title>
<style>
body { margin:0; padding:0; background:#080808; color:#c0c0c0; font-family:'Courier New', Courier, monospace; }
#container { width:75%; margin:16px auto; border:4px solid #a0a0a0; background:#101010; padding:12px; }
#layout { display:flex; }
#side-panel { width:240px; border:3px solid #505050; background:#111111; padding:12px; margin-right:12px; }
.panel-section { margin-bottom:16px; border:2px inset #404040; padding:10px; background:#181818; }
.panel-title { font-size:13px; color:#ffcc00; margin-bottom:8px; letter-spacing:0.1em; }
.panel-button { display:block; margin:6px 0; padding:8px; border:2px outset #808080; background:#202020; color:#f0f0f0; cursor:pointer; text-align:center; }
.panel-button:hover { background:#303030; }
#main-content { flex:1; }
#titlebar { background:#202020; color:#f8f8f8; padding:14px; border:2px inset #505050; text-align:center; letter-spacing:0.18em; font-size:21px; }
#titlebar .blink { color:#ffcc00; }
#main-frame { margin-top:12px; border:3px solid #505050; background:linear-gradient(180deg,#111 0%,#1a1a1a 100%); padding:14px; }
#story { min-height:400px; background:#121212; border:2px inset #404040; padding:16px; line-height:1.75; white-space:pre-wrap; font-size:15px; }
#choices { margin-top:16px; }
#choices button { margin:5px 8px 5px 0; padding:10px 16px; border:2px outset #808080; background:#202020; color:#f0f0f0; cursor:pointer; font-family:inherit; font-size:14.5px; }
#choices button:hover { background:#303030; }
#status-bar { margin-top:16px; padding:10px; background:#181818; border:2px inset #404040; font-size:13px; text-align:center; }
#modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; }
#modal-box { width:360px; background:#101010; border:3px solid #505050; padding:16px; }
#modal-title { color:#ffcc00; margin-bottom:14px; font-size:18px; }
.modal-button { display:block; margin-top:10px; padding:9px; border:2px outset #808080; background:#202020; cursor:pointer; text-align:center; }
.modal-button:hover { background:#303030; }
</style>
</head>
<body>

<div id="container">
    <div id="layout">
        <div id="side-panel">
            <div class="panel-section">
                <div class="panel-title">LOCATION</div>
                <div id="location-display">Byrd Family Home - Hartford, CT</div>
            </div>
            <div class="panel-section">
                <div class="panel-title">MENU</div>
                <div class="panel-button" onclick="openModal('stats')">View Stats</div>
                <div class="panel-button" onclick="openModal('options')">Options</div>
                <div class="panel-button" onclick="openModal('system')">Save / Load</div>
                <div class="panel-button" onclick="restartGame()">Restart Game</div>
                <div class="panel-button" onclick="openModal('about')">About</div>
            </div>
        </div>

        <div id="main-content">
            <div id="titlebar">
                <span id="title-text" class="blink">THE DEMON AND I</span>
            </div>
            <div id="main-frame">
                <div id="story"></div>
                <div id="choices"></div>
                <div id="status-bar"></div>
            </div>
        </div>
    </div>
</div>

<div id="modal">
    <div id="modal-box">
        <div id="modal-title"></div>
        <div id="modal-content"></div>
        <div class="modal-button" onclick="closeModal()">Close</div>
    </div>
</div>

<script>
// ================ GAME STATE ================
var gameState = {
    currentPassage: 0,
    familyTension: 25,
    supernaturalAffinity: 10,
    liraelBond: 0,
    theoResurrectionProgress: 0,
    hasKey: false,
    hasAmulet: false,
    pathChosen: null,
    liraelFedComfort: false,
    statsUnlocked: false
};

var passages = [
    // 0 - Arrival
    {
        text: "The old minivan’s engine dies with a tired rattle. Cool Connecticut air brushes against your skin as you step out onto the gravel driveway.\n\nThe three-story Victorian house looms before you — dark weathered wood covered in thick ivy, an attic window that seems to stare back. Dense woods press in from all sides.\n\nYour mother, Rebecca, clutches her silver cross tightly. “This is God’s test,” she whispers. Your father, Pastor Michael, mutters about blessing every room. Your little sister Emily (12) bounces excitedly. “It looks like a real haunted mansion!”\n\nYou — Isaac Byrd — stand quietly in your black hoodie, messy dark-brown hair falling into your hazel eyes.\n\nInside the dusty foyer stands Lira, the household AI Companion. She looks almost like a real young woman — smooth skin with a faint glow, shoulder-length dark hair, and calm blue eyes. A glowing prisoner-style tag blinks on her left wrist: “Lira – Model F-7 – Property of Byrd Family”.\n\nShe offers a small, warm smile. “Hey… welcome home. I’ve got the rooms all set up. Just so you know, the house has some… weird energy readings coming from the basement and attic.”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Help the family unpack", next: 1 },
            { label: "Talk to Lira", next: 2 }
        ]
    },

    // 1 - Help unpack
    {
        text: "You spend the next hour carrying boxes upstairs and helping your family settle in. Your mother thanks you quietly. Your father nods approvingly. Emily keeps talking about how cool the house looks.\n\nThe whole time, the old wooden floors creak under your feet, and you can’t shake the feeling that the house is watching you.\n\nWhen you finally finish, Lira approaches you with a gentle expression.\n\n“You’ve been working hard. Everything okay?”",
        location: "Byrd Family Home - Upstairs",
        choices: [
            { label: "Talk to Lira", next: 2 },
            { label: "Go explore the woods behind the house", next: 3 }
        ]
    },

    // 2 - Talk to Lira (Human-like)
    {
        text: "Lira turns toward you, her expression soft and attentive. She shifts her weight slightly — a very human habit.\n\n“Hey Isaac,” she says gently. “You look like you’ve got a lot on your mind already. What do you want to know? I’ll tell you what I can.”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Tell me about the history of this house", next: 4 },
            { label: "What do you mean by weird energy readings?", next: 5 },
            { label: "Have people really disappeared here?", next: 6 },
            { label: "I want to explore the woods behind the house", next: 3 },
            { label: "Never mind for now. Thanks, Lira.", next: 7 }
        ]
    },

    // 3 - Woods Exploration
    {
        text: "You slip out the back door into the dense woods as dusk begins to fall. The ancient trees close in around you. The ground is soft with damp leaves and pine needles. A strange sweet scent lingers in the air.\n\nDeeper in, faint glowing mushrooms guide you toward old stone markers. In a small clearing you find a heavy rusty iron key and a silver amulet etched with a containment circle.\n\nThe moment you pick up the amulet, a warm pulse of energy travels up your arm and settles in your chest.",
        location: "Woods Behind the House",
        choices: [
            { label: "Take the key and amulet and return to the house", next: 7, effect: () => {
                gameState.hasKey = true;
                gameState.hasAmulet = true;
                gameState.supernaturalAffinity += 18;
                gameState.statsUnlocked = true;
            }}
        ]
    },

    // 4 - House History (Lira)
    {
        text: "Lira glances toward the stairs, then back at you, lowering her voice a little.\n\n“This place was built in 1692 during the witch hunts. The original owner was accused of some really dark things… like ‘devouring sinners.’ A lot of families who lived here afterward reported seeing things that shouldn’t exist. And… yeah, quite a few people have gone missing over the years. Most of the stories point to the basement.”\n\nShe gives a small, uneasy shrug. “Kind of creepy, right?”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 3 }
        ]
    },

    // 5 - Energy Readings
    {
        text: "Lira bites her lip lightly. “I’ve been picking up these weird low vibrations and temperature changes, especially strong in the basement and attic. It’s not normal for a house this old. I’m supposed to just report the data, but… honestly? It makes me a little uncomfortable too.”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 3 }
        ]
    },

    // 6 - Disappearances
    {
        text: "Lira’s expression turns more serious. She lowers her voice.\n\n“Yeah… there are records of at least eleven people who vanished while living here. Most disappeared after spending time in the basement. The police eventually stopped looking into it.”\n\nShe adds softly, “Be careful down there, okay?”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 3 }
        ]
    },

    // 7 - After Woods (Key + Amulet obtained)
    {
        text: "You return to the house with the rusty iron key and the silver amulet tucked in your hoodie pocket. The house feels heavier now, like it knows you found something important.\n\nNight is falling. Your family is settling in for the evening.",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Join family for dinner", next: 8 },
            { label: "Try the key on the basement door", next: 9 }
        ]
    },

    // 8 - Family Dinner
    {
        text: "You sit down for dinner with your family. The old dining table creaks under the plates. Your mother prays longer than usual. Your father talks about cleansing the house tomorrow. Emily keeps asking if she can explore the attic.\n\nAs night deepens, the house begins making sounds — slow creaks from upstairs and faint scratching in the walls.\n\nLira stands quietly nearby, occasionally glancing at you with what looks like quiet concern.",
        location: "Byrd Family Home - Dining Room",
        choices: [
            { label: "Go to bed early", next: 10 },
            { label: "Sneak down to the basement with the key", next: 9 }
        ]
    },

    // 9 - Basement (Only accessible with key)
    {
        text: "You sneak downstairs with the rusty key. It slides into the lock with a heavy click. The basement door groans loudly as it opens.\n\nCold, damp air rushes up the stone steps, carrying a faint sweet, musky scent that makes your skin prickle.\n\nAt the bottom is a perfect square stone chamber. In the center is a massive demon summoning and containment circle carved deep into the floor. The runes pulse with faint violet light.\n\nYou carefully place the silver amulet into the wall alcove. The entire circle brightens dramatically.\n\nA powerful warning fills your mind: Anything summoned here will be trapped inside the glowing lines — unable to leave. If any human steps across the barrier… the magic will vaporize them instantly.",
        location: "Basement",
        choices: [
            { label: "Leave the basement and head to the attic", next: 11 }
        ]
    },

    // 10 - Going to Bed Early
    {
        text: "You head upstairs to your new bedroom. The old wooden floor creaks under your feet. As you lie in bed, sleep refuses to come.\n\nThe house is full of noises — slow creaks, faint scratching, and what sounds like soft whispers coming from the walls.\n\nAfter an hour of tossing and turning, you can’t take it anymore.",
        location: "Isaac's Bedroom",
        choices: [
            { label: "Sneak down to the basement", next: 9 },
            { label: "Go up to the attic", next: 11 }
        ]
    },

    // 11 - Attic Discovery (Final pre-summoning)
    {
        text: "Faint scratching sounds from above draw you up the creaky pull-down ladder into the dusty attic.\n\nThe space is stifling and thick with the smell of old paper and dry rot. Old trunks and forgotten furniture fill the room.\n\nAs you move a heavy wooden box, your elbow knocks over a thick leather-bound book. It falls open at your feet.\n\nThe title, embossed in faded gold, reads: 'Ars Goetia – Safe Summoning Rites for Companions and Bound Servants'.\n\nThe pages contain detailed instructions for using the basement circle. Two focus items immediately catch your eye:\n\n- The crumpled drawing of Theo you’ve carried in your hoodie pocket.\n- A strange lock of long, preserved black hair caught in the book’s cracked binding.",
        location: "Attic",
        choices: [
            { label: "Use Theo’s drawing (Summon Lirael)", next: 12, effect: () => { 
                gameState.pathChosen = "Lirael"; 
                gameState.statsUnlocked = true; 
            }},
            { label: "Use the lock of ancient black hair (Summon Morgana)", next: 99, effect: () => { 
                gameState.pathChosen = "Morgana"; 
            }}
        ]
    },

    // 12 - Summoning Lirael (Placeholder)
    {
        text: "At 3:00 AM you stand safely outside the glowing containment circle.\n\nYou toss Theo’s drawing into the center and begin the incantation.\n\nViolet light explodes. A thick scent of warm vanilla and musk fills the room.\n\nA long, luxurious moan echoes.\n\nLirael materializes slowly inside the circle — a voluptuous she-demon with pale silky skin, small black horns, messy silver-white hair, and heavy-lidded golden eyes full of sleepy hunger.\n\nShe stretches languidly, her massive breasts straining against thin black silk.\n\n“Mmmhhhh~… Took you long enough, cute human,” she purrs.",
        location: "Basement - Containment Circle",
        choices: [
            { label: "Continue talking to Lirael", next: 13 }
        ]
    },

    // Placeholders
    { text: "Lirael conversation will be expanded here.", location: "Basement - Containment Circle", choices: [{ label: "Continue", next: 12 }] },
    { text: "Morgana summoning scene coming soon...", location: "Basement", choices: [{ label: "Restart", next: 0 }] }
];

// ================ RENDERING ================
function renderPassage() {
    var p = passages[gameState.currentPassage];
    
    document.getElementById('story').textContent = p.text;
    document.getElementById('location-display').textContent = p.location;

    var choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    p.choices.forEach((choice) => {
        var btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.onclick = () => {
            if (choice.effect) choice.effect();
            gameState.currentPassage = choice.next;
            renderPassage();
        };
        choicesDiv.appendChild(btn);
    });

    updateStatusBar();
}

function updateStatusBar() {
    document.getElementById('status-bar').textContent = `Location: ${passages[gameState.currentPassage].location}`;
}

function openModal(type) {
    var modal = document.getElementById('modal');
    var title = document.getElementById('modal-title');
    var content = document.getElementById('modal-content');

    if (type === 'stats') {
        title.textContent = "GAME STATS";
        if (!gameState.statsUnlocked) {
            content.innerHTML = "<p>Stats will be revealed as you progress through the story.</p>";
        } else {
            content.innerHTML = `
                Family Tension: ${gameState.familyTension}<br>
                Supernatural Affinity: ${gameState.supernaturalAffinity}<br>
                Lirael Bond: ${gameState.liraelBond}<br>
                Theo Resurrection Progress: ${gameState.theoResurrectionProgress}%
            `;
        }
    } else if (type === 'options') {
        title.textContent = "OPTIONS";
        content.innerHTML = `Text Speed: <input type="range" min="1" max="100" value="50"><br><br>Sound Effects: <input type="checkbox" checked>`;
    } else if (type === 'system') {
        title.textContent = "SAVE / LOAD";
        content.innerHTML = `
            <div class="modal-button" onclick="saveGame()">Save Game</div>
            <div class="modal-button" onclick="loadGame()">Load Game</div>
        `;
    } else if (type === 'about') {
        title.textContent = "THE DEMON AND I";
        content.innerHTML = `<p>A text-based erotic horror adventure<br>Isaac Byrd & the trapped she-demon Lirael</p>`;
    }

    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('modal').style.display = "none";
}

function saveGame() {
    localStorage.setItem('demonAndISave', JSON.stringify(gameState));
    alert("Game Saved!");
}

function loadGame() {
    var save = localStorage.getItem('demonAndISave');
    if (save) {
        Object.assign(gameState, JSON.parse(save));
        renderPassage();
        alert("Game Loaded!");
    } else {
        alert("No save file found.");
    }
}

function restartGame() {
    if (confirm("Restart the entire story from the beginning?")) {
        location.reload();
    }
}

window.onload = function() {
    renderPassage();
    setInterval(() => {
        var t = document.getElementById('title-text');
        t.style.visibility = (t.style.visibility === 'hidden') ? 'visible' : 'hidden';
    }, 700);
};
</script>
</body>
</html>
