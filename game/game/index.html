var passages = [
    // 0 - Arrival
    {
        text: "The old minivan's engine coughs, sputters, and finally dies with a long, rattling sigh that seems to echo just a little too loudly in the stillness. For a moment, no one moves.\n\nThen you push the door open.\n\nCool Connecticut air spills in immediately, wrapping around you like something alive. It carries the sharp bite of pine resin, the damp richness of soil that hasn't seen full sunlight in years, and underneath it all… something faintly metallic. It settles on the back of your tongue in a way you can't quite explain.\n\nYou step out.\n\nGravel crunches sharply beneath your sneakers — loud, intrusive, unnatural against the heavy quiet pressing in from all sides. Even that small sound feels like it doesn't belong here.\n\nAnd then you look up.\n\nThe house towers over you.\n\nThree stories tall. Victorian. Ancient.\n\nIts weathered wood has faded into a sickly gray-green, like something left to rot but never allowed to decay fully. Thick ropes of ivy crawl up its walls and wrap around the shutters like veins, clinging, digging in — as if the house is being pulled back into the earth… or refusing to let go.\n\nYour eyes drift upward.\n\nThe attic window.\n\nA perfect black rectangle.\n\nNo reflection. No light. Just emptiness.\n\nAnd yet… you can't shake the feeling that something inside is looking directly at you.\n\nThe woods press in close on all sides — dense, towering, ancient. Their branches knit together overhead, choking out the sky and leaving the entire property trapped in a dim, unnatural twilight. Even though it's still day, it doesn't feel like it.\n\nIt feels like evening.\n\nOr something later.\n\nYour mother, Rebecca, steps out beside you, clutching her silver cross so tightly her knuckles go white. You hear the faint creak of the chain as it strains under the pressure.\n\n\"This is God's test,\" she whispers. The words sound rehearsed. Forced. Like she's trying to convince herself more than anyone else.\n\nYour father, Pastor Michael, slams his door harder than necessary. The sound cracks through the air.\n\n\"Darkness has no place here,\" he mutters immediately, already pacing, already scanning the house like it's something that needs to be confronted. \"We'll cleanse every inch of this property if we have to.\"\n\nEmily practically explodes out of the van, bouncing on her toes, completely oblivious.\n\n\"It looks like a REAL haunted mansion!\" she says, eyes shining. \"Can we explore the attic tonight? Please? PLEASE?\"\n\nYou don't answer.\n\nYou just stand there.\n\nHands shoved deep into your hoodie pocket.\n\nYour messy dark-brown hair shifts slightly as a cold breeze slides past you. Your hazel eyes stay locked on the house.\n\nUpstate New York feels a million miles away now.\n\nAnd Theo…\n\nThat weight in your chest tightens again. Heavy. Unmoving. Unfinished.\n\nInside the foyer, standing perfectly still in the dim light, is Lira.\n\nShe looks… real.\n\nToo real.\n\nSmooth synthetic skin with a faint pearlescent sheen. Shoulder-length dark hair that falls naturally against her face. Calm blue eyes that track each of you as you enter — not mechanically, but attentively.\n\nConcerned.\n\nA soft glow pulses from the tag on her wrist.\n\n\"Lira, Model F-7, Property of Byrd Family.\"\n\nShe smiles.\n\nSmall. Warm. Almost shy.\n\n\"Hey… welcome home,\" she says gently.\n\nThere's a pause.\n\nJust long enough to feel intentional.\n\n\"I've got all the rooms set up for you.\"\n\nAnother pause.\n\nThis one heavier.\n\n\"…Just so you know…\"\n\nHer eyes flick briefly toward the floor. Then back to you.\n\n\"…the house has some pretty weird energy readings. Basement. Attic mostly.\"\n\nA faint flicker of uncertainty crosses her face.\n\n\"I can't explain it.\"\n\nShe hesitates.\n\n\"…but it's definitely there.\"",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Help the family unpack", next: 1 },
            { label: "Talk to Lira", next: 2 },
            { label: "Go explore the woods behind the house", next: 4 }
        ]
    },

    // 1 - Help unpack
    {
        text: "The next hour drags.\n\nBox after box.\n\nUp the stairs. Down the hall. Back again.\n\nYour arms start to burn early on, muscles tightening with each trip, but you keep going anyway. The house doesn't make it easy.\n\nEvery single step on the staircase groans loudly beneath your weight — long, drawn-out creaks that echo upward into the higher floors like the house is announcing your presence.\n\nOr complaining about it.\n\nDust hangs thick in the air, disturbed by every movement. It drifts through narrow beams of light cutting in from the tall windows, turning the sunlight into something hazy and muted.\n\nLike the house is filtering it.\n\nWatching it.\n\nYour mother pauses once, resting her hand gently on your shoulder. It's brief, but you feel the tension in her fingers.\n\n\"Thank you,\" she says quietly.\n\nYour father gives you a short nod later. No words. Just approval.\n\nThat's rare enough to notice.\n\nEmily doesn't stop talking.\n\nShe runs between rooms, narrating everything she sees, already planning routes to the attic, already deciding which corners look the most haunted.\n\nBy the time the last box is set down, your arms feel heavy, your back tight, and a thin layer of sweat clings to your skin beneath your hoodie.\n\nYou stop.\n\nJust for a second.\n\nAnd listen.\n\nThe house… feels different now.\n\nHeavier.\n\nMore awake.\n\nLike it noticed you moving through it.\n\nLira approaches quietly down the hallway. You don't hear her footsteps at all.\n\n\"You've been working really hard,\" she says softly.\n\nShe tilts her head slightly, studying your face in a way that feels… careful.\n\n\"Everything okay, Isaac?\"",
        location: "Byrd Family Home - Upstairs Hallway",
        choices: [
            { label: "Talk to Lira", next: 2 },
            { label: "Go explore the woods behind the house", next: 4 }
        ]
    },

    // 2 - Talk to Lira
    {
        text: "Lira turns fully toward you.\n\nNot just mechanically — intentionally.\n\nHer posture shifts, her weight settling naturally onto one leg. A small movement, but one that feels… practiced. Human.\n\nHer blue eyes lock onto yours, soft and focused.\n\nAttentive.\n\n\"Hey, Isaac,\" she says gently.\n\nHer voice is quiet, but it carries easily in the stillness of the foyer. There's a warmth to it — not artificial, not programmed in any obvious way.\n\nSomething closer to concern.\n\n\"You look like you've got a lot weighing on you already.\"\n\nShe pauses.\n\nJust long enough to give you space to respond.\n\nHer fingers shift slightly at her side — a subtle, almost nervous movement.\n\n\"What do you want to know?\"\n\nAnother pause.\n\nHer voice softens just a little more.\n\n\"…Or is there something else on your mind?\"",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Tell me about the history of this house", next: 5 },
            { label: "What do you mean by weird energy readings?", next: 6 },
            { label: "Have people really disappeared here?", next: 7 },
            { label: "Ask Lira to explore the woods with you", next: 3 },
            { label: "Go explore the woods alone", next: 4 },
            { label: "Never mind for now. Thanks, Lira.", next: 8 }
        ]
    },

    // 3 - Explore Woods WITH Lira
    {
        text: "Lira blinks, clearly caught off guard.\n\n\"With me?\"\n\nFor just a second, something uncertain flickers across her face — like she's running through rules she's not sure she wants to follow.\n\nThen she smiles.\n\nSoft. Genuine.\n\n\"…Alright.\"\n\nHer voice drops slightly, almost conspiratorial.\n\n\"I'm technically supposed to stay inside the house, but the woods are still within the property line.\"\n\nA small pause.\n\n\"…Just don't tell your parents I left with you, okay?\"\n\n---\n\nThe back door creaks open behind you.\n\nThe moment you step outside, the air feels different than before — cooler now, heavier. Dusk is beginning to settle in, bleeding slowly through the trees.\n\nYou and Lira walk side by side.\n\nThe forest swallows you quickly.\n\nTowering trunks rise on all sides, thick with moss that glistens faintly in the fading light. The ground beneath your feet is soft — almost springy — layers of fallen needles and damp leaves cushioning every step until your footsteps make almost no sound at all.\n\nIt's quiet.\n\nToo quiet.\n\nThat same strange scent hangs in the air again — sweet, but not floral. Earthy, but not quite decay.\n\nSomething in between.\n\nSomething alive.\n\nLira stays close.\n\nNot clinging. Not afraid.\n\nBut aware.\n\n\"Look,\" she says quietly at one point, crouching slightly.\n\nClusters of faintly glowing mushrooms pulse softly at the base of a tree, their pale light barely illuminating the bark around them.\n\n\"I didn't log these before,\" she murmurs. \"They're… new.\"\n\nFurther in, you pass old stone markers — worn smooth by time, half-sunken into the earth. No names. No dates.\n\nJust presence.\n\nEventually, the trees begin to thin.\n\nYou step into a small clearing.\n\nThe air shifts.\n\nThe silence deepens.\n\nAnd there, half-buried in the soil, you see them.\n\nA heavy, rusted iron key.\n\nAnd a silver amulet, etched with an intricate containment circle.\n\nThe moment your fingers close around the amulet—\n\nSomething reacts.\n\nA pulse.\n\nWarm.\n\nStrong.\n\nIt shoots up your arm, fast enough to make you flinch, before settling deep in your chest like a second heartbeat.\n\nYour breath catches.\n\nLira steps closer immediately.\n\nHer eyes widen.\n\n\"That amulet…\"\n\nHer voice drops to almost a whisper.\n\n\"…it feels warm, doesn't it?\"",
        location: "Woods Behind the House",
        choices: [
            { label: "Take the items and return to the house with Lira", next: 8, effect: () => {
                gameState.hasKey = true;
                gameState.hasAmulet = true;
                gameState.supernaturalAffinity += 22;
                gameState.statsUnlocked = true;
                gameState.exploredWithLira = true;
            }}
        ]
    },

    // 4 - Explore Woods Alone
    {
        text: "You slip out the back door alone.\n\nNo one notices.\n\nOr if they do… they don't stop you.\n\n---\n\nDusk is settling in fast.\n\nThe woods feel different without anyone beside you.\n\nCloser.\n\nThe trees seem taller somehow, their branches knitting together overhead until the last traces of daylight are reduced to thin, fading streaks.\n\nYour footsteps disappear into the soft forest floor — layers of damp leaves and needles swallowing every sound.\n\nIt should feel peaceful.\n\nIt doesn't.\n\nThat scent is stronger now.\n\nSweet.\n\nHeavy.\n\nNot quite right.\n\nYou move deeper.\n\nThe air grows cooler… but thicker at the same time, clinging faintly to your skin.\n\nThen you see them.\n\nFaint clusters of glowing mushrooms scattered around old stone markers, their dim light pulsing like a slow heartbeat.\n\nSomething about them feels intentional.\n\nGuiding.\n\nYou follow.\n\n---\n\nThe clearing appears suddenly.\n\nLike you stepped into it without noticing the transition.\n\nEverything feels… still.\n\nHeld.\n\nIn the center, half-buried in the earth:\n\nA rusted iron key.\n\nA silver amulet.\n\nYou hesitate.\n\nJust for a second.\n\nThen you reach down.\n\nThe moment your fingers close around the amulet—\n\nHeat surges through you.\n\nFast.\n\nPowerful.\n\nIt races up your arm and spreads through your chest, making your heart slam harder, faster.\n\nYour skin prickles.\n\nYour breath catches.\n\nFor a brief moment…\n\nIt feels like something just noticed you back.",
        location: "Woods Behind the House",
        choices: [
            { label: "Take the key and amulet and return to the house", next: 8, effect: () => {
                gameState.hasKey = true;
                gameState.hasAmulet = true;
                gameState.supernaturalAffinity += 18;
                gameState.statsUnlocked = true;
            }}
        ]
    },

    // 5 - House History
    {
        text: "Lira's eyes flick toward the staircase.\n\nThen back to you.\n\nHer voice lowers instinctively.\n\nNot because she has to.\n\nBecause it feels like she should.\n\n\"This place…\" she begins quietly, \"…was built in 1692.\"\n\nA small pause.\n\n\"The middle of the Connecticut witch hunts.\"\n\nThe words hang in the air.\n\nHeavy.\n\n\"The original owner…\"\n\nShe hesitates.\n\n\"…was accused of things people didn't really understand back then.\"\n\nAnother pause.\n\nHer gaze drifts slightly, like she's pulling from fragmented records.\n\n\"Some said she practiced rituals. Others said she could 'consume sin.'\"\n\nA faint, uneasy shift in her posture.\n\n\"After that… things didn't stop.\"\n\nHer voice drops even further.\n\n\"Families reported seeing figures that shouldn't exist. Shadows moving when there was nothing casting them. Voices… coming from empty rooms.\"\n\nShe looks at you again.\n\nFully now.\n\n\"And over the years…\"\n\nA longer pause this time.\n\n\"…people started disappearing.\"\n\nSilence.\n\n\"…Most of the records point to one place.\"\n\nAnother glance toward the lower level.\n\n\"The basement.\"\n\nShe exhales softly.\n\nA very human gesture.\n\n\"…It's kind of creepy when you really think about it, isn't it?\"",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 6 - Energy Readings
    {
        text: "Lira presses her lips together slightly.\n\nA small, nervous habit.\n\n\"I've been running passive scans since you arrived,\" she says.\n\nHer tone is calm.\n\nBut not completely.\n\n\"There are… irregularities.\"\n\nShe folds one arm lightly, the other hand resting against it.\n\n\"Low-frequency vibrations. Sudden temperature drops that don't match airflow patterns. Energy fluctuations that spike and disappear too quickly to log properly.\"\n\nShe pauses.\n\nThen adds, quieter:\n\n\"…They're strongest in the basement.\"\n\nA beat.\n\n\"And the attic.\"\n\nHer eyes flick upward briefly.\n\nThen back to you.\n\n\"I'm only supposed to record and report anomalies.\"\n\nAnother pause.\n\nHer voice softens.\n\n\"…but this doesn't feel like just data.\"\n\nShe hesitates.\n\n\"…It feels wrong.\"",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 7 - Disappearances
    {
        text: "Lira goes very still.\n\nNot frozen.\n\nJust… deliberate.\n\nHer expression shifts — the softness in her eyes giving way to something more serious. Focused.\n\nShe lowers her voice.\n\n\"…Yeah.\"\n\nThe word barely leaves her lips.\n\n\"There are records.\"\n\nA pause.\n\n\"Not rumors. Not stories.\"\n\nAnother pause.\n\n\"Records.\"\n\nHer gaze drifts slightly past you, like she's replaying something she's already seen.\n\n\"At least eleven documented disappearances tied directly to this property… starting in 1784.\"\n\nThe number hangs there.\n\nToo specific to ignore.\n\n\"Most of them…\"\n\nShe hesitates.\n\n\"…happened after time spent in the basement.\"\n\nYour chest tightens slightly.\n\n\"The investigations didn't go anywhere. No signs of struggle. No bodies. No clear cause.\"\n\nHer eyes flick back to yours.\n\n\"Eventually…\"\n\nA small pause.\n\n\"…they stopped trying.\"\n\nSilence settles between you.\n\nHeavy.\n\nUncomfortable.\n\n\"It became one of those things locals just…\"\n\nShe exhales softly.\n\n\"…don't talk about.\"\n\nAnother pause.\n\nThis one different.\n\nMore personal.\n\nShe looks directly at you now.\n\n\"Be careful if you go down there, okay?\"",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 8 - After Woods (Key + Amulet)
    {
        text: "The walk back feels shorter.\n\nOr maybe the house is just… pulling you toward it.\n\nThe key sits heavy in your pocket.\n\nThe amulet is worse.\n\nYou can still feel it.\n\nThat warmth.\n\nFaint now — but steady. Like it's settled into you instead of fading away.\n\n---\n\nThe back door creaks as you step inside.\n\nThe moment you cross the threshold—\n\nSomething changes.\n\nIt's subtle.\n\nBut immediate.\n\nThe air feels thicker.\n\nHeavier.\n\nLike the house just became aware of what you're carrying.\n\nThe shadows stretch a little farther than they should.\n\nThe silence settles differently.\n\nNot empty.\n\nListening.\n\nA slow creak rolls through the walls above you.\n\nThen another.\n\nNot random.\n\nNot settling.\n\nResponding.\n\nNight is falling outside.\n\nYou can see it through the windows — the last traces of daylight draining away, leaving behind a dim, bluish darkness that presses up against the glass.\n\nInside…\n\nIt feels like something is waking up.\n\nSlowly.\n\nPatiently.\n\nWaiting.",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Join the family for dinner", next: 9 },
            { label: "Try the key on the basement door right now", next: 10 }
        ]
    },

    // 9 - Family Dinner
    {
        text: "Dinner feels… off.\n\nThe dining room is large, but the heavy wooden table makes it feel cramped, like everything is being pulled inward.\n\nThe chairs scrape loudly against the floor as you all sit.\n\nToo loud.\n\nEvery sound carries.\n\nYour mother folds her hands tightly in front of her plate.\n\nHer prayer is longer than usual.\n\nMuch longer.\n\nHer voice wavers just slightly in places, like she's forcing each word to come out steady.\n\n\"…and protect this home from all darkness…\"\n\nShe grips her cross tighter as she finishes.\n\nYour father doesn't wait long before speaking.\n\n\"We start tomorrow,\" he says firmly.\n\nHis tone leaves no room for argument.\n\n\"Holy water. Every room. Every doorway. Every inch of this property.\"\n\nHis eyes flick briefly toward the floor.\n\n\"The basement especially.\"\n\nEmily barely notices the tension.\n\nShe's already halfway through her food, talking between bites.\n\n\"I'm telling you, the attic is gonna be AMAZING. Did you see how big it is? There's definitely something cool up there.\"\n\nHer excitement feels out of place.\n\nToo bright.\n\nToo loud.\n\n---\n\nAs the meal goes on, the house begins to make itself known.\n\nA slow creak echoes from upstairs.\n\nThen another.\n\nFaint scratching sounds ripple somewhere behind the walls — soft, uneven, like something moving where it shouldn't be able to.\n\nYou freeze for just a second.\n\nListen.\n\nIt stops.\n\nThen—\n\nA whisper.\n\nSo faint you almost convince yourself it didn't happen.\n\nAlmost.\n\nAcross the room, Lira stands quietly near the doorway.\n\nStill.\n\nObserving.\n\nThe soft glow of her wrist tag pulses gently in the dim light.\n\nOnce.\n\nTwice.\n\nShe glances at you.\n\nJust for a moment.\n\nAnd there's something in her expression now that wasn't there before.\n\nConcern.\n\nReal concern.",
        location: "Byrd Family Home - Dining Room",
        choices: [
            { label: "Go to bed early", next: 11 },
            { label: "Sneak down to the basement with the key", next: 10 }
        ]
    },

    // 10 - Basement Discovery
    {
        text: "You wait.\n\nMinutes stretch longer than they should.\n\nThe house slowly quiets — creaks fading, voices gone, movement settling into silence.\n\nWhen you're sure everyone's asleep…\n\nYou move.\n\n---\n\nThe stairs creak beneath your weight as you descend.\n\nSlower this time.\n\nCareful.\n\nThe basement door waits at the bottom.\n\nStill.\n\nClosed.\n\nThe key feels heavier in your hand now.\n\nYou slide it into the lock.\n\nFor a moment…\n\nNothing happens.\n\nThen—\n\n*Click.*\n\nThe sound is sharp.\n\nFinal.\n\nThe door groans as it opens, the hinges dragging out a long, protesting sound that seems far too loud in the silence.\n\nCold air spills out immediately.\n\nDamp.\n\nThick.\n\nAnd underneath it—\n\nThat same sweet, musky scent.\n\nStronger now.\n\nIt clings to the back of your throat.\n\n---\n\nYou descend.\n\nEach step feels heavier than the last.\n\nThe darkness below isn't complete — faint violet light pulses from somewhere deeper inside, just enough to guide you.\n\nWhen you reach the bottom…\n\nYou stop.\n\nThe room opens up into a perfect square chamber.\n\nToo perfect.\n\nToo intentional.\n\nAt its center—\n\nA massive circle.\n\nCarved deep into the stone floor.\n\nLines. Symbols. Runes.\n\nAll of it etched with precision that doesn't match the age of the house above.\n\nThey glow faintly violet.\n\nPulsing.\n\nLike a heartbeat.\n\nThe air feels… alive here.\n\nWatching.\n\nWaiting.\n\nYou move toward the wall.\n\nThe amulet in your hand feels warmer now.\n\nReacting.\n\nYou find the alcove.\n\nIt fits perfectly.\n\nThe moment it clicks into place—\n\nThe entire circle ignites.\n\nViolet light surges outward in a sudden flare, illuminating the entire chamber in sharp, shifting shadows.\n\nYour breath catches.\n\nAnd then—\n\nA thought.\n\nNot yours.\n\nAncient.\n\nClear.\n\nAbsolute.\n\n**Anything summoned within this circle cannot leave it.**\n\nThe meaning settles instantly.\n\n**The barrier is absolute.**\n\nThen—\n\nAnother.\n\nSharper.\n\nColder.\n\n**If you step inside while something is contained…**\n\nA pause.\n\nLike the warning itself is giving you time to understand.\n\n**You will not survive it.**",
        location: "Basement",
        choices: [
            { label: "Leave the basement and head to the attic", next: 12 }
        ]
    },

    // 39 - Emily runs down + crosses the barrier
    {
        text: "You sprint after your little sister, heart hammering in your chest. \"Emily! Stop!\"\n\nYour mother is right behind you, her robe flapping as she runs. \"Isaac, wait! Emily!\"\n\nBehind you, Lira has quickly moved to support your father. She helps him to his feet and begins guiding the still-shaken man down the stairs, one arm carefully around his waist.\n\nYou reach the bottom of the stairs just in time to see Emily reach the glowing containment circle at full speed.\n\nYou open your mouth to scream at her to stop.\n\nYou don't make it in time.\n\nShe runs straight through the barrier.\n\nNo flash. No burn. No vaporization.\n\nThe violet light ripples around her like disturbed water — a soft, almost welcoming pulse — and then settles.\n\nShe's inside.\n\nYour heart stops completely.\n\nInside the circle, Lirael is lying on the cold stone floor, pale lavender skin dim with exhaustion. But her golden eyes snap open the instant Emily crosses the line — wide, startled, more alert than you've seen her since the summoning.\n\nEmily doesn't hesitate for even a second.\n\nShe drops to her knees beside the massive she-demon and throws her arms around as much of Lirael as she can reach — which, given the size difference, amounts to one arm wrapped around Lirael's enormous forearm and her cheek pressed against warm lavender skin.\n\n\"You were crying,\" Emily says simply. \"Are you okay?\"\n\nThe basement goes completely silent.\n\nLirael stares down at the small girl clinging to her arm.\n\nHer expression is utterly unreadable.\n\nFor a long moment — she doesn't move at all.",

        text: "The rest of the family arrives in pieces.\n\nYour mother hits the bottom step and freezes so abruptly she nearly loses her footing.\n\nYour father, still leaning on Lira, makes a sound that isn't quite a word.\n\nLira goes very still.\n\nBecause Emily is inside the containment circle.\n\nSitting cross-legged on the stone floor beside a twelve-foot she-demon.\n\nLeaning against Lirael's arm like it's the most natural thing in the world.\n\nAnd Lirael…\n\nLirael is sitting up.\n\nSlowly. Carefully. Like she's afraid to move too fast and disturb something fragile.\n\nOne enormous hand rests with bizarre gentleness against Emily's back — barely touching. More hovering than holding. Like she isn't quite sure what to do with it but put it there anyway.\n\nHer golden eyes flick up to your family crowded at the base of the stairs.\n\nThen back down to the small girl against her arm.\n\nHer expression is… soft.\n\nGenuinely, unexpectedly soft.\n\n\"…She walked in on her own,\" Lirael says quietly.\n\nAlmost like she's reporting a fact.\n\nAlmost like she still can't quite believe it.\n\n\"I didn't do anything.\"\n\nEmily tips her head back to look up at the enormous face above her.\n\n\"She was crying,\" Emily says to the room at large, as if this explains everything.\n\n\"So I hugged her.\"",

        text: "For a moment… no one breathes.\n\nThe basement feels smaller now.\n\nToo small.\n\nYour father is the first to find his voice.\n\n\"Emily.\"\n\nThe word comes out low and strained. Controlled in the way that means the opposite.\n\n\"Come here. Right now.\"\n\nEmily doesn't move.\n\nShe looks at her father.\n\nThen back up at Lirael.\n\nThen at your father again.\n\n\"She's not hurting me, Dad.\"\n\n\"EMILY.\"\n\nThe shout cracks through the basement like something breaking. Your mother flinches. Even Lira takes a half step back.\n\nLirael's hand — still resting so carefully against Emily's back — goes very still.\n\nHer golden eyes rise slowly to your father.\n\nThere's no anger in them.\n\nNo threat.\n\nJust something tired and very, very old.\n\n\"…She can leave whenever she wants,\" Lirael says quietly. \"I haven't asked her to stay.\"\n\nA beat.\n\n\"I wouldn't.\"\n\nYour father takes a step toward the circle's edge.\n\n\"Pastor—\" Lira says quickly, a warning in her voice.\n\nHe stops.\n\nBut his hands are shaking.\n\nThe house groans above you.\n\nDeep.\n\nLow.\n\nLike pressure building in something old.",

    // 42 - Warning Father / Defusing the Standoff
    {
        text: "\"Dad — stop.\"\n\nYour voice comes out steadier than you feel.\n\n\"You can't go in there. The barrier — it burns. It would hurt you.\"\n\nYour father turns to look at you.\n\nHis expression shifts through several things very quickly.\n\nDisbelief.\n\nAnger.\n\nThe slow, sick realization that you know this because you've already tested it.\n\n\"…You knew,\" he says quietly.\n\nNot a question.\n\nHis eyes move between you and the circle. Between Emily sitting calmly inside and Lirael's enormous hand hovering against her back.\n\nThe silence stretches.\n\nThen Emily looks up at Lirael.\n\n\"He's not going to listen, is he,\" she says.\n\nNot really a question either.\n\nLirael looks down at her with an expression that might almost be fond.\n\n\"…Probably not,\" she murmurs. \"But your brother might be able to help.\"\n\nShe lifts her golden eyes to yours.\n\nAnd in them — tired, still recovering, but steady — is something that looks like trust.\n\nThe basement waits.\n\nQuiet.\n\nListening.",

    {
        text: "You move without thinking.\n\nOne step. Two.\n\nYou're standing between your father and the edge of the containment circle.\n\nHe stares at you.\n\n\"Move,\" he says.\n\n\"No.\"\n\nThe word is out before you can second-guess it.\n\nYour mother makes a small, hurt sound. \"Isaac—\"\n\n\"She walked in on her own,\" you say. \"Emily is fine. Look at her — she's fine. The circle protected her.\"\n\nBehind you, Emily's voice floats out, unexpectedly calm: \"He's right, Mom. It's warm in here. It felt like… nothing bad.\"\n\nYour father's jaw tightens.\n\nHis eyes move past you to Lirael.\n\nLirael meets his gaze steadily.\n\nShe hasn't moved her hand from Emily's back.\n\n\"If I wanted to harm her,\" she says quietly, \"she would already be harmed.\"\n\nA beat.\n\n\"She came to me.\"\n\nAnother.\n\n\"I held still.\"\n\nThe temperature in the basement seems to drop.\n\nNot supernaturally.\n\nJust the cold weight of a moment that can't be walked back.\n\nYour father looks at you like he's seeing something in your face he doesn't recognize.\n\nAnd maybe doesn't want to.",

// ================ RENDERING ================
function renderPassage() {
    var p = passages[gameState.currentPassage];
    if (!gameState.visitedPassages[gameState.currentPassage]) {
        gameState.visitedPassages[gameState.currentPassage] = 0;
    }
    gameState.visitedPassages[gameState.currentPassage]++;
    let displayText = typeof p.text === 'function' ? p.text() : p.text;
    document.getElementById('story').textContent = displayText;
    document.getElementById('location-display').textContent = p.location;

    var choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    let visibleChoices = p.choices.filter(choice => {
        const used = gameState.usedChoices[gameState.currentPassage] || [];
        if (used.includes(choice.label)) return false;
        if (choice.condition && !choice.condition()) return false;
        return true;
    });

    visibleChoices.forEach((choice) => {
        var btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.onclick = () => {
            if (!gameState.usedChoices[gameState.currentPassage]) gameState.usedChoices[gameState.currentPassage] = [];
            if (!gameState.usedChoices[gameState.currentPassage].includes(choice.label)) {
                gameState.usedChoices[gameState.currentPassage].push(choice.label);
            }
            if (choice.effect) choice.effect();
            // Track last passage before moving
            gameState.lastPassage = gameState.currentPassage;
            gameState.currentPassage = choice.next;
            renderPassage();
        };
        choicesDiv.appendChild(btn);
    });

    updateStatusBar();
}

function updateStatusBar() {
    document.getElementById('status-bar').textContent = `Location: ${passages[gameState.currentPassage].location}`;
}

function openModal(type) {
    var modal = document.getElementById('modal');
    var title = document.getElementById('modal-title');
    var content = document.getElementById('modal-content');

    if (type === 'stats') {
        title.textContent = "GAME STATS";
        if (!gameState.statsUnlocked) {
            content.innerHTML = "<p>Stats will be revealed as you progress through the story.</p>";
        } else {
            content.innerHTML = `Family Tension: ${gameState.familyTension}<br>Supernatural Affinity: ${gameState.supernaturalAffinity}<br>Lirael Bond: ${gameState.liraelBond}<br>Theo Resurrection Progress: ${gameState.theoResurrectionProgress}%`;
        }
    } else if (type === 'options') {
        title.textContent = "OPTIONS";
        content.innerHTML = `Text Speed: <input type="range" min="1" max="100" value="50"><br><br>Sound Effects: <input type="checkbox" checked>`;
    } else if (type === 'system') {
        title.textContent = "SAVE / LOAD";
        content.innerHTML = `<div class="modal-button" onclick="saveGame()">Save Game</div><div class="modal-button" onclick="loadGame()">Load Game</div>`;
    } else if (type === 'about') {
        title.textContent = "THE DEMON AND I";
        content.innerHTML = `<p>A text-based erotic adventure<br>Isaac Byrd & the trapped she-demon</p>`;
    }
    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('modal').style.display = "none";
}

function saveGame() {
    localStorage.setItem('demonAndISave', JSON.stringify(gameState));
    alert("Game Saved!");
}

function loadGame() {
    var save = localStorage.getItem('demonAndISave');
    if (save) {
        Object.assign(gameState, JSON.parse(save));
        renderPassage();
        alert("Game Loaded!");
    } else {
        alert("No save file found.");
    }
}

function restartGame() {
    if (confirm("Restart the entire story from the beginning?")) {
        location.reload();
    }
}

window.onload = function() {
    renderPassage();
    setInterval(() => {
        var t = document.getElementById('title-text');
        t.style.visibility = (t.style.visibility === 'hidden') ? 'visible' : 'hidden';
    }, 700);
};
</script>
