<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The Demon and I</title>
<style>
body { 
margin:0;
padding:0; 
background-color:#080808; 
color:#c0c0c0; 
font-family:'Courier New', Courier, monospace; 
}
#container { 
	width:75%; 
	margin:16px auto; 
	border:4px solid #a0a0a0; 
	background-color:#101010; 
	padding:12px; 
}
#layout { display:flex; }
#side-panel { width:240px; border:3px solid #505050; background:#111111; padding:12px; margin-right:12px; }
.panel-section { margin-bottom:16px; border:2px inset #404040; padding:10px; background:#181818; }
.panel-title { font-size:13px; color:#ffcc00; margin-bottom:8px; letter-spacing:0.1em; }
.panel-button { display:block; margin:6px 0; padding:8px; border:2px outset #808080; background:#202020; color:#f0f0f0; cursor:pointer; text-align:center; }
.panel-button:hover { background:#303030; }
#main-content { flex:1; }
#titlebar { background:#202020; color:#f8f8f8; padding:14px; border:2px inset #505050; text-align:center; letter-spacing:0.18em; font-size:21px; }
#titlebar .blink { color:#ffcc00; }
#main-frame { margin-top:12px; border:3px solid #505050; background:linear-gradient(180deg,#111 0%,#1a1a1a 100%); padding:14px; }
#story { min-height:400px; background:#121212; border:2px inset #404040; padding:16px; line-height:1.75; white-space:pre-wrap; font-size:15px; }
#choices { margin-top:16px; }
#choices button { margin:5px 8px 5px 0; padding:10px 16px; border:2px outset #808080; background:#202020; color:#f0f0f0; cursor:pointer; font-family:inherit; font-size:14.5px; }
#choices button:hover { background:#303030; }
#status-bar { margin-top:16px; padding:10px; background:#181818; border:2px inset #404040; font-size:13px; text-align:center; }
#modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; }
#modal-box { width:360px; background:#101010; border:3px solid #505050; padding:16px; }
#modal-title { color:#ffcc00; margin-bottom:14px; font-size:18px; }
.modal-button { display:block; margin-top:10px; padding:9px; border:2px outset #808080; background:#202020; cursor:pointer; text-align:center; }
.modal-button:hover { background:#303030; }
</style>
</head>
<body>

<div id="container">
    <div id="layout">
        <div id="side-panel">
            <div class="panel-section">
                <div class="panel-title">LOCATION</div>
                <div id="location-display">Byrd Family Home - Hartford, CT</div>
            </div>
            <div class="panel-section">
                <div class="panel-title">MENU</div>
                <div class="panel-button" onclick="openModal('stats')">View Stats</div>
                <div class="panel-button" onclick="openModal('options')">Options</div>
                <div class="panel-button" onclick="openModal('system')">Save / Load</div>
                <div class="panel-button" onclick="restartGame()">Restart Game</div>
                <div class="panel-button" onclick="openModal('about')">About</div>
            </div>
        </div>

        <div id="main-content">
            <div id="titlebar">
                <span id="title-text" class="blink">THE DEMON AND I</span>
            </div>
            <div id="main-frame">
                <div id="story"></div>
                <div id="choices"></div>
                <div id="status-bar"></div>
            </div>
        </div>
    </div>
</div>

<div id="modal">
    <div id="modal-box">
        <div id="modal-title"></div>
        <div id="modal-content"></div>
        <div class="modal-button" onclick="closeModal()">Close</div>
    </div>
</div>

<script>
// ================ GAME STATE ================
var gameState = {
    currentPassage: 0,
    familyTension: 25,
    supernaturalAffinity: 10,
    liraelBond: 0,
    theoResurrectionProgress: 0,
    hasKey: false,
    hasAmulet: false,
    pathChosen: null,
    liraelFedComfort: false,
    statsUnlocked: false,
    exploredWithLira: false   // New flag for exploring with Lira
};

var passages = [
    // 0 - Arrival
    {
        text: "The old minivan’s engine dies with a tired rattle. Cool Connecticut air brushes against your skin as you step out onto the gravel driveway.\n\nThe three-story Victorian house looms before you — dark weathered wood covered in thick ivy, an attic window that seems to stare back. Dense woods press in from all sides.\n\nYour mother clutches her silver cross tightly. Your father mutters about blessing every room. Emily bounces excitedly about the 'haunted mansion'.\n\nYou stand quietly in your black hoodie.\n\nInside the foyer stands Lira, the household AI Companion. She looks almost like a real young woman. A glowing prisoner-style tag blinks on her wrist.\n\nShe offers a small, warm smile. “Hey… welcome home. I’ve got the rooms all set up. Just so you know, the house has some… weird energy readings coming from the basement and attic.”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Help the family unpack", next: 1 },
            { label: "Talk to Lira", next: 2 },
{ label: "Go explore the woods", next: 4 }
        ]
    },

    // 1 - Help unpack
    {
        text: "You spend the next hour carrying boxes and helping your family settle in. Your mother thanks you quietly. Your father nods approvingly. Emily chatters about how cool the house looks.\n\nWhen you finish, Lira approaches you with a gentle smile.\n\n“You’ve been working hard. Everything okay?”",
        location: "Byrd Family Home - Upstairs",
        choices: [
            { label: "Talk to Lira", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 2 - Talk to Lira (Human-like)
    {
        text: "Lira turns toward you, her expression soft and attentive.\n\n“Hey Isaac,” she says gently. “You look like you’ve got a lot on your mind. What do you want to know? Or… is there something else?”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Tell me about the history of this house", next: 5 },
            { label: "What do you mean by weird energy readings?", next: 6 },
            { label: "Have people really disappeared here?", next: 7 },
            { label: "Ask Lira to explore the woods with you", next: 3 },
            { label: "Go explore the woods alone", next: 4 },
            { label: "Never mind for now", next: 8 }
        ]
    },

    // 3 - Explore Woods WITH Lira (New Scene)
    {
        text: "Lira tilts her head, looking a little surprised but pleased.\n\n“With me? …Sure, why not? I’m supposed to stay inside, but technically the woods are still part of the property. Just don’t tell your parents I left the house, okay?”\n\nShe follows you out the back door. As you walk through the dense woods together, she stays close, occasionally pointing out glowing mushrooms or old stone markers. Her presence makes the forest feel slightly less oppressive.\n\nIn a small clearing, you both find the rusty iron key and the silver amulet. Lira watches as you pick them up.\n\n“That amulet… it feels warm, doesn’t it?” she says quietly, sounding genuinely curious.",
        location: "Woods Behind the House",
        choices: [
            { label: "Take the items and return with Lira", next: 8, effect: () => {
                gameState.hasKey = true;
                gameState.hasAmulet = true;
                gameState.supernaturalAffinity += 20;
                gameState.statsUnlocked = true;
                gameState.exploredWithLira = true;
            }}
        ]
    },

    // 4 - Explore Woods Alone
    {
        text: "You slip out the back door into the dense woods as dusk begins to fall. The ancient trees close in around you. The ground is soft with damp leaves. A strange sweet scent lingers in the air.\n\nFollowing faint glowing mushrooms and old stone markers, you find a heavy rusty iron key and a silver amulet etched with a containment circle.\n\nThe amulet pulses warmly in your palm.",
        location: "Woods Behind the House",
        choices: [
            { label: "Take the key and amulet and return", next: 8, effect: () => {
                gameState.hasKey = true;
                gameState.hasAmulet = true;
                gameState.supernaturalAffinity += 18;
                gameState.statsUnlocked = true;
            }}
        ]
    },

    // 5 - House History
    {
        text: "Lira glances toward the stairs, lowering her voice.\n\n“This place was built in 1692 during the witch hunts. The original owner was accused of ‘devouring sinners.’ A lot of families reported seeing things that shouldn’t exist… and quite a few people have gone missing. Most stories point to the basement.”\n\nShe shrugs uneasily. “Kind of creepy, right?”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 6 - Energy Readings
    {
        text: "Lira bites her lip lightly. “I’ve been picking up weird low vibrations and temperature changes, especially from the basement and attic. It’s not normal… Honestly? It makes me a little uncomfortable too.”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 7 - Disappearances
    {
        text: "Lira’s expression turns serious. “Yeah… there are records of at least eleven people who vanished here. Most after spending time in the basement. The police stopped investigating a long time ago.”\n\nShe adds softly, “Be careful down there, okay?”",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Ask something else", next: 2 },
            { label: "Go explore the woods", next: 4 }
        ]
    },

    // 8 - After Woods (Key + Amulet)
    {
        text: "You return to the house with the rusty iron key and the silver amulet. The house feels heavier now, like it knows you found something important.\n\nNight is falling. Your family is settling in.",
        location: "Byrd Family Home - Foyer",
        choices: [
            { label: "Join family for dinner", next: 9 },
            { label: "Try the key on the basement door", next: 10 }
        ]
    },

    // 9 - Family Dinner
    {
        text: "You sit down for dinner. The table creaks. Your mother prays longer than usual. Your father talks about cleansing the house. Emily wants to explore the attic.\n\nAs night deepens, the house makes strange sounds — slow creaks and faint scratching in the walls.\n\nLira stands nearby, occasionally glancing at you with quiet concern.",
        location: "Byrd Family Home - Dining Room",
        choices: [
            { label: "Go to bed early", next: 11 },
            { label: "Sneak down to the basement with the key", next: 10 }
        ]
    },

    // 10 - Basement (Locked until key is found)
    {
        text: "You sneak downstairs with the rusty key. It slides into the lock with a heavy click. The basement door groans loudly as it opens.\n\nCold, damp air rushes up, carrying a faint sweet, musky scent.\n\nAt the bottom is a perfect square stone chamber with a glowing demon summoning and containment circle in the center. The runes pulse violet.\n\nYou slot the amulet into the wall alcove. The circle brightens dramatically.\n\nWarning: Anything summoned will be trapped inside the circle. Humans who step inside will be vaporized instantly.",
        location: "Basement",
        choices: [
            { label: "Leave and head to the attic", next: 12 }
        ]
    },

    // 11 - Going to Bed Early
    {
        text: "You head upstairs to your bedroom. Sleep refuses to come. The house is full of noises — slow creaks, faint scratching, and soft whispers from the walls.\n\nAfter an hour, you can’t take it anymore.",
        location: "Isaac's Bedroom",
        choices: [
            { label: "Sneak down to the basement", next: 10 },
            { label: "Go up to the attic", next: 12 }
        ]
    },

    // 12 - Attic Discovery
    {
        text: "Faint scratching from above draws you into the dusty attic.\n\nAs you move a heavy box, you knock over a thick leather-bound book titled 'Ars Goetia – Safe Summoning Rites for Companions and Bound Servants'.\n\nTwo focus items catch your eye:\n- Your crumpled drawing of Theo\n- A lock of ancient black hair in the binding",
        location: "Attic",
        choices: [
            { label: "Use Theo’s drawing (Summon Lirael)", next: 13, effect: () => { 
                gameState.pathChosen = "Lirael"; 
                gameState.statsUnlocked = true; 
            }},
            { label: "Use the lock of ancient black hair (Summon Morgana)", next: 99, effect: () => { 
                gameState.pathChosen = "Morgana"; 
            }}
        ]
    },

    // 13 - Summoning Lirael (Placeholder)
    {
        text: "At 3:00 AM you stand safely outside the glowing circle.\n\nViolet light explodes. A thick scent of warm vanilla and musk fills the room.\n\nLirael materializes slowly — a voluptuous she-demon with pale skin, small black horns, and heavy-lidded golden eyes.\n\n“Mmmhhhh~… Took you long enough, cute human,” she purrs.",
        location: "Basement - Containment Circle",
        choices: [{ label: "Continue", next: 13 }]
    },

    // Morgana Placeholder
    { text: "Morgana summoning scene coming soon...", location: "Basement", choices: [{ label: "Restart", next: 0 }] }
];

// ================ RENDERING ================
function renderPassage() {
    var p = passages[gameState.currentPassage];
    
    document.getElementById('story').textContent = p.text;
    document.getElementById('location-display').textContent = p.location;

    var choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    p.choices.forEach((choice) => {
        var btn = document.createElement('button');
        btn.textContent = choice.label;
        btn.onclick = () => {
            if (choice.effect) choice.effect();
            gameState.currentPassage = choice.next;
            renderPassage();
        };
        choicesDiv.appendChild(btn);
    });

    updateStatusBar();
}

function updateStatusBar() {
    document.getElementById('status-bar').textContent = `Location: ${passages[gameState.currentPassage].location}`;
}

function openModal(type) {
    var modal = document.getElementById('modal');
    var title = document.getElementById('modal-title');
    var content = document.getElementById('modal-content');

    if (type === 'stats') {
        title.textContent = "GAME STATS";
        if (!gameState.statsUnlocked) {
            content.innerHTML = "<p>Stats will be revealed as you progress through the story.</p>";
        } else {
            content.innerHTML = `Family Tension: ${gameState.familyTension}<br>Supernatural Affinity: ${gameState.supernaturalAffinity}<br>Lirael Bond: ${gameState.liraelBond}<br>Theo Resurrection Progress: ${gameState.theoResurrectionProgress}%`;
        }
    } else if (type === 'options') {
        title.textContent = "OPTIONS";
        content.innerHTML = `Text Speed: <input type="range" min="1" max="100" value="50"><br><br>Sound Effects: <input type="checkbox" checked>`;
    } else if (type === 'system') {
        title.textContent = "SAVE / LOAD";
        content.innerHTML = `<div class="modal-button" onclick="saveGame()">Save Game</div><div class="modal-button" onclick="loadGame()">Load Game</div>`;
    } else if (type === 'about') {
        title.textContent = "THE DEMON AND I";
        content.innerHTML = `<p>A text-based erotic horror adventure<br>Isaac Byrd & the trapped she-demon Lirael</p>`;
    }

    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('modal').style.display = "none";
}

function saveGame() {
    localStorage.setItem('demonAndISave', JSON.stringify(gameState));
    alert("Game Saved!");
}

function loadGame() {
    var save = localStorage.getItem('demonAndISave');
    if (save) {
        Object.assign(gameState, JSON.parse(save));
        renderPassage();
        alert("Game Loaded!");
    } else {
        alert("No save file found.");
    }
}

function restartGame() {
    if (confirm("Restart the entire story from the beginning?")) {
        location.reload();
    }
}

window.onload = function() {
    renderPassage();
    setInterval(() => {
        var t = document.getElementById('title-text');
        t.style.visibility = (t.style.visibility === 'hidden') ? 'visible' : 'hidden';
    }, 700);
};
</script>
</body>
</html>
