<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorite Thing Form</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: rgb(33, 33, 33); 
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center; 
}



.form {
  background: rgb(255, 255, 255);
  padding: 30px;
  border-radius: 12px;
  width: 360px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}


label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
  color: rgb(255, 255, 255); 
}


.cool {
  margin-top: 8px;
}

.cool label {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  cursor: pointer;
  font-weight: normal;
  position: relative;
  padding-left: 35px;
  user-select: none;
  color: rgb(255, 255, 255); 
}


.cool input[type="radio"] {
  position: absolute;
  opacity: 0;
  cursor: pointer;
}


.cool label::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  background: rgb(128, 0, 128);
  border: 2px solid rgb(85, 0, 170);
  transition: all 0.3s ease;
  box-sizing: border-box;
}


.cool input[type="radio"]:checked + label::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 7px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgb(168, 255, 0);
}


.cool input[type="radio"]:checked + label::before {
  background: rgb(168, 255, 0); 
}


button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, rgb(255, 0, 255), rgb(255, 0, 255)); 
  color: rgb(255, 255, 255);
  font-size: 16px;
  cursor: pointer;
  transition: all 2s ease; 
}


button:hover {
  background: linear-gradient(90deg, rgb(168, 255, 0), rgb(208, 255, 122)); 
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="form">
  <form>
    <label>My favorite thing in the world:</label>
    <div class="cool">
      <input type="radio" id="pizza" name="favorite" value="Pizza">
      <label for="pizza">Pizza</label>

      <input type="radio" id="bacon" name="favorite" value="Bacon">
      <label for="bacon">Bacon</label>

      <input type="radio" id="cats" name="favorite" value="Cats">
      <label for="cats">Cats</label>

      <input type="radio" id="dogs" name="favorite" value="Dogs">
      <label for="dogs">Dogs</label>
    </div>

    <button type="submit">Save</button>
  </form>
</div><br><br>
