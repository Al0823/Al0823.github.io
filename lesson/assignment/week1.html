<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorite Thing Form</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: rgb(33, 33, 33);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


form {
  width: 360px;
  display: flex;
  flex-direction: column;
}


label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
  color: rgb(255, 255, 255);
}


.radio-group {
  margin-top: 8px;
}

.radio-group label {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  cursor: pointer;
  position: relative;
  padding: 10px 0 10px 40px;
  user-select: none;
  color: rgb(255, 255, 255);
  font-weight: normal;
  border-radius: 6px;
  transition: background 0.3s ease;
}


.radio-group label:hover {
  background-color: rgb(60, 60, 60);
}


.radio-group input[type="radio"] {
  position: absolute;
  opacity: 0;
  cursor: pointer;
}


.radio-group label::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 3px solid rgb(128, 0, 128); 
  box-sizing: border-box;
  background-color: transparent;
  transition: all 0.3s ease;
}


.radio-group label::after {
  content: "";
  position: absolute;
  left: 7px;
  top: calc(50% - 5.5px); 
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background-color: transparent;
  transition: all 0.3s ease;
}


.radio-group input[type="radio"]:checked + label::before {
  border-color: rgb(168, 255, 0); 
}

.radio-group input[type="radio"]:checked + label::after {
  background-color: rgb(168, 255, 0); 
}


button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, rgb(255,0,255), rgb(255,0,255));
  color: rgb(255,255,255);
  font-size: 16px;
  cursor: pointer;
  transition: all 2s ease; 
}


button:hover {
  background: linear-gradient(90deg, rgb(168,255,0), rgb(208,255,122));
  transform: scale(1.05);
}
</style>
</head>

<body>

<form>
  <label>My favorite thing in the world:</label>
  <div class="radio-group">
    <input type="radio" id="pizza" name="favorite" value="Pizza">
    <label for="pizza">Pizza</label>

    <input type="radio" id="bacon" name="favorite" value="Bacon">
    <label for="bacon">Bacon</label>

    <input type="radio" id="cats" name="favorite" value="Cats">
    <label for="cats">Cats</label>

    <input type="radio" id="dogs" name="favorite" value="Dogs">
    <label for="dogs">Dogs</label>
  </div>

  <button type="submit">Save</button>
</form>

</body>
</html>
