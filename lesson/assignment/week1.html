<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorite Thing Form</title>

<style>
/* ====== PAGE BACKGROUND ====== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: rgb(33, 33, 33);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ====== FORM CONTAINER ====== */
.form-box {
  background-color: rgb(50, 50, 50);
  padding: 30px;
  border-radius: 12px;
  width: 360px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

/* ====== LABELS ====== */
label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
  color: #fff;
}

/* ====== CUSTOM RADIO BUTTONS ====== */
.radio-group {
  margin-top: 8px;
}

.radio-group label {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  cursor: pointer;
  position: relative;
  padding-left: 40px;
  user-select: none;
  color: #fff;
  font-weight: normal;
}

/* Hide the default radio button */
.radio-group input[type="radio"] {
  position: absolute;
  opacity: 0;
  cursor: pointer;
}

/* Outer ring */
.radio-group label::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 3px solid purple;
  box-sizing: border-box;
  transition: all 0.3s ease;
  background-color: transparent; /* ring only */
}

/* Inner circle */
.radio-group label::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 7px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background-color: transparent; /* hidden by default */
  transition: all 0.3s ease;
}

/* Checked state: inner circle appears and ring turns green */
.radio-group input[type="radio"]:checked + label::before {
  border-color: #a8ff00; /* outer ring turns light green */
}

.radio-group input[type="radio"]:checked + label::after {
  background-color: #a8ff00; /* inner circle turns light green */
}

/* ====== SAVE BUTTON ====== */
button {
  margin-top: 20px;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(90deg, magenta, #ff00ff);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: all 2s ease; /* slow hover transition */
}

/* Hover effect */
button:hover {
  background: linear-gradient(90deg, #a8ff00, #d0ff7a);
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="form-box">
  <form>
    <label>My favorite thing in the world:</label>
    <div class="radio-group">
      <input type="radio" id="pizza" name="favorite" value="Pizza">
      <label for="pizza">Pizza</label>

      <input type="radio" id="bacon" name="favorite" value="Bacon">
      <label for="bacon">Bacon</label>

      <input type="radio" id="cats" name="favorite" value="Cats">
      <label for="cats">Cats</label>

      <input type="radio" id="dogs" name="favorite" value="Dogs">
      <label for="dogs">Dogs</label>
    </div>

    <button type="submit">Save</button>
  </form>
</div>
