<footer class="finalprojectfooter">
  <span id="dateTime"></span>

  <script>
    (function setFooterText() {
      function update() {
        const dateSpan = document.getElementById("dateTime");
        if (!dateSpan) {
          setTimeout(update, 50);
          return;
        }

        const currentYear = new Date().getFullYear();
        const startYear = 2026;

        dateSpan.innerHTML = `&copy; A.t.A. Projects, Websites, and Games #amp; CitiCoders ${startYear} - {currentYear}`;
      }

      update();
    })();
  </script>
		
</footer>
