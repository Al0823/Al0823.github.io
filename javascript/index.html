<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title id="pageTitle"></title>
  <script src="/javascript/includes/vars.js"></script>
</head>

<body>

<div id="header"></div>

<main>
  <div id="nav"></div>

  <article>
    This is the main page of the Wiki, from here you can get to the different pages of the website.


  </article>
</main>

<footer id="footer"></footer>

<div id="debugInclude"></div>

<script>

  (function loadCSS() {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "../../css/style.css?v=" + Date.now();
    document.head.appendChild(link);
  })();


  document.getElementById("pageTitle").textContent =
    window.vars.WEBSITETITLE + " - JavaScript Dates Tutorial";

  
  async function loadInclude(id, file) {
    const res = await fetch(file);
    const html = await res.text();
    const container = document.getElementById(id);
    container.innerHTML = html;


    container.querySelectorAll("script").forEach(oldScript => {
      const newScript = document.createElement("script");
      if (oldScript.src) {
        newScript.src = oldScript.src;
      } else {
        newScript.textContent = oldScript.textContent;
      }
      document.body.appendChild(newScript);
      oldScript.remove();
    });
  }


  loadInclude("header", window.vars.INCVAR + "header.html");
  loadInclude("nav", window.vars.INCVAR + "nav.html");
  loadInclude("footer", window.vars.INCVAR + "footer.html");
  if (window.vars.DEBUGVAR) {
    loadInclude("debugInclude", window.vars.INCVAR + "debug.html");
  }
</script>



<script src="/javascript/includes/include.js"></script>


</body>
</html>
