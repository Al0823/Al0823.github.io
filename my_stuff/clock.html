<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time tracker: Eastern and Tbilisi</title>
<script>
try{var s=localStorage.getItem('tt-theme');if(s==='light'||s==='dark'||s==='grey')document.documentElement.dataset.theme=s}catch(e){}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#afafaf;--bg-soft:#c8c8c8;--bg-softer:#e6e6e6;--panel:#969696b3;
--header-bg:#4b4b4b;--footer-bg:#4b4b4b;--border:#646464;--divider:#7d7d7d;
--text:#000000;--text-invert:#ffffff;--link:#4b5c01;--hover:#e1e1e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]):not([data-theme="grey"]){
--bg:#121212;--bg-soft:#1e1e1e;--bg-softer:#2a2a2a;--panel:#ffffff0f;
--header-bg:#000000;--footer-bg:#000000;--border:#444444;--divider:#333333;
--text:#e5e5e5;--text-invert:#ffffff;--link:#4ea3ff;--hover:#2c2c2c}}
:root[data-theme="dark"]{
--bg:#121212;--bg-soft:#1e1e1e;--bg-softer:#2a2a2a;--panel:#ffffff0f;
--header-bg:#000000;--footer-bg:#000000;--border:#444444;--divider:#333333;
--text:#e5e5e5;--text-invert:#ffffff;--link:#4ea3ff;--hover:#2c2c2c}
:root[data-theme="light"]{
--bg:#f2f2f2;--bg-soft:#ffffff;--bg-softer:#fafafa;--panel:#0000000d;
--header-bg:#e5e5e5;--footer-bg:#e5e5e5;--border:#cccccc;--divider:#dddddd;
--text:#000000;--text-invert:#000000;--link:#0066cc;--hover:#eaeaea}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;display:flex;flex-direction:column;line-height:1.5;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--header-bg);color:var(--text-invert);padding:1rem;text-align:center;border-bottom:2px solid var(--divider)}
header h1{font-size:clamp(1.5rem,5vw,2.5rem);font-weight:600}
main{flex:1;background:var(--bg);padding:1.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
footer{background:var(--footer-bg);color:var(--text-invert);text-align:center;padding:15px 10px;border-top:1px solid var(--divider)}

.themes{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center}
.themes button{font:inherit;cursor:pointer;background:var(--bg-soft);color:var(--link);border:2px solid var(--border);border-radius:20px;padding:.3rem 1rem}
.themes button:hover{background:var(--hover)}
.themes button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.themes button.activenav{font-weight:bold;color:#ff0000}

.wrap{width:100%;max-width:900px;background:var(--panel);border:2px solid var(--border);border-radius:10px;padding:.75rem}
.clocks{display:flex;flex-wrap:wrap}
.card{flex:1 1 280px;background:var(--bg-softer);border:2px solid var(--border);border-radius:20px;margin:10px;padding:20px}
.card h2{font-size:1.4rem;font-weight:600}
.time{font-size:clamp(2.2rem,9vw,3.75rem);font-weight:700;line-height:1.15;margin:.5rem 0 .25rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap{font-size:.4em;font-weight:600;margin-left:.3em}
.date{font-size:1.1rem}
.note{margin-top:.5rem}
.diff{background:var(--bg-soft);border:2px solid var(--border);border-radius:20px;margin:0 10px 10px;padding:14px 20px;font-size:1.2rem;text-align:center}
@media (max-width:480px){main{padding:1rem .75rem}.card{padding:16px}}
</style>
</head>
<body>
<header><h1>Time tracker</h1></header>
<main>
<div class="themes" role="group" aria-label="Colour theme">
<span>Theme:</span>
<button type="button" data-set="grey">Grey</button>
<button type="button" data-set="light">Light</button>
<button type="button" data-set="dark">Dark</button>
</div>
<div class="wrap">
<div class="clocks">
<section class="card" aria-labelledby="h-ny">
<h2 id="h-ny">Eastern time</h2>
<p id="z-ny"></p>
<p class="time" id="t-ny" role="timer"></p>
<p class="date" id="d-ny"></p>
</section>
<section class="card" aria-labelledby="h-tbs">
<h2 id="h-tbs">Tbilisi, Georgia</h2>
<p id="z-tbs"></p>
<p class="time" id="t-tbs" role="timer"></p>
<p class="date" id="d-tbs"></p>
<p class="note" id="n-tbs"></p>
</section>
</div>
<p class="diff" id="diff"></p>
</div>
</main>
<footer>Eastern switches between EDT and EST on its own. Tbilisi stays on UTC+4 all year.</footer>
<script>
(function(){
var Z={ny:'America/New_York',tbs:'Asia/Tbilisi'};
function $(i){return document.getElementById(i)}
function local(tz,d){
  var o={};
  new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'})
    .formatToParts(d).forEach(function(p){if(p.type!=='literal')o[p.type]=+p.value});
  var t=Date.UTC(o.year,o.month-1,o.day,o.hour%24,o.minute,o.second);
  return{off:(t-Math.floor(d/1000)*1000)/60000,day:Math.floor(t/864e5)};
}
function fmtOff(m){var a=Math.abs(m),h=Math.floor(a/60),r=a%60;return(m<0?'-':'+')+h+(r?':'+('0'+r).slice(-2):'')}
function render(){
  var d=new Date(),L={};
  for(var k in Z){
    var o={};
    new Intl.DateTimeFormat('en-US',{timeZone:Z[k],hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,weekday:'long',month:'long',day:'numeric',year:'numeric',timeZoneName:'short'})
      .formatToParts(d).forEach(function(p){o[p.type]=p.value});
    L[k]=local(Z[k],d);
    $('t-'+k).innerHTML=o.hour+':'+o.minute+':'+o.second+'<span class="ap">'+o.dayPeriod+'</span>';
    $('d-'+k).textContent=o.weekday+', '+o.month+' '+o.day+', '+o.year;
    $('z-'+k).textContent=o.timeZoneName+' (UTC'+fmtOff(L[k].off)+')';
  }
  var dm=L.tbs.off-L.ny.off,h=Math.abs(dm)/60,hs=Number.isInteger(h)?h:h.toFixed(1);
  $('diff').textContent=dm===0?'Tbilisi and Eastern time match right now.':'Tbilisi is '+hs+(h===1?' hour ':' hours ')+(dm>0?'ahead of':'behind')+' Eastern time.';
  var dd=L.tbs.day-L.ny.day;
  $('n-tbs').textContent=dd===0?'Same day as you.':dd>0?'It is already tomorrow there.':'It is still yesterday there.';
}
function tick(){render();setTimeout(tick,1000-Date.now()%1000)}
tick();

var root=document.documentElement,btns=document.querySelectorAll('[data-set]');
function eff(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'grey')}
function mark(){var e=eff();btns.forEach(function(b){var on=b.dataset.set===e;b.classList.toggle('activenav',on);b.setAttribute('aria-pressed',on)})}
btns.forEach(function(b){b.addEventListener('click',function(){
  root.dataset.theme=b.dataset.set;
  try{localStorage.setItem('tt-theme',b.dataset.set)}catch(e){}
  mark();
})});
mark();
})();
</script>
</body>
</html>
