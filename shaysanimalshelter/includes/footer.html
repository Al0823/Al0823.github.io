  <img src="/shaysanimalshelter/images/facebook.png" alt="Example Logo">
</a>

<script>
(function () {

  function renderFooter() {
    var el = document.getElementById("dateTime");
    if (!el) return;

    var year = new Date().getFullYear();

    var text = "Copyright A.t.A. Projects, Websites, and Games, in association with Shay's Animal Shelter 2026-" + year;

    if (typeof el.textContent !== "undefined") {
      el.textContent = text;
    } else if (typeof el.innerText !== "undefined") {
      el.innerText = text;
    } else {
      el.innerHTML = text;
    }
  }

  renderFooter();

  setTimeout(renderFooter, 100);

})();
</script>
