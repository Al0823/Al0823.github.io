<header>

  <link id="mainStylesheet" rel="stylesheet" href="/shaysanimalshelter/css/style.css?v=4.6">

  <div class="header">
    Shay's Animal Shelter
  </div>

  <script>
  (function () {

    if (!window.vars) return;

    window.vars.WEBSITETITLE = "Shay's Animal Shelter";

    function updatePageTitle() {
      var pageTitle = (typeof window.PAGETITLE !== "undefined") ? window.PAGETITLE : "";
      var fullTitle = window.vars.WEBSITETITLE;

      if (pageTitle) {
        fullTitle = fullTitle + " - " + pageTitle;
      }

      document.title = fullTitle;

      var titleEl = document.getElementById("pageTitle");
      if (titleEl) {
        titleEl.innerHTML = fullTitle;
      }
    }

    if (window.vars.CSSVAR) {
      var mainLink = document.getElementById("mainStylesheet");
      if (mainLink) {
        mainLink.href = window.vars.CSSVAR + "style.css";
      }
    }

    if (window.vars.DEBUGVAR) {
      var devNotice = document.getElementById("devNotice");
      if (devNotice) {
        devNotice.style.display = "block";
      }
    }

    updatePageTitle();

  })();
  </script>

</header>
