<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<script>
var PAGETITLE = "Contact Form";
</script>

<title>Contact Form</title>

<script src="../js/vars.js"></script>
</head>

<body>

<header>
  <div id="header">Shay&#39;s Animal Shelter</div>
</header>

<div id="nav"></div>

<div class="main-wrapper">

  <div class="left">
    <img src="/shaysanimalshelter/images/unnamed.png" alt="Uh oh broken"><br><br>
    Organization Banner
  </div>

  <article>
    <h2>Contact Form</h2>

    <form id="contactForm">

      <fieldset>
        <legend>Name</legend>

        <label>First name:</label>
        <input type="text" id="fname" name="fname" required>

        <label>Last name:</label>
        <input type="text" id="lname" name="lname" required>
      </fieldset>

      <fieldset>
        <legend>Contact Information</legend>

        <label>Email:</label>
        <input type="text" id="Email" name="Email">

        <label>Address:</label>
        <input type="text" id="address" name="Address">

        <label>Phone number:</label>
        <input type="text" id="Phone" name="phone">
      </fieldset>

      <fieldset>
        <legend>Comments</legend>

        <label>Reason for contacting:</label>
        <select id="Reason" name="Reason">
          <option value="">Select One</option>
          <option>Homeless animals</option>
          <option>Surrendered animals</option>
          <option>Info on adoption</option>
          <option>Questions or comments</option>
          <option>Other</option>
        </select>

        <label>Comment:</label>
        <textarea id="comment" rows="6"></textarea>
      </fieldset>

      <input type="submit" value="Submit">

    </form>

    <div id="thankyou" style="display:none;">
      <h3>Thank you for contacting us!</h3>
      <p>We will get back to you soon.</p>
      <a href="/shaysanimalshelter/index.html">Back to Homepage</a>
    </div>

  </article>

</div>

<footer id="footer"></footer>

<script src="../js/includes.js"></script>

<script>

(function () {

  var form = document.getElementById("contactForm");
  if (!form) return;

  form.onsubmit = function () {

    var fname = document.getElementById('fname').value;
    var lname = document.getElementById('lname').value;
    var email = document.getElementById('Email').value;
    var address = document.getElementById('address').value;
    var phone = document.getElementById('Phone').value;
    var reason = document.getElementById('Reason').value;
    var comment = document.getElementById('comment').value;

    var body =
      "Name: " + fname + " " + lname + "\n" +
      "Email: " + email + "\n" +
      "Phone: " + phone + "\n" +
      "Address: " + address + "\n" +
      "Reason: " + reason + "\n" +
      "Comment: " + comment;

    var mailtoLink =
      "mailto:shaysanimalrescue@gmail.com" +
      "?subject=Contact Form Submission" +
      "&body=" + encodeURIComponent(body);

    window.open(mailtoLink);

    document.getElementById('contactForm').style.display = "none";
    document.getElementById('thankyou').style.display = "block";

    return false; 
  };

})();
</script>

<script>

(function () {
  var dateSpan = document.getElementById("dateTime");
  if (!dateSpan) return;

  var d = new Date();
  var year = d.getFullYear();

  dateSpan.innerHTML =
    "Copyright A.t.A. Tech Wiki, Shay's Animal Shelter 2026-" + year;
})();
</script>

</body>
</html>
