<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<!--<script src="/js/fuckyou.js"></script>-->
  <script>var PAGETITLE = "Contact Form";</script>
  <title id="pageTitle"></title>
  <script src="../js/vars.js"></script>
</head>
<body>
<header>
  <div id="header">Shay&#39;s Animal Shelter</div>
</header>
<div id="nav"></div>
<main>
	<div class="left"><img src="/shaysanimalshelter/images/unnamed.png" alt="Uh oh broken"><br><br>Organization Banner</div>
<article>
<h2>Contact Form</h2>

<form id="contactForm">
  <fieldset>
    <legend>Name</legend>
    <label for="fname">First name:</label>
    <input type="text" id="fname" name="fname" required>

    <label for="lname">Last name:</label>
    <input type="text" id="lname" name="lname" required>
  </fieldset>

  <fieldset>
    <legend>Contact Information</legend>
    <label for="Email">Email:</label>
    <input type="email" id="Email" name="Email">

    <label for="address">Address:</label>
    <input type="text" id="address" name="Address">

    <label for="Phone">Phone number:</label>
    <input type="tel" id="Phone" name="phone" placeholder="012-345-6789" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
  </fieldset>

  <fieldset>
    <legend>Comments</legend>
    <label for="Reason">Reason for contacting:</label>
    <select id="Reason" name="Reason" required>
      <option value="">Select One</option>
      <option>Homeless animals</option>
      <option>Surrendered animals</option>
      <option>Info on adoption</option>
						<option>Questions or comments</option>
      <option>Other</option>
    </select>







    <label for="comment">Comment:</label>
    <textarea name="comment" id="comment" rows="6" placeholder="Write your comment here"></textarea>
  </fieldset>

  <input type="submit" value="Submit">
</form>

<div id="thankyou" style="display:none;">
  <h3>Thank you for contacting us!</h3>
  <p>We will get back to you soon.</p>
  <a href="/shaysanimalshelter/index.html">Back to Homepage</a>
</div>
</article>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault(); 

  const fname = document.getElementById('fname').value;
  const lname = document.getElementById('lname').value;
  const email = document.getElementById('Email').value;
  const address = document.getElementById('address').value;
  const phone = document.getElementById('Phone').value;
  const reason = document.getElementById('Reason').value;
  const comment = document.getElementById('comment').value;

  
  const body = encodeURIComponent(
    `Name: ${fname} ${lname}
Email: ${email}
Phone: ${phone}
Address: ${address}
Reason: ${reason}
Comment: ${comment}`
  );

  const mailtoLink = `mailto:shaysanimalrescue@gmail.com?subject=Contact Form Submission&body=${body}`;

  
  window.open(mailtoLink, '_blank');

  
  document.getElementById('contactForm').style.display = 'none';
  document.getElementById('thankyou').style.display = 'block';
});
</script>
</main>

<footer id="footer"></footer>
<script src="../js/includes.js"></script>
<script>
 
  const dateSpan = document.getElementById("dateTime");
  if (dateSpan) {
    const currentYear = new Date().getFullYear();
    dateSpan.textContent = `Copyright A.t.A. Tech Wiki, Shay's Animal Shelter 2026-${currentYear}`;
  }
</script>
</body>
</html>
