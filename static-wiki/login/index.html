  <meta charset="UTF-8">

  <script src="/static-wiki/js/nav.js"></script>
  <script type="module" src="/static-wiki/js/content.js"></script>
  <script src="/static-wiki/js/include.js"></script>
</head>
<body>
<header><div id="header">A.t.A. Tech Wiki</div></header>
<main>
  <div id="nav"></div>
  <article>

    </style>

    <!-- Shown when already logged in -->
    <div id="loggedInPanel">
      <h3>You are logged in</h3>
      <p>Username: <b id="liUname"></b></p>
      <p>Name: <b id="liName"></b></p>
      <p>Admin: <b id="liAdmin"></b></p>
      <br>
      <a href="index.html?action=logout"><button>Log Out</button></a>
    </div>

    <!-- Shown when logged out -->
    <div class="login-wrap" id="loginPanel">
      <div class="login-flex">
        <div>
          <fieldset>
            <legend>Already a member? — Log in</legend>
            <label>Email:
              <input type="text" id="loginEmail" placeholder="Email" autocomplete="Email">
            </label>
            <label>Password:
              <input type="password" id="loginPword" placeholder="Password" autocomplete="current-password">
            </label>
            <button onclick="handleLogin()">Log In</button>
            <div class="err"  id="loginErr"></div>
            <div class="succ" id="loginSucc"></div>
          </fieldset>
        </div>

        <div>
          <fieldset>
            <legend>Become a Member — Sign Up</legend>
            <label>First name:
              <input type="text" id="signupFname" placeholder="First Name" autocomplete="given-name">
            </label>
            <label>Last name:
              <input type="text" id="signupLname" placeholder="Last Name" autocomplete="family-name">
            </label>
            <label>Email:
              <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
            </label>
            <label>Username:
              <input type="text" id="signupUname" placeholder="Username" autocomplete="off">
            </label>
            <label>Password:
              <input type="password" id="signupPword" placeholder="Password" autocomplete="new-password">
            </label>
            <label>Confirm password:
              <input type="password" id="signupPword2" placeholder="Confirm Password" autocomplete="new-password">
            </label>
            <button onclick="handleSignup()">Sign Up</button>
            <div class="err"  id="signupErr"></div>
            <div class="succ" id="signupSucc"></div>
          </fieldset>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("includesLoaded", function() {
        // Handle logout action before checking login state
        if (new URLSearchParams(location.search).get("action") === "logout") {
          logout();
          window.location.href = window.vars.PATHVAR + "index.html";
          return;
        }



        const user = getUser();
        if (user) {
          // Show logged-in state instead of the login form
          document.getElementById("loginPanel").style.display   = "none";
          document.getElementById("loggedInPanel").style.display = "";
document.getElementById("liUname").textContent =
  user.username || "";

document.getElementById("liName").textContent =
  (user.fname || "") + " " + (user.lname || "");
          document.getElementById("liAdmin").textContent  = user.ADMIN === "1" ? "Yes" : "No";
        }
      });

      async function handleLogin() {
const email = document.getElementById("loginEmail").value.trim();
        const pword = document.getElementById("loginPword").value;
        const err   = document.getElementById("loginErr");
        const succ  = document.getElementById("loginSucc");
        err.textContent  = "";
        succ.textContent = "";

        if (!email || !pword) { err.textContent = "Please enter your Email and password."; return; }

        try {
          const user = await login(email, pword);
          succ.textContent = "Logged in as " + user.uname + ". Redirecting...";
          setTimeout(function() {
            window.location.href = window.vars.PATHVAR + "index.html";
          }, 800);
        } catch(e) {
          err.textContent = e.message;
        }
      }

      async function handleSignup() {
        const fname  = document.getElementById("signupFname").value.trim();
        const lname  = document.getElementById("signupLname").value.trim();
        const email  = document.getElementById("signupEmail").value.trim();
        const uname  = document.getElementById("signupUname").value.trim();
        const pword  = document.getElementById("signupPword").value;
        const pword2 = document.getElementById("signupPword2").value;
        const err    = document.getElementById("signupErr");
        const succ   = document.getElementById("signupSucc");
        err.textContent  = "";
        succ.textContent = "";

        if (!fname || !lname || !email || !uname || !pword || !pword2) {
          err.textContent = "All fields are required."; return;
        }
        if (pword !== pword2) {
          err.textContent = "Passwords do not match."; return;
        }
        if (pword.length < 4) {
          err.textContent = "Password must be at least 4 characters."; return;
        }

        try {
          const user = await signup(fname, lname, email, uname, pword);
          succ.textContent = "Account created! Welcome, " + user.username + ". Redirecting...";
          setTimeout(function() {
            window.location.href = window.vars.PATHVAR + "index.html";
          }, 800);
        } catch(e) {
          err.textContent = e.message;
        }
      }

      // Allow pressing Enter to submit
      document.addEventListener("keydown", function(e) {
        if (e.key !== "Enter") return;
        const active = document.activeElement;
        if (active && active.closest("#loginPanel .login-flex > div:first-child")) handleLogin();
        if (active && active.closest("#loginPanel .login-flex > div:last-child"))  handleSignup();
      });
    </script>
  </article>
</main>
<footer id="footer"></footer>
<div id="debugInclude"></div>
</body>
</html>
