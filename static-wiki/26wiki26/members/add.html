<!DOCTYPE html>
<html lang="en">
	<!-- /static-wiki/26wiki26/members/add.html -->
<head>
  <meta charset="UTF-8">
  <script>var PAGETITLE = "Admin - Add Member";</script>
  <title id="pageTitle"></title>
  <script src="/static-wiki/js/vars.js"></script>
  <script src="/static-wiki/js/theme.js"></script>
  <script src="/static-wiki/js/nav.js"></script>
<script type="module" src="/static-wiki/js/content.js"></script>
  <script src="/static-wiki/js/include.js"></script>
</head>
<body>
<header><div id="header">A.t.A. Tech Wiki</div></header>
<main>
  <div id="nav"></div>
  <article>
    <script>document.addEventListener("includesLoaded", () => requireAdmin());</script>
    <h2>Add Member</h2>
    <label>First name:<br><input type="text" id="fname"></label><br><br>
    <label>Last name:<br><input type="text" id="lname"></label><br><br>
    <label>Email:<br><input type="email" id="email"></label><br><br>
    <label>Username:<br><input type="text" id="uname"></label><br><br>
    <label>Password:<br><input type="password" id="pword"></label><br><br>
    <label>Admin:
      <select id="admin"><option value="0">No</option><option value="1">Yes</option></select>
    </label><br><br>
    <button onclick="handleAdd()">Add Member</button>
    <a href="index.html" style="margin-left:12px">Cancel</a>
    <div id="err" style="color:#FF0000;margin-top:8px"></div>
    <script>
      async function handleAdd() {
        const err = document.getElementById("err");
        err.textContent = "";
        try {
          await adminAddMember({
            fname: document.getElementById("fname").value.trim(),
            lname: document.getElementById("lname").value.trim(),
            email: document.getElementById("email").value.trim(),
            uname: document.getElementById("uname").value.trim(),
            pword: document.getElementById("pword").value,
            admin: document.getElementById("admin").value,
          });
          window.location.href = "index.html";
        } catch(e) { err.textContent = e.message; }
      }
    </script>
  </article>
</main>
<footer id="footer"></footer>
<div id="debugInclude"></div>
</body>
</html>
