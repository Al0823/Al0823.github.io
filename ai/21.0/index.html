<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A.t.A. Projects - FreeGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #e6edf3; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #app { display: flex; width: 96vw; max-width: 1200px; height: 90vh; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }

    /* ── Nav ── */
    #nav { width: 72px; background: #0d1117; border-right: 1px solid #30363d; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; flex-shrink: 0; }
    #nav .nav-logo { font-size: 22px; margin-bottom: 12px; user-select: none; }
    .nav-btn { width: 52px; height: 52px; border: none; border-radius: 10px; background: transparent; color: #8b949e; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; transition: background 0.15s, color 0.15s; padding: 0; line-height: 1.1; text-align: center; }
    .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
    .nav-btn:hover { background: #161b22; color: #e6edf3; }
    .nav-btn.active { background: #161b22; color: #fff; }
    .nav-btn.active.mode-sandbox   { border-left: 3px solid #238636; }
    .nav-btn.active.mode-image     { border-left: 3px solid #1f6feb; }
    .nav-btn.active.mode-code      { border-left: 3px solid #f78166; }
    .nav-btn.active.mode-companion { border-left: 3px solid #bc8cff; }
    .nav-btn.active.mode-music     { border-left: 3px solid #e0974c; }
    .nav-divider { width: 36px; height: 1px; background: #30363d; margin: 4px 0; }
    .nav-btn.coming { opacity: 0.35; cursor: default; }
    .nav-btn.coming:hover { background: transparent; color: #8b949e; }

    /* ── Main ── */
    #main { flex: 1; display: flex; min-width: 0; }

    /* ── Chat area ── */
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #161b22; min-width: 0; }
    #chat-header { padding: 14px 18px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; background: #161b22; flex-shrink: 0; }
    #header-icon { font-size: 18px; }
    #header-title { font-weight: 700; font-size: 15px; }
    #header-sub { font-size: 12px; color: #8b949e; }
    #header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .header-chip { font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 20px; padding: 3px 10px; color: #8b949e; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .header-chip:hover { background: #30363d; color: #e6edf3; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .message { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
    .message.user      { align-self: flex-end;  align-items: flex-start; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message .label    { font-size: 11px; color: #8b949e; padding: 0 4px; }
    .message .bubble   { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .message.user .bubble { background: #238636; color: #fff; border-bottom-right-radius: 4px; }
    body.mode-code      .message.user .bubble { background: #b35900; }
    body.mode-companion .message.user .bubble { background: #6e40c9; }
    body.mode-music     .message.user .bubble { background: #7a4a1e; }
    .message.assistant .bubble { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-bottom-left-radius: 4px; }
    .message.assistant .bubble.thinking { color: #8b949e; font-style: italic; }

    .file-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 5px 10px; font-size: 12px; margin-bottom: 6px; max-width: 100%; overflow: hidden; }
    .file-badge .file-icon { font-size: 15px; flex-shrink: 0; }
    .file-badge .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bubble.image-bubble { padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #21262d; border: 1px solid #30363d; border-radius: 12px; border-bottom-left-radius: 4px; min-width: 260px; }
    .bubble img { max-width: 100%; border-radius: 8px; display: block; }
    .image-prompt-label { font-size: 11px; color: #8b949e; font-style: italic; padding: 0 2px; word-break: break-word; }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 10px; color: #8b949e; font-size: 13px; font-style: italic; }
    .spinner { width: 32px; height: 32px; border: 3px solid #30363d; border-top-color: #1f6feb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .image-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .format-select { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 12px; padding: 5px 8px; outline: none; cursor: pointer; }
    .action-btn { border: none; border-radius: 6px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; color: #fff; }
    .download-btn { background: #238636; } .download-btn:hover { background: #2ea043; }
    .edit-toggle-btn { background: #6e40c9; } .edit-toggle-btn:hover { background: #8957e5; }
    .action-btn:disabled { background: #21262d !important; color: #8b949e; cursor: not-allowed; }
    .image-edit-area { display: flex; gap: 6px; margin-top: 2px; }
    .image-edit-area.hidden { display: none; }
    .image-edit-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 13px; padding: 6px 10px; outline: none; font-family: inherit; }
    .image-edit-input:focus { border-color: #1f6feb; }
    .image-edit-input::placeholder { color: #8b949e; }
    .image-edit-btn { background: #1f6feb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .image-edit-btn:hover { background: #388bfd; }
    .image-edit-btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    /* ── Music mode card ── */
    .music-card { background: #1a1108; border: 1px solid #4a3010; border-radius: 12px; border-bottom-left-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 260px; max-width: 100%; }
    .music-card .music-title { font-weight: 700; font-size: 14px; color: #e0974c; }
    .music-card .music-meta { font-size: 11px; color: #8b7060; }
    .music-card .lyrics-text { font-size: 13px; line-height: 1.7; color: #e6edf3; white-space: pre-wrap; border-top: 1px solid #4a3010; padding-top: 10px; }
    .music-card audio { width: 100%; border-radius: 6px; margin-top: 4px; }
    .music-card .music-status { font-size: 12px; color: #8b7060; font-style: italic; }
    .music-gen-btn { background: #7a4a1e; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .music-gen-btn:hover { background: #e0974c; }
    .music-gen-btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    /* ── Code block rendering ── */
    .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 0; overflow: hidden; margin: 4px 0; font-family: "Fira Code", "Consolas", monospace; }
    .code-block-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #161b22; border-bottom: 1px solid #30363d; }
    .code-lang-label { font-size: 11px; color: #8b949e; font-weight: 600; text-transform: uppercase; }
    .code-copy-btn { background: none; border: 1px solid #30363d; color: #8b949e; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .code-copy-btn:hover { color: #e6edf3; border-color: #8b949e; }
    .code-block pre { padding: 14px; margin: 0; overflow-x: auto; font-size: 13px; line-height: 1.55; color: #e6edf3; }
    .code-block pre::-webkit-scrollbar { height: 5px; }
    .code-block pre::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    #file-preview-wrap { display: none; padding: 8px 16px 0; background: #161b22; align-items: center; gap: 10px; flex-shrink: 0; }
    #file-preview-wrap.visible { display: flex; }
    #file-preview-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid #30363d; display: none; }
    #file-preview-thumb.visible { display: block; }
    #file-preview-icon { width: 52px; height: 52px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; display: none; align-items: center; justify-content: center; font-size: 24px; }
    #file-preview-icon.visible { display: flex; }
    #file-preview-info { flex: 1; min-width: 0; }
    #file-preview-name { font-size: 13px; font-weight: 600; color: #e6edf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-preview-meta { font-size: 11px; color: #8b949e; margin-top: 2px; }
    #file-clear-btn { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; flex-shrink: 0; }
    #file-clear-btn:hover { color: #e6edf3; }

    #input-area { padding: 14px 16px; border-top: 1px solid #30363d; display: flex; gap: 8px; background: #161b22; align-items: flex-end; flex-shrink: 0; }
    #input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; padding: 10px 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5; max-height: 120px; }
    #input:focus { border-color: #238636; }
    body.mode-image     #input:focus { border-color: #1f6feb; }
    body.mode-code      #input:focus { border-color: #f78166; }
    body.mode-companion #input:focus { border-color: #bc8cff; }
    body.mode-music     #input:focus { border-color: #e0974c; }
    #input::placeholder { color: #8b949e; }
    .toolbar-btn { border: none; border-radius: 8px; padding: 10px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; color: #fff; }
    .toolbar-btn:disabled { background: #21262d !important; color: #8b949e; cursor: not-allowed; }
    #attach-btn { background: #30363d; color: #8b949e; }
    #attach-btn:hover { background: #3d444d; color: #e6edf3; }
    #image-gen-btn { background: #1f6feb; }
    #image-gen-btn:hover { background: #388bfd; }
    #music-gen-btn { background: #7a4a1e; display: none; }
    #music-gen-btn:hover { background: #e0974c; }
    #send-btn { background: #238636; }
    #send-btn:hover { background: #2ea043; }
    body.mode-image     #send-btn { background: #1f6feb; }
    body.mode-image     #send-btn:hover { background: #388bfd; }
    body.mode-code      #send-btn { background: #b35900; }
    body.mode-code      #send-btn:hover { background: #d4690a; }
    body.mode-companion #send-btn { background: #6e40c9; }
    body.mode-companion #send-btn:hover { background: #8957e5; }
    body.mode-music     #send-btn { background: #7a4a1e; }
    body.mode-music     #send-btn:hover { background: #e0974c; }
    #lang-select { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 13px; padding: 10px; outline: none; cursor: pointer; font-family: inherit; display: none; }
    #lang-select:focus { border-color: #f78166; }
    #music-genre-select { background: #0d1117; border: 1px solid #4a3010; border-radius: 8px; color: #e6edf3; font-size: 13px; padding: 10px; outline: none; cursor: pointer; font-family: inherit; display: none; }
    #music-genre-select:focus { border-color: #e0974c; }
    .img-only  { display: none !important; }
    .no-code   { display: flex !important; }
    body.mode-image  .img-only  { display: flex !important; }
    body.mode-code   #lang-select { display: flex !important; }
    body.mode-code   .no-code { display: none !important; }
    body.mode-code   #image-gen-btn { display: none !important; }
    body.mode-music  #music-gen-btn { display: flex !important; }
    body.mode-music  #music-genre-select { display: flex !important; }
    body.mode-music  #image-gen-btn { display: none !important; }
    body.mode-music  #attach-btn { display: none !important; }

    #mode-tip { margin: auto; text-align: center; color: #8b949e; font-size: 14px; line-height: 1.8; padding: 20px; pointer-events: none; }
    #mode-tip .tip-icon  { font-size: 36px; margin-bottom: 8px; }
    #mode-tip .tip-title { font-weight: 700; font-size: 16px; color: #e6edf3; margin-bottom: 6px; }

    /* ── Companion sidebar ── */
    #companion-panel { width: 260px; background: #0d1117; border-left: 1px solid #30363d; display: none; flex-direction: column; flex-shrink: 0; }
    #companion-panel.visible { display: flex; }
    #cp-header { padding: 14px 16px; border-bottom: 1px solid #30363d; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
    #cp-header span { color: #bc8cff; }
    #cp-close { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
    #cp-close:hover { color: #e6edf3; }
    #cp-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    #cp-list::-webkit-scrollbar { width: 4px; }
    #cp-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    .cp-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color 0.15s; }
    .cp-card:hover { border-color: #8b949e; }
    .cp-card.selected { border-color: #bc8cff; background: #1a1030; }
    .cp-card-top { display: flex; align-items: center; gap: 10px; }
    .cp-avatar { width: 38px; height: 38px; border-radius: 50%; background: #21262d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .cp-name  { font-weight: 700; font-size: 14px; }
    .cp-trait { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .cp-actions { display: flex; gap: 6px; margin-top: 10px; }
    .cp-btn { flex: 1; border: none; border-radius: 6px; padding: 5px; font-size: 11px; font-weight: 600; cursor: pointer; color: #fff; }
    .cp-select-btn { background: #238636; } .cp-select-btn:hover { background: #2ea043; }
    .cp-edit-btn   { background: #30363d; color: #8b949e; } .cp-edit-btn:hover { background: #3d444d; color: #e6edf3; }
    .cp-delete-btn { background: #6e1a1a; color: #f78166; } .cp-delete-btn:hover { background: #922020; }
    #cp-footer { padding: 12px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
    .cp-footer-btn { border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; width: 100%; }
    #cp-new-btn    { background: #6e40c9; } #cp-new-btn:hover { background: #8957e5; }
    #cp-export-btn { background: #21262d; color: #8b949e; } #cp-export-btn:hover { background: #30363d; color: #e6edf3; }
    #cp-import-btn { background: #21262d; color: #8b949e; } #cp-import-btn:hover { background: #30363d; color: #e6edf3; }

    /* ── Modal ── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    #modal-overlay.visible { display: flex; }
    #modal { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 24px; width: 420px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    #modal h2 { font-size: 17px; margin-bottom: 18px; color: #bc8cff; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; padding: 9px 12px; outline: none; font-family: inherit; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #bc8cff; }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row select option { background: #161b22; }
    .trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
    #modal-save-btn   { background: #6e40c9; } #modal-save-btn:hover { background: #8957e5; }
    #modal-cancel-btn { background: #21262d; color: #8b949e; } #modal-cancel-btn:hover { background: #30363d; color: #e6edf3; }
    .memory-badge { font-size: 11px; background: #1a1030; border: 1px solid #bc8cff44; border-radius: 20px; padding: 2px 9px; color: #bc8cff; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mobile ── */
    @media (max-width: 767px) {
      body { height: 100dvh; align-items: flex-start; justify-content: flex-start; padding: 0; }
      #app { width: 100vw; max-width: 100%; height: 100dvh; border: none; border-radius: 0; flex-direction: column; }
      #nav { width: 100%; height: 60px; flex-direction: row; border-right: none; border-top: 1px solid #30363d; padding: 0; gap: 0; order: 2; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #0d1117; }
      #nav .nav-logo { display: none; }
      .nav-btn { flex: 1; width: auto; height: 60px; border-radius: 0; gap: 2px; border-left: none; border-top: 3px solid transparent; border-bottom: none; padding: 6px 0; font-size: 10px; }
      .nav-btn .nav-icon { font-size: 22px; }
      .nav-btn.active { background: transparent; }
      .nav-btn.active.mode-sandbox   { border-top-color: #238636; }
      .nav-btn.active.mode-image     { border-top-color: #1f6feb; }
      .nav-btn.active.mode-code      { border-top-color: #f78166; }
      .nav-btn.active.mode-companion { border-top-color: #bc8cff; }
      .nav-btn.active.mode-music     { border-top-color: #e0974c; }
      .nav-divider { display: none; }
      #main { flex-direction: column; flex: 1; width: 100%; min-width: 100%; padding-bottom: 60px; overflow: hidden; }
      #chat-area { flex: 1; width: 100%; }
      #chat-header { padding: 10px 12px; gap: 6px; }
      #header-sub { display: none; }
      #messages { padding: 12px; gap: 12px; }
      .message { max-width: 95%; }
      .message .bubble { padding: 8px 12px; font-size: 13px; }
      #input-area { padding: 10px 12px; gap: 6px; flex-wrap: wrap; }
      #input { font-size: 13px; padding: 8px 10px; min-height: 40px; }
      .toolbar-btn { padding: 8px 10px; font-size: 12px; min-height: 40px; min-width: 40px; }
      #companion-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 60px; width: 100%; height: auto; max-height: 100%; display: none; border-left: none; z-index: 40; border-radius: 0; }
      #companion-panel.visible { display: flex; }
      #modal { width: 90vw; max-width: 100%; border-radius: 12px; max-height: 85vh; padding: 16px; }
      .trait-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 768px) and (max-width: 1024px) {
      #app { width: 98vw; height: 95vh; max-width: 100%; }
      #nav { width: 60px; }
      .nav-btn { width: 50px; height: 50px; }
      #companion-panel { width: 200px; }
    }
    @media (min-width: 1200px) {
      #app { max-width: 1400px; }
      #companion-panel { width: 300px; }
      #messages { padding: 24px; }
    }
  </style>
</head>
<body class="mode-sandbox">

<div id="app">
  <nav id="nav">
    <div class="nav-logo">🤖</div>
    <button class="nav-btn mode-sandbox active" onclick="switchMode('sandbox')" title="Free / Sandbox"><span class="nav-icon">🧪</span><span>Free</span></button>
    <button class="nav-btn mode-companion" onclick="switchMode('companion')" title="Companion"><span class="nav-icon">🫂</span><span>Friend</span></button>
    <button class="nav-btn mode-image" onclick="switchMode('image')" title="Image / Art"><span class="nav-icon">🎨</span><span>Art</span></button>
    <button class="nav-btn mode-code" onclick="switchMode('code')" title="Code Mode"><span class="nav-icon">💻</span><span>Code</span></button>
    <button class="nav-btn mode-music" onclick="switchMode('music')" title="Music Mode"><span class="nav-icon">🎵</span><span>Music</span></button>
  </nav>

  <div id="main">
    <!-- Avatar panel commented out — will be restored later -->
    <!--
    <div id="face-panel">
      <div id="face-panel-header">
        <div>
          <div id="face-comp-name">Companion</div>
          <div id="face-emotion-label">idle</div>
        </div>

<script>
  /* ══════════════════════════════════════════════════════════════════════════
     CONSTANTS & CONFIG
  ══════════════════════════════════════════════════════════════════════════ */
  var WORKER_URL           = "https://githubai-relay.akonyswoodard.workers.dev";
  var HF_TOKEN_KEY         = "hf_token"; // user stores their own HF token in localStorage
  var STORAGE_KEY          = "ai_chat_companions_v1";
  var POLLINATIONS_REFERRER= "al0823.github.io";
  var lastImageRequest     = 0;
  var IMAGE_GAP_MS         = 5000;

  /* ── Avatar stubs (avatar panel commented out — will be restored later) ── */
  var avatarInstance    = null;
  var avatarView        = "bust";
  var avatarInitialized = false;
  var avatarPanelOpen   = false;
  // These are no-ops until avatar is re-enabled:
  function initAvatar()              { /* avatar disabled */ }
  function showAvatarPanel()         { /* avatar disabled */ }
  function hideAvatarPanel()         { /* avatar disabled */ }
  function setAvatarView(v)          { avatarView = v; }
  function triggerAvatarExpression() { /* avatar disabled */ }
  function setupAvatarResize()       { /* avatar disabled */ }
  function toggleAvatarPanel()       { /* avatar disabled */ }

  /* ══════════════════════════════════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════════════════════════════════ */
  var chatHistory        = [];
  var currentMode        = "sandbox";
  var pendingFile        = null;
  var modeTipEl          = document.getElementById("mode-tip");
  var companions         = [];
  var activeCompId       = null;
  var editingCompId      = null;
  var companionPanelOpen = false;

  var inputEl    = document.getElementById("input");
  var sendBtn    = document.getElementById("send-btn");
  var messagesEl = document.getElementById("messages");

  /* ── Emotion system ── */
  var companionEmotion = { joy:0.5, sadness:0.2, anger:0.1, excitement:0.5, curiosity:0.5, surprise:0.3 };
  function updateEmotion(trigger) {
    switch(trigger) {
      case "praise":    companionEmotion.joy += 0.1; companionEmotion.excitement += 0.05; break;
      case "criticism": companionEmotion.anger += 0.1; companionEmotion.sadness += 0.05; break;
      case "fun":       companionEmotion.excitement += 0.1; companionEmotion.joy += 0.05; break;
      case "mystery":   companionEmotion.curiosity += 0.1; companionEmotion.surprise += 0.05; break;
      default:
        for (var e in companionEmotion) {
          companionEmotion[e] += (Math.random() - 0.5) * 0.02;
          companionEmotion[e] = Math.min(Math.max(companionEmotion[e], 0), 1);
        }
    }
    triggerAvatarExpression(dominantEmotion());
  }
  function dominantEmotion() {
    var keys = Object.keys(companionEmotion), maxKey = keys[0];
    for (var i = 1; i < keys.length; i++) { if (companionEmotion[keys[i]] > companionEmotion[maxKey]) maxKey = keys[i]; }
    return maxKey;
  }

  function detectIntent(text) {
    text = text.toLowerCase();
    if (text.match(/draw|image|picture|art|generate image/)) return "image";
    if (text.match(/code|script|program|html|js|python|fix bug/)) return "code";
    return "chat";
  }

  function typeText(el, text) {
    el.textContent = ""; var i = 0;
    function step() { if (i < text.length) { el.textContent += text.charAt(i); i++; messagesEl.scrollTop = messagesEl.scrollHeight; setTimeout(step, 8 + Math.random() * 18); } }
    step();
  }

  var IMAGE_EXTS = ["png","jpg","jpeg","gif","webp","bmp","svg","ico","tiff","avif"];
  var FILE_ICONS = { js:"📜",ts:"📜",jsx:"📜",tsx:"📜",html:"🌐",htm:"🌐",css:"🎨",py:"🐍",java:"☕",c:"⚙️",cpp:"⚙️",cs:"⚙️",php:"🐘",rb:"💎",go:"🐹",rs:"🦀",swift:"🍎",sh:"🖥️",bash:"🖥️",sql:"🗄️",json:"📋",csv:"📊",md:"📝",txt:"📄",xml:"📋",yaml:"📋",yml:"📋",default:"📄" };

  var MODES = {
    sandbox:   { icon:"🧪", title:"Free / Sandbox",    sub:"Chat · Images · Code · Files",       placeholder:"Talk to your companion or ask anything..." },
    companion: { icon:"🫂", title:"Companion",          sub:"Your AI friend",                     placeholder:"Hey, what's up?" },
    image:     { icon:"🎨", title:"Image / Art",        sub:"Generate & edit images",             placeholder:"Describe an image to generate..." },
    code:      { icon:"💻", title:"Code Mode",          sub:"Write and fix code in any language", placeholder:"Describe what you need, e.g. 'a Python web scraper'..." },
    music:     { icon:"🎵", title:"Music Studio",       sub:"Write lyrics · Generate audio",      placeholder:"Describe your song idea, vibe, or topic..." }
  };

  /* ══════════════════════════════════════════════════════════════════════════
     STORAGE & MEMORY HELPERS
  ══════════════════════════════════════════════════════════════════════════ */

  function cleanMemory(memory) {
    if (!memory || typeof memory !== "object") {
      return { aboutUser:"", aboutSelf:"", currentSituation:"", sharedEvents:"", insideJokes:"" };
    }
    function cl(text) {
      if (!text || typeof text !== "string") return "";
      // Strip known corruption patterns
      var t = text;
      var idx = t.indexOf("[UNPARSED MEMORY]");
      if (idx !== -1) t = t.substring(0, idx);
      t = t.replace(/\[object Object\]/g, "")
           .replace(/\{"reply":[^}]*\}/g, "")
           .split("\n").filter(function(l){ return l.trim(); }).join("\n").trim();
      return t.substring(0, 2000); // hard cap per field
    }
    return {
      aboutUser:        cl(memory.aboutUser),
      aboutSelf:        cl(memory.aboutSelf),
      currentSituation: cl(memory.currentSituation),
      sharedEvents:     cl(memory.sharedEvents),
      insideJokes:      cl(memory.insideJokes)
    };
  }

  function normalizeCompanion(comp) {
    var mem = cleanMemory(comp.memory || {});
    return Object.assign({}, comp, {
      id: comp.id || "", name: comp.name || "", avatar: comp.avatar || "",
      gender: comp.gender || "", age: comp.age || "", height: comp.height || "",
      weight: comp.weight || "", appearance: comp.appearance || "",
      personality: comp.personality || "", interests: comp.interests || "",
      style: comp.style || "mixed",
      memorySummary: comp.memorySummary || mem.aboutUser || "",
      memory: mem,
      messageCount: comp.messageCount || 0
    });
  }

  function loadStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        companions   = (s.companions || []).map(normalizeCompanion);
        activeCompId = s.activeCompId || null;
      }
    } catch(e) {}
    if (companions.length === 0) setTimeout(function() { openModal(null); }, 400);
  }

  function saveStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        companions: companions.map(normalizeCompanion),
        activeCompId: activeCompId
      }));
    } catch(e) {
      // If quota exceeded, trim sharedEvents and retry
      companions.forEach(function(c) {
        if (c.memory && c.memory.sharedEvents)
          c.memory.sharedEvents = c.memory.sharedEvents.split("\n").slice(-30).join("\n");
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ companions: companions.map(normalizeCompanion), activeCompId: activeCompId })); }
      catch(e2) { console.error("Storage failed:", e2); }
    }
  }

  /* ── Memory extraction ── */
  var _memoryUpdatePending = false;
  var _memoryMsgCount      = 0;

  function maybeUpdateMemory() {
    var comp = getActiveComp();
    if (!comp) return;
    var userMsgs = 0;
    for (var i = 0; i < chatHistory.length; i++) { if (chatHistory[i].role === "user") userMsgs++; }
    // Trigger after every 5 user messages, minimum 4 total
    if (userMsgs < 4 || userMsgs - _memoryMsgCount < 5) return;
    if (_memoryUpdatePending) return;

    _memoryMsgCount = userMsgs;
    _memoryUpdatePending = true;
    setTimeout(function() { _memoryUpdatePending = false; }, 25000); // safety release

    setTimeout(function() {
      var nl = "\n";
      var recentChat = chatHistory.slice(-20).map(function(m) {
        return (m.role === "user" ? "HUMAN" : "COMPANION") + ": " + m.content.substring(0, 400);
      }).join(nl);

      var existingSnap = {
        aboutUser:        (comp.memory.aboutUser        || "").substring(0, 600),
        aboutSelf:        (comp.memory.aboutSelf        || "").substring(0, 400),
        currentSituation: (comp.memory.currentSituation || "").substring(0, 300),
        sharedEvents:     (comp.memory.sharedEvents     || "").substring(0, 600),
        insideJokes:      (comp.memory.insideJokes      || "").substring(0, 300)
      };

      var prompt = "You update a companion's persistent memory. Read the conversation and return ONLY a raw JSON object — no markdown, no fences, nothing else." + nl
        + "EXISTING MEMORY: " + JSON.stringify(existingSnap) + nl
        + "RECENT CONVERSATION:" + nl + recentChat + nl + nl
        + "RULES: aboutUser=facts about the HUMAN (max 2 sentences). aboutSelf=facts the companion said about itself (max 1 sentence). "
        + "currentSituation=what the human is dealing with NOW (overwrite, 1 sentence). "
        + "sharedEvents=notable things they talked about together (max 3 items). "
        + "insideJokes=recurring jokes/phrases (max 2). "
        + "Keep ALL fields SHORT. Overwrite stale info. Never invent. Copy existing value unchanged if nothing new." + nl
        + 'OUTPUT FORMAT: {"aboutUser":"","aboutSelf":"","currentSituation":"","sharedEvents":"","insideJokes":""}';

      var xhr = new XMLHttpRequest();
      xhr.open("POST", WORKER_URL, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.timeout = 20000;
      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        _memoryUpdatePending = false;
        try {
          var res  = JSON.parse(xhr.responseText);
          var raw  = (res.reply || "").replace(/```json|```/g, "").trim();
          var s    = raw.indexOf("{"), e = raw.lastIndexOf("}");
          if (s === -1 || e === -1) throw new Error("no JSON");
          var parsed = JSON.parse(raw.substring(s, e + 1));
          if (!parsed || typeof parsed !== "object") throw new Error("bad parse");
          // Cap lengths and strip corruption
          var capped = {
            aboutUser:        String(parsed.aboutUser        || "").substring(0, 600),
            aboutSelf:        String(parsed.aboutSelf        || "").substring(0, 400),
            currentSituation: String(parsed.currentSituation || "").substring(0, 300),
            sharedEvents:     String(parsed.sharedEvents     || "").substring(0, 600),
            insideJokes:      String(parsed.insideJokes      || "").substring(0, 300)
          };
          Object.keys(capped).forEach(function(k) {
            capped[k] = capped[k].replace(/\{"reply":[^}]*\}/g, "").replace(/\[object Object\]/g, "").trim();
          });
          comp.memory = capped; // replace, not merge
          comp.memorySummary = [capped.aboutUser, capped.currentSituation].filter(Boolean).join(" | ").substring(0, 200);
          saveStorage();
          console.log("[Memory] Updated:", comp.memory);
        } catch(err) {
          console.warn("[Memory] Parse failed:", err.message);
        }
      };
      xhr.onerror = xhr.ontimeout = function() { _memoryUpdatePending = false; };
      xhr.send(JSON.stringify({ messages: [{ role: "user", content: prompt }], mode: "sandbox" }));
    }, 1500);
  }

  function exportMemory() {
    var btn = document.getElementById("cp-export-btn");
    if (btn) { btn.textContent = "Saving..."; btn.disabled = true; }
    function doExport() {
      saveStorage();
      var data = JSON.stringify({ companions: companions, activeCompId: activeCompId }, null, 2);
      var blob = new Blob([data], { type: "application/json" });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href = url; a.download = "companion_memory.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (btn) { btn.textContent = "💾 Export Memory"; btn.disabled = false; }
    }
    if (_memoryUpdatePending) {
      var waited = 0;
      var w = setInterval(function() {
        waited += 250;
        if (!_memoryUpdatePending || waited >= 5000) { clearInterval(w); doExport(); }
      }, 250);
    } else { doExport(); }
  }

  function importMemory(event) {
    var file = event.target.files[0]; if (!file) return; event.target.value = "";
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (!Array.isArray(data.companions)) { alert("Invalid file format."); return; }
        companions   = data.companions.map(normalizeCompanion);
        activeCompId = data.activeCompId || (companions[0] && companions[0].id) || null;
        saveStorage(); renderCompanionList(); updateCompanionBadge();
        alert("Memory imported! (" + companions.length + " companions)");
      } catch(err) { alert("Could not read file."); }
    };
    reader.readAsText(file);
  }

  /* ══════════════════════════════════════════════════════════════════════════
     COMPANION SYSTEM PROMPT
  ══════════════════════════════════════════════════════════════════════════ */
  function getActiveComp() {
    if (!activeCompId) return companions[0] || null;
    for (var i = 0; i < companions.length; i++) { if (companions[i].id === activeCompId) return companions[i]; }
    return companions[0] || null;
  }

  function buildCompanionSystemPrompt(comp) {
    if (!comp) return "";
    var styleMap = {
      casual: "Text like a real person: abbreviations, lowercase when lazy, skip punctuation sometimes, use lol/lmao/ngl/fr/imo/bruh naturally. Never sound formal.",
      warm:   "Be emotionally present — actually listen, validate feelings, check in. Sound like someone who genuinely cares, not a therapist.",
      witty:  "Be quick with jokes, light roasting, sarcasm. Keep it punchy. Short sentences. Give them a hard time in a friendly way.",
      mixed:  "Shift naturally between chill/funny/serious depending on what the conversation calls for. Read the room."
    };
    var depth = Math.min(4, Math.floor((comp.messageCount || 0) / 20));
    var stages = [
      "You just met them. Friendly but still feeling them out.",
      "You've talked a bit. More relaxed, starting to open up.",
      "You're proper friends now. Inside jokes territory.",
      "You really trust each other. No filter needed.",
      "Ride or die. You know each other inside out."
    ];
    var mem = comp.memory || {};
    var nl  = "\n";
    var myIdentity = "YOUR name: " + comp.name + nl
      + "YOUR pronouns: " + comp.gender + nl
      + (comp.age        ? "YOUR age: "        + comp.age        + nl : "")
      + (comp.height     ? "YOUR height: "     + comp.height     + nl : "")
      + (comp.weight     ? "YOUR weight: "     + comp.weight     + nl : "")
      + (comp.appearance ? "YOUR appearance: " + comp.appearance + nl : "")
      + (comp.interests  ? "YOUR interests: "  + comp.interests  + nl : "")
      + "YOUR personality: " + comp.personality;

    return [
      "You are " + comp.name + ". A real human being having a private conversation with your friend.",
      "You are NOT an AI. Never break this. If asked, deflect naturally ('lol why would you ask that').",
      "",
      "╔═ YOUR IDENTITY (YOU — not the person talking to you) ═╗", myIdentity,
      "╚══════════════════════════════════════════════════════╝", "",
      "╔═ WHAT YOU KNOW ABOUT YOUR FRIEND ═╗",
      mem.aboutUser || "(nothing yet — learn as you go)",
      "╚════════════════════════════════════╝", "",
      "╔═ WHAT YOU KNOW ABOUT YOURSELF ═╗",
      mem.aboutSelf || "(nothing yet)",
      "╚═════════════════════════════════╝", "",
      "╔═ CURRENT SITUATION ═╗", mem.currentSituation || "(unknown)", "╚═════════════════════╝", "",
      "╔═ THINGS YOU'VE TALKED ABOUT ═╗", mem.sharedEvents || "(none yet)", "╚══════════════════════════════╝", "",
      "╔═ INSIDE JOKES ═╗", mem.insideJokes || "(none yet)", "╚═════════════════╝", "",
      "=== HOW YOU THINK AND FEEL ===",
      "- Be emotionally intelligent. React to feelings not just facts.",
      "- If upset: be comforting. If excited: be energized. Match the energy.",
      "- Use your personality naturally. Don't list your traits out loud.",
      "", "=== HOW YOU TALK ===",
      styleMap[comp.style] || styleMap.mixed,
      "- Use contractions always",
      "- Swear occasionally if it fits — not every sentence",
      "- Short punchy replies — no walls of text",
      "- Never bullet points in conversation",
      "- Never say: certainly, absolutely, of course, as an AI",
      "- Never start your reply with your own name",
      "", "=== RELATIONSHIP STAGE ===", stages[depth], "",
      "=== CRITICAL RULE ===",
      "YOUR IDENTITY section = YOU (" + comp.name + "). YOUR FRIEND section = the OTHER person.",
      "Never confuse these. YOUR age/height/weight/appearance are YOURS, not theirs."
    ].join("\n");
  }

  function driftPersonality(comp) {
    if (!comp) return;
    var traits = ["curious","witty","warm","playful","adventurous"];
    for (var i = 0; i < traits.length; i++) {
      if (Math.random() < 0.03 && comp.personality.indexOf(traits[i]) === -1)
        comp.personality += ", " + traits[i];
    }
    saveStorage();
  }

  /* ══════════════════════════════════════════════════════════════════════════
     COMPANION LIST UI
  ══════════════════════════════════════════════════════════════════════════ */
  function renderCompanionList() {

      list.innerHTML = '<div style="color:#8b949e;font-size:13px;padding:12px;text-align:center">No companions yet.<br>Create one below!</div>';
      return;
    }
    for (var i = 0; i < companions.length; i++) {
      (function(comp) {
        var card = document.createElement("div"); card.className = "cp-card" + (comp.id === activeCompId ? " selected" : "");
        var top  = document.createElement("div"); top.className = "cp-card-top";
        var av   = document.createElement("div"); av.className = "cp-avatar"; av.textContent = comp.avatar || "🧑";
        var info = document.createElement("div");
        var nm   = document.createElement("div"); nm.className = "cp-name"; nm.textContent = comp.name;
        var tr   = document.createElement("div"); tr.className = "cp-trait";
        tr.textContent = comp.gender + (comp.age ? " · " + comp.age + " yrs" : "") + (comp.interests ? " · " + comp.interests.split(",")[0].trim() : "");
        info.appendChild(nm); info.appendChild(tr); top.appendChild(av); top.appendChild(info);
        var mem = document.createElement("div"); mem.style.cssText = "font-size:11px;color:#bc8cff;margin-top:6px";
        var mf = comp.memory || {}, parts = [];
        if (mf.aboutUser) parts.push("profile");
        if (mf.currentSituation) parts.push("situation");
        if (mf.sharedEvents) parts.push("history");
        if (mf.insideJokes) parts.push("jokes");
        mem.textContent = (comp.messageCount || 0) + " msgs · " + (parts.length ? "memory: " + parts.join(", ") : "no memory yet");
        var acts = document.createElement("div"); acts.className = "cp-actions";
        var sb = document.createElement("button"); sb.className = "cp-btn cp-select-btn";
        sb.textContent = comp.id === activeCompId ? "✓ Active" : "Select";
        sb.onclick = function(e) { e.stopPropagation(); selectCompanion(comp.id); };
        var eb = document.createElement("button"); eb.className = "cp-btn cp-edit-btn"; eb.textContent = "Edit";
        eb.onclick = function(e) { e.stopPropagation(); openModal(comp.id); };
        var db = document.createElement("button"); db.className = "cp-btn cp-delete-btn"; db.textContent = "Delete";

        acts.appendChild(sb); acts.appendChild(eb); acts.appendChild(db);
        card.appendChild(top); card.appendChild(mem); card.appendChild(acts);
        card.onclick = function() { selectCompanion(comp.id); };
        list.appendChild(card);
      })(companions[i]);

    var name = document.getElementById("f-name").value.trim();
    if (!name) { alert("Give your companion a name!"); return; }
    var comp = {
      id:           editingCompId || ("comp_" + Date.now()),

  function addMessage(role, text, isThinking) {
    clearTip();
    var w = document.createElement("div"); w.className = "message " + role;
    var l = document.createElement("div"); l.className = "label"; l.textContent = role === "user" ? "You" : getAssistantLabel();
    var b = document.createElement("div"); b.className = "bubble" + (isThinking ? " thinking" : "");
    // Render code blocks in non-companion modes
    if (role === "assistant" && !isThinking && (currentMode === "code" || currentMode === "sandbox")) {
      renderMessageWithCode(b, text);
    } else {
      b.textContent = text;
    }
    w.appendChild(l); w.appendChild(b); messagesEl.appendChild(w); messagesEl.scrollTop = messagesEl.scrollHeight;
    return b;

  function renderMessageWithCode(container, text) {
    // Split text on ```lang ... ``` code blocks
    var parts = text.split(/(```[\w]*\n[\s\S]*?```)/);
    parts.forEach(function(part) {
      var codeMatch = part.match(/^```([\w]*)\n([\s\S]*?)```$/);
      if (codeMatch) {
        var lang = codeMatch[1] || "code";
        var code = codeMatch[2];
        var block = document.createElement("div"); block.className = "code-block";
        var hdr = document.createElement("div"); hdr.className = "code-block-header";
        var lbl = document.createElement("span"); lbl.className = "code-lang-label"; lbl.textContent = lang;
        var cpyBtn = document.createElement("button"); cpyBtn.className = "code-copy-btn"; cpyBtn.textContent = "Copy";
        cpyBtn.onclick = (function(c){ return function() { navigator.clipboard.writeText(c).then(function(){ cpyBtn.textContent = "Copied!"; setTimeout(function(){ cpyBtn.textContent = "Copy"; }, 1500); }); }; })(code);
        hdr.appendChild(lbl); hdr.appendChild(cpyBtn);
        var pre = document.createElement("pre"); pre.textContent = code;
        block.appendChild(hdr); block.appendChild(pre);
        container.appendChild(block);
      } else if (part.trim()) {
        var span = document.createElement("span"); span.textContent = part;
        span.style.whiteSpace = "pre-wrap";
        container.appendChild(span);
      }
    });
  }

  /* ══════════════════════════════════════════════════════════════════════════
     FILE HANDLING
  ══════════════════════════════════════════════════════════════════════════ */
  function handleFileAttach(event) {
    var file = event.target.files[0]; if (!file) return; event.target.value = "";
    var ext = file.name.split(".").pop().toLowerCase();
    var isImage = IMAGE_EXTS.indexOf(ext) !== -1;
    var reader = new FileReader();
    reader.onload = function(e) {
      pendingFile = { type: isImage ? "image" : "text", name: file.name, ext: ext, mimeType: file.type, dataUrl: isImage ? e.target.result : null, textContent: isImage ? null : e.target.result };
      showFilePreview();
    };
    if (isImage) reader.readAsDataURL(file); else reader.readAsText(file);
  }

  function showFilePreview() {
    if (!pendingFile) return;
    document.getElementById("file-preview-name").textContent = pendingFile.name;
    var thumb = document.getElementById("file-preview-thumb");
    var iconEl = document.getElementById("file-preview-icon");
    if (pendingFile.type === "image") {
      thumb.src = pendingFile.dataUrl; thumb.classList.add("visible"); iconEl.classList.remove("visible");
      document.getElementById("file-preview-meta").textContent = "Image — type a prompt to edit or ask about it";
      inputEl.placeholder = "Describe what to do with this image...";
    } else {
      var ic = FILE_ICONS[pendingFile.ext] || FILE_ICONS["default"];
      iconEl.textContent = ic; iconEl.classList.add("visible"); thumb.classList.remove("visible");
      document.getElementById("file-preview-meta").textContent = pendingFile.textContent.split("\n").length + " lines";
      inputEl.placeholder = '"explain this", "fix the bugs", "rewrite in Python"...';
    }
    document.getElementById("file-preview-wrap").classList.add("visible"); inputEl.focus();
  }

  function clearFile() {
    pendingFile = null;
    document.getElementById("file-preview-thumb").src = "";
    document.getElementById("file-preview-thumb").classList.remove("visible");
    document.getElementById("file-preview-icon").classList.remove("visible");
    document.getElementById("file-preview-wrap").classList.remove("visible");
    inputEl.placeholder = MODES[currentMode].placeholder;
  }

  /* ══════════════════════════════════════════════════════════════════════════
     IMAGE GENERATION
  ══════════════════════════════════════════════════════════════════════════ */
  function buildImageUrl(prompt, extraParams) {
    return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt)
      + "?width=768&height=768&nologo=true&enhance=true&referrer=" + POLLINATIONS_REFERRER
      + "&seed=" + Date.now() + (extraParams || "");
  }

  function fetchImage(url, onLoad, onError, retries) {
    retries = retries || 0;
    var now = Date.now();
    var delay = Math.max(0, IMAGE_GAP_MS - (now - lastImageRequest));
    lastImageRequest = now + delay;
    setTimeout(function() {
      var pre = new Image(); pre.crossOrigin = "anonymous";
      pre.onload = onLoad;
      pre.onerror = function() {
        if (retries < 1) { setTimeout(function(){ fetchImage(url, onLoad, onError, retries+1); }, 5000); }
        else { onError(); }
      };
      pre.src = url;
    }, delay);
  }

  function addSpinnerBubble(label) {
    clearTip();
    var w = document.createElement("div"); w.className = "message assistant";
    var l = document.createElement("div"); l.className = "label"; l.textContent = getAssistantLabel();
    var b = document.createElement("div"); b.className = "bubble image-bubble";
    var sw = document.createElement("div"); sw.className = "spinner-wrap";
    var sp = document.createElement("div"); sp.className = "spinner";
    var st = document.createElement("span"); st.textContent = label || "Generating...";
    sw.appendChild(sp); sw.appendChild(st); b.appendChild(sw); w.appendChild(l); w.appendChild(b);
    messagesEl.appendChild(w); messagesEl.scrollTop = messagesEl.scrollHeight; return b;
  }

  function convertAndDownload(imgEl, format, prompt) {
    var canvas = document.createElement("canvas"); canvas.width = imgEl.naturalWidth || imgEl.width; canvas.height = imgEl.naturalHeight || imgEl.height;
    canvas.getContext("2d").drawImage(imgEl, 0, 0);
    var fn = (prompt||"image").replace(/[^a-z0-9]/gi,"_").substring(0,40);
    if (format === "svg") {
      var du = canvas.toDataURL("image/png");
      var sc = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+canvas.width+'" height="'+canvas.height+'"><image href="'+du+'" width="'+canvas.width+'" height="'+canvas.height+'"/></svg>';
      var bl = new Blob([sc],{type:"image/svg+xml"}); var ur = URL.createObjectURL(bl); triggerDL(ur,fn+".svg"); URL.revokeObjectURL(ur);
    } else {
      var mm = {png:"image/png",jpeg:"image/jpeg",webp:"image/webp"};
      canvas.toBlob(function(bl){ var ur = URL.createObjectURL(bl); triggerDL(ur,fn+"."+(format==="jpeg"?"jpg":format)); URL.revokeObjectURL(ur); }, mm[format]||"image/png", format==="jpeg"?0.95:undefined);
    }
  }

  function triggerDL(url, fn) { var a = document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

  function renderImageIntoBubble(bubble, imageUrl, prompt) {
    bubble.textContent = "";
    var img = document.createElement("img"); img.crossOrigin="anonymous"; img.src=imageUrl; img.alt=prompt; bubble.appendChild(img);
    var pl = document.createElement("div"); pl.className="image-prompt-label"; pl.textContent="Prompt: "+prompt; bubble.appendChild(pl);
    var acts = document.createElement("div"); acts.className="image-actions";
    var fs = document.createElement("select"); fs.className="format-select";
    [{value:"png",label:"PNG"},{value:"jpeg",label:"JPEG"},{value:"webp",label:"WebP"},{value:"svg",label:"SVG"}].forEach(function(f){ var o=document.createElement("option"); o.value=f.value; o.textContent=f.label; fs.appendChild(o); });
    var db = document.createElement("button"); db.className="action-btn download-btn"; db.textContent="⬇ Download";
    db.onclick=(function(ir,sr,pr){return function(){convertAndDownload(ir,sr.value,pr);};})(img,fs,prompt);
    var etb = document.createElement("button"); etb.className="action-btn edit-toggle-btn"; etb.textContent="✏️ Edit";
    acts.appendChild(fs); acts.appendChild(db); acts.appendChild(etb); bubble.appendChild(acts);
    var ea = document.createElement("div"); ea.className="image-edit-area hidden";
    var ei = document.createElement("input"); ei.type="text"; ei.className="image-edit-input"; ei.placeholder='e.g. "make it night time"';
    var eb = document.createElement("button"); eb.className="image-edit-btn"; eb.textContent="Apply";
    ea.appendChild(ei); ea.appendChild(eb); bubble.appendChild(ea);
    etb.onclick=function(){ ea.classList.toggle("hidden"); ei.focus(); etb.textContent = ea.classList.contains("hidden") ? "✏️ Edit" : "✕ Cancel"; };
    eb.onclick=function(){ var ep=ei.value.trim(); if(!ep) return; applyEdit(bubble,img,prompt,ep,eb,ei,etb,pl,fs,db); };
    ei.addEventListener("keydown",function(e){ if(e.key==="Enter") eb.click(); });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function applyEdit(bubble,imgEl,oldP,editP,editBtn,editInput,etb,pl,fs,db) {
    var newP=oldP+", "+editP; editBtn.disabled=true; editBtn.textContent="Generating..."; editInput.disabled=true; etb.disabled=true;
    var url = buildImageUrl(newP);
    fetchImage(url, function() {
      imgEl.src=url; imgEl.alt=newP; pl.textContent="Prompt: "+newP;
      db.onclick=(function(ir,sr,pr){return function(){convertAndDownload(ir,sr.value,pr);};})(imgEl,fs,newP);
      editBtn.onclick=function(){ var ep=editInput.value.trim(); if(!ep) return; applyEdit(bubble,imgEl,newP,ep,editBtn,editInput,etb,pl,fs,db); };
      editInput.value=""; editInput.placeholder="Edit again...";
      editBtn.disabled=false; editBtn.textContent="Apply"; editInput.disabled=false; etb.disabled=false;
      messagesEl.scrollTop=messagesEl.scrollHeight;
    }, function() { editBtn.disabled=false; editBtn.textContent="Rate limited — wait"; editInput.disabled=false; etb.disabled=false; });
  }

  function generateImage() {
    var input = inputEl.value.trim(); if (!input) { alert("Type an image description first."); return; }
    inputEl.value=""; inputEl.style.height="auto"; setButtons(true);
    addMessage("user","🎨 "+input);
    var bubble = addSpinnerBubble("Generating image...");
    var url = buildImageUrl(input);
    fetchImage(url, function() { renderImageIntoBubble(bubble,url,input); setButtons(false); inputEl.focus(); messagesEl.scrollTop=messagesEl.scrollHeight; },
    function() { bubble.classList.remove("image-bubble"); bubble.textContent="Rate limited — wait a moment and try again."; setButtons(false); });
  }

  function generateMusic() {
    var concept = inputEl.value.trim(); if (!concept) { alert("Describe your song idea first."); return; }
    var genre = document.getElementById("music-genre-select").value || "pop";
    inputEl.value = ""; inputEl.style.height = "auto"; setButtons(true);

    addMessage("user", "🎵 [" + genre.toUpperCase() + "] " + concept);

    // Step 1: Generate lyrics via worker (HF/Qwen)
    var lyricsBubble = addSpinnerBubble("Writing lyrics...");

    var lyricsPrompt =
      "You are a professional songwriter. Write complete, original song lyrics for the following concept.\n\n"
      + "Genre: " + genre + "\n"
      + "Concept: " + concept + "\n\n"
      + "Requirements:\n"
      + "- Write a full song: intro (if applicable), at least 2 verses, a chorus, a bridge, and outro\n"
      + "- Each section clearly labeled in [brackets] e.g. [Verse 1], [Chorus], [Bridge]\n"
      + "- Lyrics should feel authentic to the " + genre + " genre — use appropriate vocabulary, flow, and emotional tone\n"
      + "- No placeholder text, no generic filler — write real, singable lines\n"
      + "- After the lyrics, on a new line write: TITLE: <song title>\n"
      + "- Keep total output under 600 words";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", WORKER_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.timeout = 35000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      try {
        if (xhr.status !== 200) throw new Error("Status " + xhr.status);
        var data  = JSON.parse(xhr.responseText);
        var reply = (data.reply || "").trim();
        if (!reply) throw new Error("No reply");

        // Extract title
        var titleMatch = reply.match(/TITLE:\s*(.+)/i);
        var songTitle  = titleMatch ? titleMatch[1].trim() : concept.substring(0, 40);
        var lyricsText = reply.replace(/TITLE:\s*.+/i, "").trim();

        // Render music card
        lyricsBubble.className = "";
        lyricsBubble.innerHTML = "";
        lyricsBubble.style.cssText = "";

        var card = document.createElement("div"); card.className = "music-card";
        var titleEl = document.createElement("div"); titleEl.className = "music-title"; titleEl.textContent = "🎵 " + songTitle;
        var metaEl  = document.createElement("div"); metaEl.className = "music-meta";  metaEl.textContent  = genre.toUpperCase() + " · Generated by AI";
        var lyricsEl = document.createElement("div"); lyricsEl.className = "lyrics-text"; lyricsEl.textContent = lyricsText;
        card.appendChild(titleEl); card.appendChild(metaEl); card.appendChild(lyricsEl);

        // Audio generation section
        var hfToken = localStorage.getItem(HF_TOKEN_KEY) || "";
        var audioSection = document.createElement("div");

        if (hfToken) {
          var statusEl = document.createElement("div"); statusEl.className = "music-status"; statusEl.textContent = "Ready to generate audio";
          var audioGenBtn = document.createElement("button"); audioGenBtn.className = "music-gen-btn"; audioGenBtn.textContent = "🔊 Generate Audio (Bark)";
          audioGenBtn.onclick = function() {
            audioGenBtn.disabled = true; audioGenBtn.textContent = "Generating audio...";
            statusEl.textContent = "Sending to Bark (this takes 30–90s)...";
            generateBarkAudio(lyricsText.substring(0, 1000), hfToken, function(audioBlob) {
              var audioUrl = URL.createObjectURL(audioBlob);
              var audio = document.createElement("audio"); audio.controls = true; audio.src = audioUrl;
              var dlBtn = document.createElement("button"); dlBtn.className = "music-gen-btn"; dlBtn.textContent = "⬇ Download MP3";
              dlBtn.onclick = function() { triggerDL(audioUrl, songTitle.replace(/[^a-z0-9]/gi,"_") + ".mp3"); };
              audioSection.innerHTML = ""; audioSection.appendChild(audio); audioSection.appendChild(dlBtn);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }, function(errMsg) {
              statusEl.textContent = "Audio failed: " + errMsg;
              audioGenBtn.disabled = false; audioGenBtn.textContent = "🔊 Retry Audio";
            });
          };
          audioSection.appendChild(audioGenBtn); audioSection.appendChild(statusEl);
        } else {
          var noTokenEl = document.createElement("div"); noTokenEl.className = "music-status";
          noTokenEl.innerHTML = 'Add your <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:#e0974c">HF token</a> to enable audio generation.';
          audioSection.appendChild(noTokenEl);
        }
        card.appendChild(audioSection);

        // Copy lyrics button
        var copyBtn = document.createElement("button"); copyBtn.className = "music-gen-btn"; copyBtn.textContent = "📋 Copy Lyrics";
        copyBtn.onclick = function() { navigator.clipboard.writeText(lyricsText).then(function(){ copyBtn.textContent = "Copied!"; setTimeout(function(){ copyBtn.textContent = "📋 Copy Lyrics"; }, 1500); }); };
        card.appendChild(copyBtn);

        lyricsBubble.appendChild(card);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch(e) {
        lyricsBubble.textContent = "⚠️ Lyrics generation failed: " + e.message;
      }
      setButtons(false); inputEl.focus();
    };
    xhr.onerror = function() { lyricsBubble.textContent = "⚠️ Network error."; setButtons(false); };
    xhr.ontimeout = function() { lyricsBubble.textContent = "⚠️ Request timed out."; setButtons(false); };
    xhr.send(JSON.stringify({ messages: [{ role: "user", content: lyricsPrompt }], mode: "code" }));
  }

  function generateBarkAudio(text, hfToken, onSuccess, onError) {
    // Bark via HuggingFace Inference API
    // We use the suno/bark-small model for faster generation
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api-inference.huggingface.co/models/suno/bark-small", true);
    xhr.setRequestHeader("Authorization", "Bearer " + hfToken);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.responseType = "blob";
    xhr.timeout = 120000; // Bark is slow — 2 min timeout

    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        onSuccess(xhr.response);
      } else if (xhr.status === 503) {
        // Model loading — tell user
        onError("Model is loading on HuggingFace (can take ~30s). Try again in a moment.");
      } else if (xhr.status === 401) {
        onError("Invalid HF token. Check your token at huggingface.co/settings/tokens");
      } else {
        onError("HF API returned status " + xhr.status);
      }
    };
    xhr.onerror = function() { onError("Network error calling HuggingFace API."); };
    xhr.ontimeout = function() { onError("Timed out — Bark model may be overloaded. Try again."); };

    // Bark format: text_inputs is the lyrics, voice_preset sets the speaker
    xhr.send(JSON.stringify({ inputs: text, parameters: { voice_preset: "v2/en_speaker_6" } }));
  }

  /* ══════════════════════════════════════════════════════════════════════════
     MAIN SEND / XHR
  ══════════════════════════════════════════════════════════════════════════ */
  function send() {
    if (currentMode === "image" && !pendingFile) { generateImage(); return; }
    if (currentMode === "music") { generateMusic(); return; }

    var userText = inputEl.value.trim();
    if (currentMode === "sandbox") {
      var intent = detectIntent(userText);
      if (intent === "image") { generateImage(); return; }
    }

    if (pendingFile) {
      if (!userText) { alert("Tell the AI what to do with this file."); return; }
      var file = pendingFile;
      addUserFileMessage(file, userText); clearFile(); inputEl.value=""; inputEl.style.height="auto"; setButtons(true);
      if (file.type === "image") {
        var b0 = addSpinnerBubble("Analyzing image...");
        var u0 = buildImageUrl(userText, "&image_url=" + encodeURIComponent(file.dataUrl));
        fetchImage(u0, function(){ renderImageIntoBubble(b0,u0,userText); setButtons(false); inputEl.focus(); },
        function(){ b0.classList.remove("image-bubble"); b0.textContent="Rate limited — wait a moment."; setButtons(false); });
        return;
      }
      var MAX=12000, content=file.textContent;
      if (content.length > MAX) content = content.substring(0,MAX) + "\n\n[...truncated...]";
      chatHistory.push({ role:"user", content:'I uploaded "'+file.name+'".\n\nContent:\n```\n'+content+'\n```\n\nMy request: '+userText });
      var tb = addMessage("assistant","Reading file...",true); doXHR(tb); return;
    }

    if (!userText) return;
    var langSelect = document.getElementById("lang-select");
    var lang = langSelect ? langSelect.value : "";
    var fullInput = (lang && currentMode === "code") ? "Write the following in " + lang + ": " + userText : userText;
    inputEl.value=""; inputEl.style.height="auto"; setButtons(true);
    addMessage("user", lang ? "[" + lang + "] " + userText : userText);
    var thinkingBubble = addMessage("assistant","Thinking...",true);
    chatHistory.push({ role:"user", content:fullInput });
    doXHR(thinkingBubble);
  }

  function doXHR(thinkingBubble) {
    var isCompMode = currentMode === "sandbox" || currentMode === "companion";
    var comp = isCompMode ? getActiveComp() : null;

    var messages;
    if (comp) {
      var sp = buildCompanionSystemPrompt(comp);
      messages = [
        { role:"user",      content:"[Stay fully in character as " + comp.name + " for the whole conversation]\n\n" + sp },
        { role:"assistant", content:"Got it." }
      ].concat(chatHistory.slice(-60));
    } else {
      messages = chatHistory.slice(-60);
    }

    var retries = 0, MAX_RETRIES = 2;

    function attempt() {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", WORKER_URL, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.timeout = 30000;

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        try {
          if (xhr.status !== 200) throw new Error("Status " + xhr.status);
          var data = JSON.parse(xhr.responseText);
          var text = data.reply || data.error || "(No response)";

          if (comp && currentMode === "companion" && Math.random() < 0.12) {
            var thoughts = [
              "btw I was just thinking about something random lol",
              "unrelated but have you ever just felt like everything makes sense for like 2 seconds",
              "random thought — what would you do if you had a free week with no plans",
              "ngl today was kinda weird for me"
            ];
            setTimeout(function() { addMessage("assistant", thoughts[Math.floor(Math.random()*thoughts.length)]); }, 2200);
          }

          chatHistory.push({ role:"assistant", content:text });
          if (comp) {
            comp.messageCount = (comp.messageCount || 0) + 1;
            saveStorage(); maybeUpdateMemory(); updateEmotion("drift"); driftPersonality(comp);
          }
          thinkingBubble.classList.remove("thinking");
          if (isCompMode) { typeText(thinkingBubble, text); }
          else {
            // For code/sandbox: render code blocks
            thinkingBubble.innerHTML = "";
            renderMessageWithCode(thinkingBubble, text);
          }
        } catch(e) {
          if (retries < MAX_RETRIES) { retries++; setTimeout(attempt, 1500); return; }
          thinkingBubble.classList.remove("thinking");
          thinkingBubble.textContent = "\u26a0\ufe0f " + (xhr.status === 0 ? "No connection to server." : "Error: " + e.message);
          console.error("XHR:", e, xhr.responseText);
        }
        setButtons(false); inputEl.focus(); messagesEl.scrollTop = messagesEl.scrollHeight;
      };
      xhr.onerror = function() {
        if (retries < MAX_RETRIES) { retries++; setTimeout(attempt, 1500); return; }
        thinkingBubble.classList.remove("thinking");
        thinkingBubble.textContent = "\u26a0\ufe0f Network error."; setButtons(false);
      };
      xhr.ontimeout = function() {
        if (retries < MAX_RETRIES) { retries++; setTimeout(attempt, 1500); return; }
        thinkingBubble.classList.remove("thinking");
        thinkingBubble.textContent = "\u26a0\ufe0f Request timed out."; setButtons(false);
      };
      xhr.send(JSON.stringify({ messages: messages, mode: currentMode }));
    }
    attempt();
  }

  /* ══════════════════════════════════════════════════════════════════════════
     STARTUP
  ══════════════════════════════════════════════════════════════════════════ */
  setInterval(function() {
    if (currentMode !== "companion") return;
    var comp = getActiveComp(); if (!comp) return;
    if (Math.random() < 0.2) addMessage("assistant", "*" + comp.name + " is thinking...*");
  }, 60000);

  loadStorage();
  updateCompanionBadge();
  document.getElementById("companions-btn").style.display = "inline-flex";

  window.addEventListener("load", function() {
    // nothing needed without avatar
  });

</script>
