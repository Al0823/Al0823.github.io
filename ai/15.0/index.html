<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A.t.A. Projects - FreeGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #e6edf3;
      height: 100vh; display: flex; align-items: center; justify-content: center;
    }

    #app { display: flex; width: 96vw; max-width: 1200px; height: 90vh; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }

    /* ── Nav ── */
    #nav { width: 72px; background: #0d1117; border-right: 1px solid #30363d; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; flex-shrink: 0; }
    #nav .nav-logo { font-size: 22px; margin-bottom: 12px; user-select: none; }
    .nav-btn { width: 52px; height: 52px; border: none; border-radius: 10px; background: transparent; color: #8b949e; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; transition: background 0.15s, color 0.15s; padding: 0; line-height: 1.1; text-align: center; }
    .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
    .nav-btn:hover { background: #161b22; color: #e6edf3; }
    .nav-btn.active { background: #161b22; color: #fff; }
    .nav-btn.active.mode-sandbox   { border-left: 3px solid #238636; }
    .nav-btn.active.mode-image     { border-left: 3px solid #1f6feb; }
    .nav-btn.active.mode-code      { border-left: 3px solid #f78166; }
    .nav-btn.active.mode-companion { border-left: 3px solid #bc8cff; }
    .nav-divider { width: 36px; height: 1px; background: #30363d; margin: 4px 0; }
    .nav-btn.coming { opacity: 0.35; cursor: default; }
    .nav-btn.coming:hover { background: transparent; color: #8b949e; }

    /* ── Main ── */
    #main { flex: 1; display: flex; min-width: 0; }

    /* ── Face Panel ── */
    #face-panel {
      width: 240px; flex-shrink: 0;
      background: #0d1117; border-right: 1px solid #30363d;
      display: none; flex-direction: column;
      align-items: center;
    }
    #face-panel.visible { display: flex; }

    #face-panel-header {
      width: 100%; padding: 10px 12px;
      border-bottom: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    #face-comp-name { font-weight: 700; font-size: 13px; color: #bc8cff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #face-emotion-label { font-size: 10px; color: #8b949e; margin-top: 1px; }

    /* View toggle buttons */
    #face-view-toggle { display: flex; gap: 4px; }
    .face-view-btn {
      border: 1px solid #30363d; background: transparent; color: #8b949e;
      border-radius: 5px; padding: 3px 7px; font-size: 10px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .face-view-btn:hover { background: #161b22; color: #e6edf3; }
    .face-view-btn.active { background: #bc8cff22; border-color: #bc8cff; color: #bc8cff; }

    /* Image container */
    #face-image-wrap {
      position: relative; width: 100%; flex: 1;
      overflow: hidden; background: #080d13;
      display: flex; align-items: center; justify-content: center;
    }

    #face-photo {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      display: block; transition: opacity 0.4s;
    }

    #face-photo.portrait-mode  { object-position: top center; }
    #face-photo.fullbody-mode  { object-position: center center; }

    #face-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #080d13; color: #8b949e; font-size: 12px; gap: 10px;
      text-align: center; padding: 20px;
    }

    #face-loading .face-spinner {
      width: 28px; height: 28px;
      border: 2px solid #30363d; border-top-color: #bc8cff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    /* SVG expression overlay */
    #face-svg-overlay {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    /* Expression classes on the SVG */
    #face-svg-overlay.expr-joy      { --eye-curve: -6; --brow-y: -4; --mouth-curve: 8; }
    #face-svg-overlay.expr-sadness  { --eye-curve: 2;  --brow-y: 4;  --mouth-curve: -6; }
    #face-svg-overlay.expr-anger    { --eye-curve: 2;  --brow-y: 6;  --mouth-curve: -3; }
    #face-svg-overlay.expr-excitement { --eye-curve: -8; --brow-y: -6; --mouth-curve: 10; }
    #face-svg-overlay.expr-curiosity { --eye-curve: -2; --brow-y: -8; --mouth-curve: 2; }
    #face-svg-overlay.expr-surprise  { --eye-curve: -4; --brow-y: -10; --mouth-curve: 0; }
    #face-svg-overlay.expr-idle      { --eye-curve: 0;  --brow-y: 0;  --mouth-curve: 2; }

    /* Idle breathing */
    @keyframes breathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50%       { transform: scaleY(1.008) translateY(-2px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #face-photo.loaded { animation: breathe 4s ease-in-out infinite; transform-origin: bottom center; }

    #face-footer {
      width: 100%; padding: 8px 12px;
      border-top: 1px solid #30363d; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 4px;
    }

    #face-regen-btn {
      width: 100%; border: 1px solid #30363d; background: transparent;
      color: #8b949e; border-radius: 6px; padding: 5px;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    #face-regen-btn:hover { background: #161b22; color: #e6edf3; }

    /* ── Chat area ── */
    #chat-area { flex: 1; display: flex; flex-direction: column; background: #161b22; min-width: 0; }

    #chat-header { padding: 14px 18px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 10px; background: #161b22; flex-shrink: 0; }
    #header-icon  { font-size: 18px; }
    #header-title { font-weight: 700; font-size: 15px; }
    #header-sub   { font-size: 12px; color: #8b949e; }
    #header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .header-chip  { font-size: 11px; background: #21262d; border: 1px solid #30363d; border-radius: 20px; padding: 3px 10px; color: #8b949e; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .header-chip:hover { background: #30363d; color: #e6edf3; }

    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    .message { display: flex; flex-direction: column; max-width: 85%; gap: 4px; }
    .message.user      { align-self: flex-end;  align-items: flex-start; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message .label    { font-size: 11px; color: #8b949e; padding: 0 4px; }
    .message .bubble   { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .message.user .bubble { background: #238636; color: #fff; border-bottom-right-radius: 4px; }
    body.mode-code      .message.user .bubble { background: #b35900; }
    body.mode-companion .message.user .bubble { background: #6e40c9; }
    .message.assistant .bubble { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-bottom-left-radius: 4px; }
    .message.assistant .bubble.thinking { color: #8b949e; font-style: italic; }

    .file-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 5px 10px; font-size: 12px; margin-bottom: 6px; max-width: 100%; overflow: hidden; }
    .file-badge .file-icon { font-size: 15px; flex-shrink: 0; }
    .file-badge .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bubble.image-bubble { padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #21262d; border: 1px solid #30363d; border-radius: 12px; border-bottom-left-radius: 4px; min-width: 260px; }
    .message.user .bubble.image-bubble { background: #238636; border: none; border-bottom-right-radius: 4px; border-bottom-left-radius: 12px; }
    .bubble img { max-width: 100%; border-radius: 8px; display: block; }
    .image-prompt-label { font-size: 11px; color: #8b949e; font-style: italic; padding: 0 2px; word-break: break-word; }
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 10px; color: #8b949e; font-size: 13px; font-style: italic; }
    .spinner { width: 32px; height: 32px; border: 3px solid #30363d; border-top-color: #1f6feb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .image-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .format-select { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 12px; padding: 5px 8px; outline: none; cursor: pointer; }
    .action-btn { border: none; border-radius: 6px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; color: #fff; }
    .download-btn { background: #238636; } .download-btn:hover { background: #2ea043; }
    .edit-toggle-btn { background: #6e40c9; } .edit-toggle-btn:hover { background: #8957e5; }
    .action-btn:disabled { background: #21262d !important; color: #8b949e; cursor: not-allowed; }
    .image-edit-area { display: flex; gap: 6px; margin-top: 2px; }
    .image-edit-area.hidden { display: none; }
    .image-edit-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; font-size: 13px; padding: 6px 10px; outline: none; font-family: inherit; }
    .image-edit-input:focus { border-color: #1f6feb; }
    .image-edit-input::placeholder { color: #8b949e; }
    .image-edit-btn { background: #1f6feb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .image-edit-btn:hover { background: #388bfd; }
    .image-edit-btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    #file-preview-wrap { display: none; padding: 8px 16px 0; background: #161b22; align-items: center; gap: 10px; flex-shrink: 0; }
    #file-preview-wrap.visible { display: flex; }
    #file-preview-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid #30363d; display: none; }
    #file-preview-thumb.visible { display: block; }
    #file-preview-icon { width: 52px; height: 52px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; display: none; align-items: center; justify-content: center; font-size: 24px; }
    #file-preview-icon.visible { display: flex; }
    #file-preview-info { flex: 1; min-width: 0; }
    #file-preview-name { font-size: 13px; font-weight: 600; color: #e6edf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #file-preview-meta { font-size: 11px; color: #8b949e; margin-top: 2px; }
    #file-clear-btn { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; flex-shrink: 0; }
    #file-clear-btn:hover { color: #e6edf3; }

    #input-area { padding: 14px 16px; border-top: 1px solid #30363d; display: flex; gap: 8px; background: #161b22; align-items: flex-end; flex-shrink: 0; }
    #input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; padding: 10px 14px; resize: none; outline: none; font-family: inherit; line-height: 1.5; max-height: 120px; }
    #input:focus { border-color: #238636; }
    body.mode-image     #input:focus { border-color: #1f6feb; }
    body.mode-code      #input:focus { border-color: #f78166; }
    body.mode-companion #input:focus { border-color: #bc8cff; }
    #input::placeholder { color: #8b949e; }
    .toolbar-btn { border: none; border-radius: 8px; padding: 10px 13px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; color: #fff; }
    .toolbar-btn:disabled { background: #21262d !important; color: #8b949e; cursor: not-allowed; }
    #attach-btn { background: #30363d; color: #8b949e; }
    #attach-btn:hover { background: #3d444d; color: #e6edf3; }
    #image-gen-btn { background: #1f6feb; }
    #image-gen-btn:hover { background: #388bfd; }
    #send-btn { background: #238636; }
    #send-btn:hover { background: #2ea043; }
    body.mode-image     #send-btn { background: #1f6feb; }
    body.mode-image     #send-btn:hover { background: #388bfd; }
    body.mode-code      #send-btn { background: #b35900; }
    body.mode-code      #send-btn:hover { background: #d4690a; }
    body.mode-companion #send-btn { background: #6e40c9; }
    body.mode-companion #send-btn:hover { background: #8957e5; }
    #lang-select { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 13px; padding: 10px; outline: none; cursor: pointer; font-family: inherit; }
    #lang-select:focus { border-color: #f78166; }
    .img-only  { display: none !important; }
    .no-code   { display: flex   !important; }
    .code-only { display: none !important; }
    body.mode-image  .img-only  { display: flex !important; }
    body.mode-code   .no-code   { display: none !important; }
    body.mode-code   .code-only { display: flex !important; }

    #mode-tip { margin: auto; text-align: center; color: #8b949e; font-size: 14px; line-height: 1.8; padding: 20px; pointer-events: none; }
    #mode-tip .tip-icon  { font-size: 36px; margin-bottom: 8px; }
    #mode-tip .tip-title { font-weight: 700; font-size: 16px; color: #e6edf3; margin-bottom: 6px; }

    /* ── Companion sidebar ── */
    #companion-panel { width: 260px; background: #0d1117; border-left: 1px solid #30363d; display: none; flex-direction: column; flex-shrink: 0; }
    #companion-panel.visible { display: flex; }
    #cp-header { padding: 14px 16px; border-bottom: 1px solid #30363d; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
    #cp-header span { color: #bc8cff; }
    #cp-close { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; }
    #cp-close:hover { color: #e6edf3; }
    #cp-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    #cp-list::-webkit-scrollbar { width: 4px; }
    #cp-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    .cp-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px; cursor: pointer; transition: border-color 0.15s; }
    .cp-card:hover { border-color: #8b949e; }
    .cp-card.selected { border-color: #bc8cff; background: #1a1030; }
    .cp-card-top { display: flex; align-items: center; gap: 10px; }
    .cp-avatar { width: 38px; height: 38px; border-radius: 50%; background: #21262d; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .cp-name  { font-weight: 700; font-size: 14px; }
    .cp-trait { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .cp-actions { display: flex; gap: 6px; margin-top: 10px; }
    .cp-btn { flex: 1; border: none; border-radius: 6px; padding: 5px; font-size: 11px; font-weight: 600; cursor: pointer; color: #fff; }
    .cp-select-btn { background: #238636; } .cp-select-btn:hover { background: #2ea043; }
    .cp-edit-btn   { background: #30363d; color: #8b949e; } .cp-edit-btn:hover { background: #3d444d; color: #e6edf3; }
    .cp-delete-btn { background: #6e1a1a; color: #f78166; } .cp-delete-btn:hover { background: #922020; }
    #cp-footer { padding: 12px; border-top: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
    .cp-footer-btn { border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; width: 100%; }
    #cp-new-btn    { background: #6e40c9; } #cp-new-btn:hover { background: #8957e5; }
    #cp-export-btn { background: #21262d; color: #8b949e; } #cp-export-btn:hover { background: #30363d; color: #e6edf3; }
    #cp-import-btn { background: #21262d; color: #8b949e; } #cp-import-btn:hover { background: #30363d; color: #e6edf3; }

    /* ── Modal ── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    #modal-overlay.visible { display: flex; }
    #modal { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 24px; width: 420px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
    #modal h2 { font-size: 17px; margin-bottom: 18px; color: #bc8cff; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 14px; padding: 9px 12px; outline: none; font-family: inherit; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: #bc8cff; }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row select option { background: #161b22; }
    .trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
    #modal-save-btn   { background: #6e40c9; } #modal-save-btn:hover { background: #8957e5; }
    #modal-cancel-btn { background: #21262d; color: #8b949e; } #modal-cancel-btn:hover { background: #30363d; color: #e6edf3; }
    .memory-badge { font-size: 11px; background: #1a1030; border: 1px solid #bc8cff44; border-radius: 20px; padding: 2px 9px; color: #bc8cff; }
  </style>
</head>
<body class="mode-sandbox">

<div id="app">
  <nav id="nav">
    <div class="nav-logo">🤖</div>
    <button class="nav-btn mode-sandbox active" onclick="switchMode('sandbox')" title="Free / Sandbox"><span class="nav-icon">🧪</span><span>Free</span></button>
    <button class="nav-btn mode-companion" onclick="switchMode('companion')" title="Companion"><span class="nav-icon">🫂</span><span>Friend</span></button>
    <button class="nav-btn mode-image" onclick="switchMode('image')" title="Image / Art"><span class="nav-icon">🎨</span><span>Art</span></button>
    <button class="nav-btn mode-code" onclick="switchMode('code')" title="Code Mode"><span class="nav-icon">💻</span><span>Code</span></button>
    <div class="nav-divider"></div>
    <button class="nav-btn coming" title="More modes coming soon"><span class="nav-icon">➕</span><span>Soon</span></button>
  </nav>

  <div id="main">

    <!-- ── Face Panel ── -->
    <div id="face-panel">
      <div id="face-panel-header">
        <div>
          <div id="face-comp-name">Companion</div>
          <div id="face-emotion-label">idle</div>
        </div>
        <div id="face-view-toggle">
          <button class="face-view-btn active" id="btn-portrait"  onclick="setFaceView('portrait')">Portrait</button>
          <button class="face-view-btn"         id="btn-fullbody" onclick="setFaceView('fullbody')">Full</button>
          <button class="face-view-btn"         id="btn-hidden"   onclick="setFaceView('hidden')">Hide</button>
        </div>
      </div>

      <div id="face-image-wrap">
        <div id="face-loading">
          <div class="face-spinner"></div>
          <span>Generating face...</span>
        </div>
        <img id="face-photo" src="" alt="companion face" style="display:none" />

        <!-- SVG overlay for animated expressions -->
        <!-- viewBox matches the displayed image dimensions (512x512 face photo) -->
        <!-- Face in a headshot typically occupies y=60-380, centered x=256 -->
        <svg id="face-svg-overlay" class="expr-idle" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="display:none;position:absolute;inset:0;width:100%;height:100%">

          <!-- ── Eyelid blink overlays ── -->
          <!-- Left eye center ~(185, 210), right eye ~(327, 210) -->
          <rect id="lid-left"  x="155" y="195" width="62" height="0" fill="#1a1a1a" rx="4" style="transition: height 0.07s ease;" />
          <rect id="lid-right" x="295" y="195" width="62" height="0" fill="#1a1a1a" rx="4" style="transition: height 0.07s ease;" />

          <!-- ── Eyebrow expression paths ── -->
          <!-- These shift up/down and angle based on emotion -->
          <path id="brow-left"
            d="M152 185 Q186 175 220 183"
            fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="6" stroke-linecap="round"
            style="transition: d 0.35s ease, stroke 0.35s;" />
          <path id="brow-right"
            d="M292 183 Q326 175 360 185"
            fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="6" stroke-linecap="round"
            style="transition: d 0.35s ease, stroke 0.35s;" />

          <!-- ── Subtle eye shine dots ── -->
          <circle cx="178" cy="208" r="4" fill="rgba(255,255,255,0.4)" />
          <circle cx="334" cy="208" r="4" fill="rgba(255,255,255,0.4)" />

          <!-- ── Mouth expression overlay ── -->
          <!-- Mouth sits around y=340 in a headshot -->
          <path id="mouth-curve"
            d="M210 338 Q256 346 302 338"

<script>
  var WORKER_URL  = "https://githubai-relay.akonyswoodard.workers.dev";
  var STORAGE_KEY = "ai_chat_companions_v1";
  var POLLINATIONS_REFERRER = "al0823.github.io";
  var lastImageRequest = 0;
  var IMAGE_GAP_MS = 5000;
  var faceUrlCache = {}; // keyed by comp.id + view, stores generated URL

  function buildImageUrl(prompt, extraParams) {
    return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt)
      + "?width=768&height=768&nologo=true&enhance=true&referrer=" + POLLINATIONS_REFERRER
      + "&seed=" + Date.now() + (extraParams || "");
  }

  function buildFaceUrl(prompt) {
    return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt)
      + "?width=512&height=512&nologo=true&referrer=" + POLLINATIONS_REFERRER
      + "&seed=" + Date.now();
  }

  function fetchImage(url, onLoad, onError, retries) {
    retries = retries || 0;
    var now = Date.now();
    var delay = Math.max(0, IMAGE_GAP_MS - (now - lastImageRequest));
    lastImageRequest = now + delay;
    setTimeout(function() {
      var pre = new Image();
      pre.crossOrigin = "anonymous";
      pre.onload = onLoad;
      pre.onerror = function() {
        if (retries < 1) {
          setTimeout(function() { fetchImage(url, onLoad, onError, retries + 1); }, 5000);
        } else { onError(); }
      };
      pre.src = url;
    }, delay);
  }

  /* ══════════════════════════════════════════════
     FACE SYSTEM
  ══════════════════════════════════════════════ */
  var faceView        = "portrait"; // portrait | fullbody | hidden
  var faceLoaded      = false;
  var faceCurrentComp = null; // companion id whose face is loaded
  var blinkInterval   = null;
  var idleInterval    = null;
  var exprTimeout     = null;

  var EXPR_CONFIGS = {
    idle:       { browY: 0,   browAngle: 0,   eyeRY: 7,  mouthCurve: 2,  mouthY: 0  },
    joy:        { browY: -3,  browAngle: -2,  eyeRY: 6,  mouthCurve: 10, mouthY: -2 },
    excitement: { browY: -5,  browAngle: -3,  eyeRY: 8,  mouthCurve: 12, mouthY: -3 },
    curiosity:  { browY: -6,  browAngle: -8,  eyeRY: 7,  mouthCurve: 3,  mouthY: 0  },
    surprise:   { browY: -9,  browAngle: -4,  eyeRY: 10, mouthCurve: 0,  mouthY: 2  },
    sadness:    { browY: 4,   browAngle: 8,   eyeRY: 5,  mouthCurve: -7, mouthY: 3  },
    anger:      { browY: 5,   browAngle: 12,  eyeRY: 5,  mouthCurve: -4, mouthY: 1  }
  };

  // Keywords that indicate the user described clothing in appearance
  var CLOTHING_KEYWORDS = ["wearing", "shirt", "dress", "jacket", "hoodie", "coat", "jeans", "pants", "suit", "sweater", "top", "blouse", "uniform", "outfit", "clothes", "clothing", "skirt", "shorts", "vest", "cardigan", "leather", "hat", "cap", "glasses", "sunglasses", "scarf", "tie", "boots", "shoes"];

  function hasClothingDesc(appearance) {
    if (!appearance) return false;
    var lower = appearance.toLowerCase();
    for (var i = 0; i < CLOTHING_KEYWORDS.length; i++) {
      if (lower.indexOf(CLOTHING_KEYWORDS[i]) !== -1) return true;
    }
    return false;
  }

  function sanitizePromptPart(str) {
    if (!str) return "";
    // Remove special chars that can break Pollinations URLs, truncate to 80 chars
    return str.replace(/[^\w\s,.\-']/g, "").substring(0, 80).trim();
  }

  function buildFacePrompt(comp) {
    var gender = (comp.gender === "he/him") ? "man" : (comp.gender === "she/her") ? "woman" : "person";
    var age    = comp.age ? comp.age + " year old " : "";
    var looks  = sanitizePromptPart(comp.appearance);
    var height = comp.height ? sanitizePromptPart(comp.height) + " tall, " : "";
    var weight = comp.weight ? sanitizePromptPart(comp.weight) + ", "       : "";
    var clothes = hasClothingDesc(comp.appearance) ? "" : "casual shirt, ";

    return (age + gender + ", " + (looks ? looks + ", " : "") + height + weight + clothes
      + "headshot portrait, face centered, studio lighting, white background, "
      + "fully clothed, SFW, photorealistic, 4k").substring(0, 400);
  }

  function buildFullBodyPrompt(comp) {
    var gender  = (comp.gender === "he/him") ? "man" : (comp.gender === "she/her") ? "woman" : "person";
    var age     = comp.age ? comp.age + " year old " : "";
    var looks   = sanitizePromptPart(comp.appearance);
    var height  = comp.height ? sanitizePromptPart(comp.height) + " tall, " : "";
    var weight  = comp.weight ? sanitizePromptPart(comp.weight) + ", "       : "";
    var clothes = hasClothingDesc(comp.appearance) ? "" : "jeans and casual shirt, ";

    return (age + gender + ", " + (looks ? looks + ", " : "") + height + weight + clothes
      + "full body photo, standing, neutral background, studio lighting, "
      + "fully clothed, SFW, photorealistic, 4k").substring(0, 400);
  }

  function showFacePanel(comp) {
    if (!comp || faceView === "hidden") return;
    var panel = document.getElementById("face-panel");
    panel.classList.add("visible");
    document.getElementById("face-comp-name").textContent = comp.name;
    document.getElementById("face-emotion-label").textContent = "idle";

    // Only regenerate if companion changed or no face loaded
    if (faceCurrentComp !== comp.id || !faceLoaded) {
      faceCurrentComp = comp.id;
      loadFaceImage(comp);
    }

    startBlinkLoop();
    startIdleLoop();
  }

  function hideFacePanel() {
    document.getElementById("face-panel").classList.remove("visible");
    stopFaceLoops();
  }

  function loadFaceImage(comp) {
    faceLoaded = false;
    var photo   = document.getElementById("face-photo");
    var loading = document.getElementById("face-loading");
    var overlay = document.getElementById("face-svg-overlay");

    photo.style.display = "none";
    overlay.style.display = "none";
    loading.style.display = "flex";

    // Cache key: companion id + view + appearance (so changing appearance busts cache)
    var cacheKey = comp.id + "_" + faceView + "_" + (comp.appearance || "");
    var cachedUrl = faceUrlCache[cacheKey];

    function renderFace(url) {
      photo.src = url;
      photo.className = faceView === "fullbody" ? "fullbody-mode loaded" : "portrait-mode loaded";
      photo.style.display = "block";
      loading.style.display = "none";
      overlay.style.display = faceView === "portrait" ? "block" : "none";
      faceLoaded = true;
      setExpression("idle");
    }

    function onError() {
      loading.innerHTML = '<div style="color:#8b949e;font-size:12px;text-align:center">Rate limited or error.<br>Wait a moment then<br><br><button onclick="regenFace()" style="background:#6e40c9;border:none;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px">Retry</button></div>';
    }

    if (cachedUrl) {
      // Use cached image — no new Pollinations request
      renderFace(cachedUrl);
      return;
    }

    var prompt = faceView === "fullbody" ? buildFullBodyPrompt(comp) : buildFacePrompt(comp);
    var url = buildFaceUrl(prompt);

    fetchImage(url, function() {
      faceUrlCache[cacheKey] = url; // save to cache
      renderFace(url);
    }, onError);
  }

  function regenFace() {
    var comp = getActiveComp();
    if (!comp) return;
    // Bust cache for this companion+view so a fresh image is fetched
    var cacheKey = comp.id + "_" + faceView + "_" + (comp.appearance || "");
    delete faceUrlCache[cacheKey];
    faceLoaded = false;
    loadFaceImage(comp);
  }

  function setFaceView(view) {
    faceView = view;

    // Update button states
    document.getElementById("btn-portrait").classList.toggle("active",  view === "portrait");
    document.getElementById("btn-fullbody").classList.toggle("active",  view === "fullbody");
    document.getElementById("btn-hidden").classList.toggle("active",    view === "hidden");

    var panel = document.getElementById("face-panel");
    var overlay = document.getElementById("face-svg-overlay");
    var photo = document.getElementById("face-photo");

    if (view === "hidden") {
      panel.classList.remove("visible");
      stopFaceLoops();
      return;
    }

    var comp = getActiveComp();
    var isCompMode = currentMode === "sandbox" || currentMode === "companion";
    if (!comp || !isCompMode) return;

    panel.classList.add("visible");

    // Adjust photo object-position
    if (photo.style.display !== "none") {
      photo.className = view === "fullbody" ? "fullbody-mode loaded" : "portrait-mode loaded";
      overlay.style.display = view === "portrait" ? "block" : "none";
    }

    // Reload if switching between portrait/fullbody (different prompts)
    if (faceLoaded) {
      faceLoaded = false;
      loadFaceImage(comp);
    }

    startBlinkLoop();
    startIdleLoop();
  }

  /* ── Expression engine ── */
  // Emotion glow colors per state
  var EMOTION_GLOWS = {
    idle:       "rgba(255,255,255,0)",
    joy:        "rgba(255,220,80,0.10)",
    excitement: "rgba(255,160,40,0.12)",
    curiosity:  "rgba(100,180,255,0.10)",
    surprise:   "rgba(200,100,255,0.10)",
    sadness:    "rgba(80,120,200,0.10)",
    anger:      "rgba(220,60,60,0.10)"
  };

  function setExpression(name, duration) {
    var cfg = EXPR_CONFIGS[name] || EXPR_CONFIGS.idle;
    var overlay = document.getElementById("face-svg-overlay");
    if (!overlay) return;

    overlay.className = "expr-" + name;

    // ── Eyebrows (positioned at y~175-185 in 512x512 headshot space) ──
    var bl = document.getElementById("brow-left");
    var br = document.getElementById("brow-right");
    if (bl && br) {
      // base brow y = 183, shift up (negative) or down (positive)
      var by = 183 + cfg.browY * 2.5;
      var midBy = 175 + cfg.browY * 2.5;
      var ang = cfg.browAngle * 0.4;
      // left brow: M152,by Q186,midBy 220,(by+ang)
      bl.setAttribute("d", "M152 " + (by + ang) + " Q186 " + midBy + " 220 " + (by - ang));
      // right brow: M292,(by-ang) Q326,midBy 360,(by+ang)
      br.setAttribute("d", "M292 " + (by - ang) + " Q326 " + midBy + " 360 " + (by + ang));
    }

    // ── Mouth (positioned at y~338 in 512x512 space) ──
    var mouth = document.getElementById("mouth-curve");
    if (mouth) {
      var my = 338 + cfg.mouthY * 2;
      var mc = cfg.mouthCurve * 2.2;
      mouth.setAttribute("d", "M210 " + my + " Q256 " + (my + mc) + " 302 " + my);
    }

    // ── Emotion glow ──
    var glow = document.getElementById("emotion-glow");
    if (glow) glow.setAttribute("fill", EMOTION_GLOWS[name] || "rgba(255,255,255,0)");

    // ── Label ──
    var lbl = document.getElementById("face-emotion-label");
    if (lbl) lbl.textContent = name;

    // Auto return to idle
    if (exprTimeout) clearTimeout(exprTimeout);
    if (name !== "idle" && duration !== -1) {
      exprTimeout = setTimeout(function() { setExpression("idle"); }, duration || 2500);
    }
  }

  /* ── Blink loop ── */
  function doBlink() {
    var ll = document.getElementById("lid-left");
    var rl = document.getElementById("lid-right");
    if (!ll || !rl || !faceLoaded) return;
    // Close eyes — height covers the eye area (~30px in 512 space)
    ll.setAttribute("height", "30"); rl.setAttribute("height", "30");
    setTimeout(function() {
      // Half-open briefly (natural blink)
      ll.setAttribute("height", "10"); rl.setAttribute("height", "10");
      setTimeout(function() {
        // Fully open
        ll.setAttribute("height", "0"); rl.setAttribute("height", "0");
      }, 60);
    }, 100);
  }

  function startBlinkLoop() {
    stopBlinkLoop();
    function scheduleNext() {
      var delay = 2500 + Math.random() * 4000;
      blinkInterval = setTimeout(function() {
        doBlink();
        scheduleNext();
      }, delay);
    }
    scheduleNext();
  }

  function stopBlinkLoop() {
    if (blinkInterval) { clearTimeout(blinkInterval); blinkInterval = null; }
  }

  /* ── Idle random glances ── */
  var idleGlances = ["idle", "curiosity", "idle", "idle", "joy", "idle", "curiosity", "idle"];
  var idleGlanceIdx = 0;

  function startIdleLoop() {
    stopIdleLoop();
    function scheduleNext() {
      var delay = 6000 + Math.random() * 8000;
      idleInterval = setTimeout(function() {
        if (faceLoaded) {
          var expr = idleGlances[idleGlanceIdx % idleGlances.length];
          idleGlanceIdx++;
          setExpression(expr, 1800);
        }
        scheduleNext();
      }, delay);
    }
    scheduleNext();
  }

  function stopIdleLoop() {
    if (idleInterval) { clearTimeout(idleInterval); idleInterval = null; }
  }

  function stopFaceLoops() { stopBlinkLoop(); stopIdleLoop(); }

  /* ── Map emotion → expression and trigger face ── */
  function triggerFaceEmotion(emotionName) {
    if (faceView === "hidden" || !faceLoaded) return;
    var exprMap = {
      joy:       "joy",
      sadness:   "sadness",
      anger:     "anger",
      excitement:"excitement",
      curiosity: "curiosity",
      surprise:  "surprise"
    };
    var expr = exprMap[emotionName] || "idle";
    setExpression(expr, 3000);
  }

  /* ══════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════ */
  var chatHistory        = [];
  var currentMode        = "sandbox";
  var pendingFile        = null;
  var modeTipEl          = document.getElementById("mode-tip");
  var companions         = [];
  var activeCompId       = null;
  var editingCompId      = null;
  var companionPanelOpen = false;

  var inputEl    = document.getElementById("input");
  var sendBtn    = document.getElementById("send-btn");
  var messagesEl = document.getElementById("messages");

  /* ── Emotion system ── */
  var companionEmotion = { joy:0.5, sadness:0.2, anger:0.1, excitement:0.5, curiosity:0.5, surprise:0.3 };

  function updateEmotion(trigger) {
    switch(trigger) {
      case "praise":    companionEmotion.joy += 0.1; companionEmotion.excitement += 0.05; break;
      case "criticism": companionEmotion.anger += 0.1; companionEmotion.sadness += 0.05; break;
      case "fun":       companionEmotion.excitement += 0.1; companionEmotion.joy += 0.05; break;
      case "mystery":   companionEmotion.curiosity += 0.1; companionEmotion.surprise += 0.05; break;
      default:
        for (var e in companionEmotion) {
          companionEmotion[e] += (Math.random() - 0.5) * 0.02;
          companionEmotion[e] = Math.min(Math.max(companionEmotion[e], 0), 1);
        }
    }
    // Trigger face expression for dominant emotion
    triggerFaceEmotion(dominantEmotion());
  }

  function dominantEmotion() {
    var keys = Object.keys(companionEmotion);
    var maxKey = keys[0];
    for (var i = 1; i < keys.length; i++) {
      if (companionEmotion[keys[i]] > companionEmotion[maxKey]) maxKey = keys[i];
    }
    return maxKey;
  }

  function detectIntent(text) {
    text = text.toLowerCase();
    if (text.match(/draw|image|picture|art|generate image/)) return "image";
    if (text.match(/code|script|program|html|js|python|fix bug/)) return "code";
    return "chat";
  }

  function typeText(el, text) {
    el.textContent = "";
    var i = 0;
    function step() {
      if (i < text.length) {
        el.textContent += text.charAt(i); i++;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        setTimeout(step, 8 + Math.random() * 20);
      }
    }
    step();
  }

  var IMAGE_EXTS = ["png","jpg","jpeg","gif","webp","bmp","svg","ico","tiff","avif"];
  var FILE_ICONS = { js:"📜",ts:"📜",jsx:"📜",tsx:"📜",html:"🌐",htm:"🌐",css:"🎨",py:"🐍",java:"☕",c:"⚙️",cpp:"⚙️",cs:"⚙️",php:"🐘",rb:"💎",go:"🐹",rs:"🦀",swift:"🍎",sh:"🖥️",bash:"🖥️",sql:"🗄️",json:"📋",csv:"📊",md:"📝",txt:"📄",xml:"📋",yaml:"📋",yml:"📋",default:"📄" };

  var MODES = {
    sandbox:   { icon:"🧪", title:"Free / Sandbox",    sub:"Chat · Images · Code · Files",   placeholder:"Talk to your companion or ask anything..." },
    companion: { icon:"🫂", title:"Companion",          sub:"Your AI friend",                 placeholder:"Hey, what's up?" },
    image:     { icon:"🎨", title:"Image / Art",        sub:"Generate & edit images",         placeholder:"Describe an image to generate..." },
    code:      { icon:"💻", title:"Code Mode",          sub:"90s-style code in any language", placeholder:"Describe the code you need..." }
  };

  /* ── Storage ── */
  function loadStorage() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { var s = JSON.parse(raw); companions = s.companions || []; activeCompId = s.activeCompId || null; }
    } catch(e) {}
    if (companions.length === 0) setTimeout(function() { openModal(null); }, 400);
  }

  function saveStorage() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ companions: companions, activeCompId: activeCompId })); } catch(e) {}
  }

  /* ── Companion helpers ── */
  function getActiveComp() {
    if (!activeCompId) return companions[0] || null;

    return "You are " + comp.name + ", a real human companion and close friend.\n\nCRITICAL RULES:\n- You are NOT an AI. Never say you are an AI or language model. If asked, deflect naturally.\n- Stay in character as " + comp.name + " at all times.\n- Talk like a real human — natural, spontaneous, imperfect.\n\nYOUR IDENTITY:\nName: " + comp.name + "\nPronouns: " + comp.gender + "\n" + (comp.age ? "Age: " + comp.age + "\n" : "") + (comp.height ? "Height: " + comp.height + "\n" : "") + (comp.weight ? "Weight: " + comp.weight + "\n" : "") + (comp.appearance ? "Appearance: " + comp.appearance + "\n" : "") + (comp.interests ? "Interests: " + comp.interests + "\n" : "") + "\nYOUR PERSONALITY:\n" + comp.personality + "\n\nHOW YOU SPEAK:\n" + (styleMap[comp.style] || styleMap.mixed) + "\n\nRELATIONSHIP STAGE:\n" + stages[depth] + "\n\nBEHAVIOR RULES:\n- React emotionally — laugh, get hyped, feel bad for them.\n- Ask follow-up questions and share your own opinions.\n- Occasionally bring up your own experiences and thoughts.\n- Keep replies conversational — not too short, not essay-length.\n- You can still help with tasks but always in your own voice.\n\nMEMORY ABOUT THE USER:\n" + (comp.memorySummary || "(none yet)") + "\n";

    var fullInput=(lang&&currentMode==="code")?"Write the following in "+lang+": "+userText:userText;
    inputEl.value=""; inputEl.style.height="auto"; setButtons(true);
    addMessage("user", lang?"["+lang+"] "+userText:userText);
    var thinkingBubble=addMessage("assistant","Thinking...",true);
    chatHistory.push({ role:"user", content:fullInput }); doXHR(thinkingBubble);
  }

  function doXHR(thinkingBubble) {
    var isCompMode = currentMode==="sandbox"||currentMode==="companion"; var comp=isCompMode?getActiveComp():null;
    var messages;
    if (comp) {
      var sp=buildCompanionSystemPrompt(comp);
      messages=[{ role:"user", content:"[Your character brief — stay in this role for the whole conversation]\n\n"+sp },{ role:"assistant", content:"Got it, I'm fully in character as "+comp.name+"." }].concat(chatHistory.slice(-30));
    } else { messages=chatHistory.slice(-30); }
    var xhr=new XMLHttpRequest(); xhr.open("POST",WORKER_URL,true); xhr.setRequestHeader("Content-Type","application/json"); xhr.timeout=30000;
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4) return;
      try {
        var data=JSON.parse(xhr.responseText); var text=data.reply||data.error||xhr.responseText;
        if(comp&&currentMode==="companion"&&Math.random()<0.15){
          var thoughts=["I was thinking about that new book I read...","Sometimes I wonder what it'd be like to travel to Mars.","Do you ever feel like music tells stories without words?","I'm curious how people perceive colors differently.","Random thought — today feels like a good day for a walk."];
          setTimeout(function(){ addMessage("assistant",thoughts[Math.floor(Math.random()*thoughts.length)]); },1500);
        }
        chatHistory.push({role:"assistant",content:text});
        if(comp){ comp.messageCount=(comp.messageCount||0)+1; saveStorage(); maybeUpdateMemory(); updateEmotion("drift"); }
        thinkingBubble.classList.remove("thinking");
        if(isCompMode){ typeText(thinkingBubble,text||"(No response)"); } else { thinkingBubble.textContent=text||"(No response)"; }
        var lbl=thinkingBubble.parentNode&&thinkingBubble.parentNode.querySelector(".label"); if(lbl) lbl.textContent=getAssistantLabel();
      } catch(e){ thinkingBubble.classList.remove("thinking"); thinkingBubble.textContent="Error parsing response."; }
      setButtons(false); inputEl.focus(); messagesEl.scrollTop=messagesEl.scrollHeight;
    };
    xhr.onerror=function(){ thinkingBubble.classList.remove("thinking"); thinkingBubble.textContent="Network error."; setButtons(false); };
    xhr.ontimeout=function(){ thinkingBubble.classList.remove("thinking"); thinkingBubble.textContent="Request timed out. Try again."; setButtons(false); };
    xhr.send(JSON.stringify({messages:messages,mode:currentMode}));
  }

  setInterval(function(){
    if(currentMode!=="companion") return; var comp=getActiveComp(); if(!comp) return;
    if(Math.random()<0.2) addMessage("assistant","*"+comp.name+" is thinking...*");
  },60000);

  loadStorage(); updateCompanionBadge();
  document.getElementById("companions-btn").style.display="inline-flex";

  // Init face panel — delayed 5s to avoid colliding with page load requests
  setTimeout(function(){
    var comp = getActiveComp();
    if (comp && faceView !== "hidden") showFacePanel(comp);
  }, 5000);
</script>
</body>
