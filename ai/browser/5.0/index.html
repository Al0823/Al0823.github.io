<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A.t.A. Projects - FreeGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
    }

    #chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #30363d;
      font-weight: 600;
      font-size: 15px;
      color: #e6edf3;
      background: #161b22;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      gap: 4px;
    }

    .message.user { align-self: flex-end; align-items: flex-start; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .message .label {
      font-size: 11px;
      color: #8b949e;
      padding: 0 4px;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #238636;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }

    .message.assistant .bubble.thinking {
      color: #8b949e;
      font-style: italic;
    }

    .message .bubble.image-bubble {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble.image-bubble {
      background: #238636;
      border: none;
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 12px;
    }

    .message .bubble img {
      max-width: 100%;
      border-radius: 8px;
      display: block;
    }

    .image-edit-area {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .image-edit-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      font-family: inherit;
    }

    .image-edit-input:focus { border-color: #1f6feb; }
    .image-edit-input::placeholder { color: #8b949e; }

    .image-edit-btn {
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .image-edit-btn:hover { background: #388bfd; }
    .image-edit-btn:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }

    #input-area {
      padding: 16px;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 8px;
      background: #161b22;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      max-height: 120px;
    }

    #input:focus { border-color: #238636; }
    #input::placeholder { color: #8b949e; }

    .toolbar-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      color: #ffffff;
    }

    #send-btn { background: #238636; }
    #send-btn:hover { background: #2ea043; }

    #image-btn { background: #1f6feb; }
    #image-btn:hover { background: #388bfd; }

    #upload-btn { background: #6e40c9; }
    #upload-btn:hover { background: #8957e5; }

    .toolbar-btn:disabled { background: #21262d !important; color: #8b949e; cursor: not-allowed; }

    #upload-preview-wrap {
      display: none;
      padding: 8px 16px 0;
      background: #161b22;
      align-items: center;
      gap: 10px;
    }

    #upload-preview-wrap.visible { display: flex; }

    #upload-preview {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #30363d;
    }

    #upload-preview-label {
      font-size: 12px;
      color: #8b949e;
      flex: 1;
    }

    #upload-clear-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }

    #upload-clear-btn:hover { color: #e6edf3; }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="chat-header">A.t.A. Projects - AI Chatbot</div>
  <div id="messages"></div>

  <div id="upload-preview-wrap">
    <img id="upload-preview" src="" alt="preview" />
    <span id="upload-preview-label">Image ready — type an edit prompt and click ✏️ Edit Image</span>
    <button id="upload-clear-btn" title="Remove image" onclick="clearUpload()">✕</button>
  </div>

  <div id="input-area">
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send)"></textarea>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleUpload(event)" />
    <button id="upload-btn" class="toolbar-btn" onclick="document.getElementById('file-input').click()">📁 Upload</button>
    <button id="image-btn" class="toolbar-btn" onclick="generateImage()">🎨 Image</button>
    <button id="send-btn" class="toolbar-btn" onclick="send()">Send</button>
  </div>
</div>

<script>
  const WORKER_URL = "https://githubai-relay.akonyswoodard.workers.dev";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const imageBtn = document.getElementById("image-btn");
  const uploadBtn = document.getElementById("upload-btn");
  const uploadPreviewWrap = document.getElementById("upload-preview-wrap");
  const uploadPreviewImg = document.getElementById("upload-preview");

  const history = [];
  let pendingUploadDataUrl = null;

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function handleUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      pendingUploadDataUrl = e.target.result;
      uploadPreviewImg.src = pendingUploadDataUrl;
      uploadPreviewWrap.classList.add("visible");
      inputEl.placeholder = 'Describe your edit, e.g. "add a sunset sky"';
      inputEl.focus();
    };
    reader.readAsDataURL(file);
    event.target.value = "";
  }

  function clearUpload() {
    pendingUploadDataUrl = null;
    uploadPreviewImg.src = "";
    uploadPreviewWrap.classList.remove("visible");
    inputEl.placeholder = "Type a message... (Enter to send)";
  }

  function addMessage(role, text, isThinking = false) {
    const wrapper = document.createElement("div");
    wrapper.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isThinking ? " thinking" : "");
    bubble.textContent = text;

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addUploadedImageMessage(dataUrl, caption) {
    const wrapper = document.createElement("div");
    wrapper.className = "message user";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "You";

    const bubble = document.createElement("div");
    bubble.className = "bubble image-bubble";

    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = caption || "uploaded image";

    if (caption) {
      const cap = document.createElement("div");
      cap.style.cssText = "font-size:13px;color:#fff;padding:0 4px";
      cap.textContent = caption;
      bubble.appendChild(cap);
    }

    bubble.appendChild(img);
    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addImageBubble() {
    const wrapper = document.createElement("div");
    wrapper.className = "message assistant";

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble thinking";
    bubble.textContent = "Generating image...";

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function renderImageIntoBubble(bubble, imageUrl, currentPrompt) {
    bubble.classList.remove("thinking");
    bubble.classList.add("image-bubble");
    bubble.textContent = "";

    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = currentPrompt;
    bubble.appendChild(img);

    attachEditControls(bubble, img, currentPrompt);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function attachEditControls(bubble, imgEl, currentPrompt) {
    const existing = bubble.querySelector(".image-edit-area");
    if (existing) existing.remove();

    const editArea = document.createElement("div");
    editArea.className = "image-edit-area";

    const editInput = document.createElement("input");
    editInput.type = "text";
    editInput.className = "image-edit-input";
    editInput.placeholder = 'e.g. "make it night time" or "add a dragon"';

    const editBtn = document.createElement("button");
    editBtn.className = "image-edit-btn";
    editBtn.textContent = "✏️ Edit";

    editBtn.onclick = async () => {
      const editPrompt = editInput.value.trim();
      if (!editPrompt) return;

      const newPrompt = `${currentPrompt}, ${editPrompt}`;
      editBtn.disabled = true;
      editBtn.textContent = "Generating...";
      editInput.disabled = true;

      try {
        const encodedPrompt = encodeURIComponent(newPrompt);
        const newUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Date.now()}`;

        await new Promise((resolve, reject) => {
          const preload = new Image();
          preload.onload = resolve;
          preload.onerror = reject;
          preload.src = newUrl;
        });

        imgEl.src = newUrl;
        imgEl.alt = newPrompt;
        editInput.value = "";
        editInput.placeholder = 'Edit again, e.g. "add snow"';

        attachEditControls(bubble, imgEl, newPrompt);

      } catch {
        editBtn.textContent = "Failed — try again";
        editBtn.disabled = false;
        editInput.disabled = false;
        return;
      }

      editBtn.disabled = false;
      editBtn.textContent = "✏️ Edit";
      editInput.disabled = false;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    editArea.appendChild(editInput);
    editArea.appendChild(editBtn);
    bubble.appendChild(editArea);
  }

  function setButtons(disabled) {
    sendBtn.disabled = disabled;
    imageBtn.disabled = disabled;
    uploadBtn.disabled = disabled;
  }

  async function send() {
    if (pendingUploadDataUrl) {
      await editUploadedImage();
      return;
    }

    const input = inputEl.value.trim();
    if (!input) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addMessage("user", input);
    const thinkingBubble = addMessage("assistant", "Thinking...", true);

    try {
      history.push({ role: "user", content: input });

      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      const text = data.reply || data.error || JSON.stringify(data);

      history.push({ role: "assistant", content: text });
      thinkingBubble.classList.remove("thinking");
      thinkingBubble.textContent = text || "(No response)";

    } catch (err) {
      thinkingBubble.classList.remove("thinking");
      thinkingBubble.textContent = "Error: " + err.message;
    }

    setButtons(false);
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function generateImage() {
    const input = inputEl.value.trim();
    if (!input) { alert("Type an image description first."); return; }

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addMessage("user", "🎨 " + input);
    const bubble = addImageBubble();

    try {
      const encodedPrompt = encodeURIComponent(input);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Date.now()}`;

      await new Promise((resolve, reject) => {
        const preload = new Image();
        preload.onload = resolve;
        preload.onerror = reject;
        preload.src = imageUrl;
      });

      renderImageIntoBubble(bubble, imageUrl, input);

    } catch {
      bubble.classList.remove("thinking");
      bubble.textContent = "Failed to generate image. Try a different prompt.";
    }

    setButtons(false);
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function editUploadedImage() {
    const prompt = inputEl.value.trim();
    if (!prompt) { alert("Describe how you want to edit the image."); return; }

    const dataUrl = pendingUploadDataUrl;
    clearUpload();

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addUploadedImageMessage(dataUrl, "✏️ " + prompt);
    const bubble = addImageBubble();

    try {
      const encodedPrompt = encodeURIComponent(prompt);
      const encodedImage = encodeURIComponent(dataUrl);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Date.now()}&image_url=${encodedImage}`;

      await new Promise((resolve, reject) => {
        const preload = new Image();
        preload.onload = resolve;
        preload.onerror = reject;
        preload.src = imageUrl;
      });

      renderImageIntoBubble(bubble, imageUrl, prompt);

    } catch {
      bubble.classList.remove("thinking");
      bubble.textContent = "Failed to edit image. Try a different prompt.";
    }

    setButtons(false);
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>
</body>
</html>
