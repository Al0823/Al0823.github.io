<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>A.t.A. Projects - FreeGPT</title>
  <style>
    body {
      margin: 0;
      font-family: "Arial", sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      text-align: center;
    }
    
    .chat-container {
      width: 720px;
      margin: 0 auto;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
    }
    
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #30363d;
      font-weight: 600;
      font-size: 15px;
      color: #e6edf3;
      background-color: #161b22;
    }
    
    .messages {
      padding: 20px;
      height: 90%;
      overflow-y: auto;
      border-bottom: 1px solid #30363d;
    }
    
    .message {
      margin-bottom: 16px;
    }
    
    .message.user {
      text-align: right;
    }
    
    .message.assistant {
      text-align: left;
    }
    
    .message .label {
      font-size: 11px;
      color: #8b949e;
      padding: 0 4px;
    }
    
    .message .bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .message.user .bubble {
      background-color: #238636;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    
    .message.assistant .bubble {
      background-color: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }
    
    .message.assistant .bubble.thinking {
      color: #8b949e;
      font-style: italic;
    }
    
    .image-edit-area {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    
    .image-edit-input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      font-family: inherit;
    }
    
    .image-edit-input:focus { border-color: #1f6feb; }
    .image-edit-input::placeholder { color: #8b949e; }
    
    .image-edit-btn {
      background-color: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    
    .image-edit-btn:hover { background-color: #388bfd; }
    .image-edit-btn:disabled { background-color: #21262d; color: #8b949e; cursor: not-allowed; }
    
    .input-area {
      padding: 16px;
      border-top: 1px solid #30363d;
      display: flex;
      background-color: #161b22;
    }
    
    #input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      max-height: 120px;
    }
    
    #input:focus { border-color: #238636; }
    #input::placeholder { color: #8b949e; }
    
    .toolbar-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      color: #ffffff;
    }
    
    #send-btn { background-color: #238636; }
    #send-btn:hover { background-color: #2ea043; }
    
    #image-btn { background-color: #1f6feb; }
    #image-btn:hover { background-color: #388bfd; }
    
    #upload-btn { background-color: #6e40c9; }
    #upload-btn:hover { background-color: #8957e5; }
    
    .toolbar-btn:disabled { background-color: #21262d !important; color: #8b949e; cursor: not-allowed; }
    
    #upload-preview-wrap {
      display: none;
      padding: 8px 16px 0;
      background-color: #161b22;
      align-items: center;
      gap: 10px;
    }
    
    #upload-preview-wrap.visible { display: flex; }
    
    #upload-preview {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #30363d;
    }
    
    #upload-preview-label {
      font-size: 12px;
      color: #8b949e;
      flex: 1;
    }
    
    #upload-clear-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    
    #upload-clear-btn:hover { color: #e6edf3; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">A.t.A. Projects - AI Chatbot</div>
  <div class="messages" id="messages"></div>

  <div id="upload-preview-wrap">
    <img id="upload-preview" src="" alt="preview" />
    <span id="upload-preview-label">Image ready — type an edit prompt and click ✏️ Edit Image</span>
    <button id="upload-clear-btn" title="Remove image" onclick="clearUpload()">✕</button>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send)"></textarea>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleUpload(event)" />
    <button id="upload-btn" class="toolbar-btn" onclick="document.getElementById('file-input').click()">📁 Upload</button>
    <button id="image-btn" class="toolbar-btn" onclick="generateImage()">🎨 Image</button>
    <button id="send-btn" class="toolbar-btn" onclick="send()">Send</button>
  </div>
</div>

<script>
  var WORKER_URL = "https://githubai-relay.akonyswoodard.workers.dev";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send-btn");
  var imageBtn = document.getElementById("image-btn");
  var uploadBtn = document.getElementById("upload-btn");
  var uploadPreviewWrap = document.getElementById("upload-preview-wrap");
  var uploadPreviewImg = document.getElementById("upload-preview");

  var history = [];
  var pendingUploadDataUrl = null;

  inputEl.oninput = function() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  inputEl.onkeydown = function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  }

  function handleUpload(event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
      pendingUploadDataUrl = e.target.result;
      uploadPreviewImg.src = pendingUploadDataUrl;
      uploadPreviewWrap.style.display = "block";
      inputEl.placeholder = 'Describe your edit, e.g. "add a sunset sky"';
      inputEl.focus();
    }
    reader.readAsDataURL(file);
    event.target.value = "";
  }

  function clearUpload() {
    pendingUploadDataUrl = null;
    uploadPreviewImg.src = "";
    uploadPreviewWrap.style.display = "none";
    inputEl.placeholder = "Type a message... (Enter to send)";
  }

  function addMessage(role, text, isThinking) {
    var wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "AI";

    var bubble = document.createElement("div");
    bubble.className = "bubble" + (isThinking ? " thinking" : "");
    bubble.textContent = text;

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addUploadedImageMessage(dataUrl, caption) {
    var wrapper = document.createElement("div");
    wrapper.className = "message user";

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = "You";

    var bubble = document.createElement("div");
    bubble.className = "bubble image-bubble";

    var img = document.createElement("img");
    img.src = dataUrl;
    img.alt = caption || "uploaded image";

    if (caption) {
      var cap = document.createElement("div");
      cap.style.cssText = "font-size:13px;color:#fff;padding:0 4px";
      cap.textContent = caption;
      bubble.appendChild(cap);
    }

    bubble.appendChild(img);
    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addImageBubble() {
    var wrapper = document.createElement("div");
    wrapper.className = "message assistant";

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = "AI";

    var bubble = document.createElement("div");
    bubble.className = "bubble thinking";
    bubble.textContent = "Generating image...";

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function renderImageIntoBubble(bubble, imageUrl, currentPrompt) {
    bubble.className = "bubble image-bubble";
    bubble.textContent = "";

    var img = document.createElement("img");
    img.src = imageUrl;
    img.alt = currentPrompt;
    bubble.appendChild(img);

    attachEditControls(bubble, img, currentPrompt);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function attachEditControls(bubble, imgEl, currentPrompt) {
    var existing = bubble.querySelector(".image-edit-area");
    if (existing) existing.remove();

    var editArea = document.createElement("div");
    editArea.className = "image-edit-area";

    var editInput = document.createElement("input");
    editInput.type = "text";
    editInput.className = "image-edit-input";
    editInput.placeholder = 'e.g. "make it night time" or "add a dragon"';

    var editBtn = document.createElement("button");
    editBtn.className = "image-edit-btn";
    editBtn.textContent = "✏️ Edit";

    editBtn.onclick = function() {
      var editPrompt = editInput.value.trim();
      if (!editPrompt) return;

      var newPrompt = currentPrompt + ", " + editPrompt;
      editBtn.disabled = true;
      editBtn.textContent = "Generating...";
      editInput.disabled = true;

      var encodedPrompt = encodeURIComponent(newPrompt);
      var newUrl = "https://image.pollinations.ai/prompt/" + encodedPrompt + "?width=512&height=512&nologo=true&seed=" + new Date().getTime();

      var preload = new Image();
      preload.onload = function() {
        imgEl.src = newUrl;
        imgEl.alt = newPrompt;
        editInput.value = "";
        editInput.placeholder = 'Edit again, e.g. "add snow"';

        attachEditControls(bubble, imgEl, newPrompt);
      }
      preload.onerror = function() {
        editBtn.textContent = "Failed — try again";
        editBtn.disabled = false;
        editInput.disabled = false;
        return;
      }
      preload.src = newUrl;
    }

    editArea.appendChild(editInput);
    editArea.appendChild(editBtn);
    bubble.appendChild(editArea);
  }

  function setButtons(disabled) {
    sendBtn.disabled = disabled;
    imageBtn.disabled = disabled;
    uploadBtn.disabled = disabled;
  }

  function send() {
    if (pendingUploadDataUrl) {
      editUploadedImage();
      return;
    }

    var input = inputEl.value.trim();
    if (!input) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addMessage("user", input);
    var thinkingBubble = addMessage("assistant", "Thinking...", true);

    history.push({ role: "user", content: input });

    var xhr = new XMLHttpRequest();
    xhr.open("POST", WORKER_URL, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        var data = JSON.parse(xhr.responseText);
        var text = data.reply || data.error || JSON.stringify(data);

        history.push({ role: "assistant", content: text });
        thinkingBubble.className = "bubble";
        thinkingBubble.textContent = text || "(No response)";
        setButtons(false);
        inputEl.focus();
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
    }
    xhr.send(JSON.stringify({ messages: history }));
  }

  function generateImage() {
    var input = inputEl.value.trim();
    if (!input) { alert("Type an image description first."); return; }

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addMessage("user", "🎨 " + input);
    var bubble = addImageBubble();

    var encodedPrompt = encodeURIComponent(input);
    var imageUrl = "https://image.pollinations.ai/prompt/" + encodedPrompt + "?width=512&height=512&nologo=true&seed=" + new Date().getTime();

    var preload = new Image();
    preload.onload = function() {
      renderImageIntoBubble(bubble, imageUrl, input);
    }
    preload.onerror = function() {
      bubble.className = "bubble";
      bubble.textContent = "Failed to generate image. Try a different prompt.";
    }
    preload.src = imageUrl;

    setButtons(false);
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function editUploadedImage() {
    var prompt = inputEl.value.trim();
    if (!prompt) { alert("Describe how you want to edit the image."); return; }

    var dataUrl = pendingUploadDataUrl;
    clearUpload();

    inputEl.value = "";
    inputEl.style.height = "auto";
    setButtons(true);

    addUploadedImageMessage(dataUrl, "✏️ " + prompt);
    var bubble = addImageBubble();

    var encodedPrompt = encodeURIComponent(prompt);
    var encodedImage = encodeURIComponent(dataUrl);
    var imageUrl = "https://image.pollinations.ai/prompt/" + encodedPrompt + "?width=512&height=512&nologo=true&seed=" + new Date().getTime() + "&image_url=" + encodedImage;

    var preload = new Image();
    preload.onload = function() {
      renderImageIntoBubble(bubble, imageUrl, prompt);
    }
    preload.onerror = function() {
      bubble.className = "bubble";
      bubble.textContent = "Failed to edit image. Try a different prompt.";
    }
    preload.src = imageUrl;

    setButtons(false);
    inputEl.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>
</body>
</html>
