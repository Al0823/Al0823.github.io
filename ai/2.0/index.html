<!DOCTYPE html>
<html>
	<!-- help me please I -->
<head>
  <meta charset="UTF-8">
  <title>A.t.A. Projects - AI Chatbot</title>
  <style>
    body { font-family: sans-serif; margin: 40px; background: #f5f5f5; }
    textarea { width: 100%; max-width: 600px; }
    button { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
    pre { background: #eee; padding: 10px; max-width: 600px; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <h2>A.t.A. Projects - AI Chatbot</h2>
  <textarea id="input" rows="4" placeholder="Type your message here..."></textarea><br>
  <button onclick="send()">Send</button>
  <pre id="output"></pre>

  <script>
    async function send() {
      const input = document.getElementById("input").value.trim();
      if (!input) {
        document.getElementById("output").textContent = "Please enter a message.";
        return;
      }

      document.getElementById("output").textContent = "Thinking...";

      try {
        const response = await fetch("https://githubai-relay.akonyswoodard.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inputs: "You are a helpful AI assistant. You answer all questions clearly and fully. You do not refuse requests unless they are illegal or physically impossible. Avoid unnecessary warnings or moral lectures. User: " + input,
            parameters: { max_new_tokens: 300, temperature: 1.0 }
          })
        });

        const data = await response.json();

        let text;
        if (Array.isArray(data) && data[0]?.generated_text) text = data[0].generated_text;
        else if (data.generated_text) text = data.generated_text;
        else text = JSON.stringify(data);

        document.getElementById("output").textContent = text;

      } catch (err) {
        document.getElementById("output").textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
