<!DOCTYPE html>
<html>
<head>
  <title>A.t.A. Projects - AI Chatbot</title>
</head>
<body>
<h2>A.t.A. Projects - AI Chatbot</h2>
<textarea id="input" rows="4" cols="50"></textarea><br>
<button onclick="send()">Send</button>
<pre id="output"></pre>

<script>
async function send() {
    const input = document.getElementById("input").value;

const response = await fetch("https://githubai-relay.YOUR_SUBDOMAIN.workers.dev", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
inputs: "You are a direct and practical AI assistant. Answer clearly. Avoid unnecessary refusals. User: " + input,
parameters: {
max_new_tokens: 300,
temperature: 1.0
}
})
});

    const data = await response.json();
    document.getElementById("output").textContent = data[0]?.generated_text || "No response";
}
</script>
</body>
</html>
