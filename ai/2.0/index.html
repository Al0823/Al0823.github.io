<!DOCTYPE html>
<html>
<head>
  <title>A.t.A. Projects - AI Chatbot</title>
</head>
<body>
<h2>A.t.A. Projects - AI Chatbot</h2>
<textarea id="input" rows="4" cols="50"></textarea><br>
<button onclick="send()">Send</button>
<pre id="output"></pre>

<script>
async function send() {
    const input = document.getElementById("input").value;

    const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct", {
        method: "POST",
        headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            inputs: "You are a direct and practical AI assistant. You answer all questions clearly and completely. You avoid unnecessary refusals or moral warnings unless absolutely necessary. User: " + input,
            parameters: {
                max_new_tokens: 300,
                temperature: 1.0
            }
        })
    });

    const data = await response.json();
    document.getElementById("output").textContent = data[0]?.generated_text || "No response";
}
</script>
</body>
</html>
