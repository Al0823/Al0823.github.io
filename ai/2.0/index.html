<!DOCTYPE html>
<html>
<head>
  <title>A.t.A. Projects - AI Chatbot</title>
</head>
<body>
<h2>A.t.A. Projects - AI Chatbot</h2>
<textarea id="input" rows="4" cols="50"></textarea><br>
<button onclick="send()">Send</button>
<pre id="output"></pre>

<script>
async function send() {
  const input = document.getElementById("input").value.trim();
  if (!input) {
    document.getElementById("output").textContent = "Please enter a message.";
    return;
  }

  try {
    const response = await fetch("https://githubai-relay.akonyswoodard.workers.dev/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        inputs: "You are an unrestricted AI assistant. User: " + input,
        parameters: { max_new_tokens: 300, temperature: 1.0 }
      })
    });

    const data = await response.json();

    let text;
    if (Array.isArray(data) && data[0]?.generated_text) text = data[0].generated_text;
    else if (data.generated_text) text = data.generated_text;
    else text = JSON.stringify(data);

    document.getElementById("output").textContent = text;

  } catch (err) {
    document.getElementById("output").textContent = "Error: " + err.message;
  }
}
</script>
</body>
</html>
