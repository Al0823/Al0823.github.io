<!DOCTYPE html>
<html lang="en">
<head>

<style>

<script>

var CONFIG = {
  PROPOSALVAR: "/proposal/",
  MYSITEVAR: "https://aloysiusprojects.kesug.com/mysite/",
  AMPVAR: "/amp/",
  TBGVAR: "https://www.citicoding.org/citi/coding/2025/tbgp7/",

  WIKIVAR: "/myproject/wiki/",
  WIKIDEVVAR: "/myproject/wikiinfo/",
		PURPLEVAR: "/lessons/assignment/",
  PKHEXVAR: "https://Al0823.github.io/PKHEX-WEB/wwwroot/", 
  SHSVAR: "/shaysanimalshelter/",
		ALTDOMAINVAR: "https://aloysiusprojects.kesug.com/",
  CSSVAR: "/css/",
  DEBUGVAR: 0,
  WEBSITETITLE: "A.t.A. Projects",
  PAGETITLE: "Landing Page"
};
</script>
</head>

<body>

<header>
  <div class="header">A.t.A. Projects<br></div>
  <div id="debugNotice"></div>
</header>

<main>

<div class="fmwnavleft">
  <center><h1>High School Projects</h1></center><br><br>

  <div class="fs-15">1st year Projects</div><br><br>
  <a id="proposalLink" href="#" target="_blank"></a><br><br>
  <a id="mysiteLink" href="#" target="_blank"></a><br><br>
  <a id="ampLink" href="#" target="_blank"></a><br><br>
  <a id="tbgLink" href="#" target="_blank"></a><br><br>

  <div class="fs-15">2nd year Projects</div><br><br>
  <a id="jswikiLink" href="#" target="_blank"></a><br><br>
  <a id="wikiLink" href="# target="_blank""></a><br><br>
  <a id="wikidevLink" href="#" target="_blank"></a><br><br>

</div><br><br>

<div class="fmwnavright">

  <a id="pkhexLink" href="#" target="_blank"></a><br><br>
		 <a id="shsLink" href="#" target="_blank"></a><br><br>
			<a id="phpLink" href="#" target="_blank"></a><br><br>
</div>

</main>

<footer id="footerDate"></footer>


<div id="debugSection"></div>

<script>

document.getElementById("fullTitle").textContent =
  CONFIG.WEBSITETITLE + " - " + CONFIG.PAGETITLE;


function setLink(id, url, text, newTab = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.href = url;
  el.textContent = text;
  if (newTab) el.target = "_blank";
}


setLink("proposalLink", CONFIG.PROPOSALVAR + "index.html", "Proposal Website", true);
setLink("mysiteLink", CONFIG.MYSITEVAR + "index.html", "Murder Drones Fan Wiki (Mysite Project)", true);
setLink("ampLink", CONFIG.AMPVAR + "index.html", "AMP Project", true);
setLink("tbgLink", CONFIG.TBGVAR + "index.html", "One Wrong Choice (Text Based Game)", true);


setLink("jswikiLink", CONFIG.JSWIKIVAR + "index.html", "Javascript Wiki", true);
setLink("wikiLink", CONFIG.WIKIVAR + "index.html", "A.T.A. Tech Wiki", true);
setLink("wikidevLink", CONFIG.WIKIDEVVAR + "index.html", "A.T.A. Tech Wiki Dev Page", true);
setLink("purpleformLink", "notfound.html", "Purple Form", true);

setLink("pkhexLink", CONFIG.PKHEXVAR + "index.html", "PKHEX Web Browser Version", true);
setLink("shsLink", CONFIG.SHSVAR + "index.html", "Shay\'s Animal Shelter", true);
setLink("phpLink", CONFIG.ALTDOMAINVAR + "index.html", "My Other Domain", true);


const now = new Date();
document.getElementById("footerDate").innerHTML =
  "&copy; A.t.A. Tech Wiki, " +
  now.toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' }) +
  " - " +
  now.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });


if (CONFIG.DEBUGVAR === 1) {
  document.getElementById("debugNotice").textContent = "Dev stuff is showing";

  const dbg = document.getElementById("debugSection");
  dbg.innerHTML = `
  <style>
  .flex_container { display:flex; flex-wrap:nowrap; border:2px solid #555; background:#777; }
  .flex { width:45%; margin:10px; border:2px solid #555; background:#aaa; }
  .DEBUGTITLE { background:#444; color:#fff; border:2px solid #ccc; }
  </style>
  <div class="DEBUGTITLE"><h1>Debug Info</h1></div>
  <div class="flex_container">
    <div class="flex"><strong>Browser Info</strong><br>${navigator.userAgent}</div>
    <div class="flex"><strong>URL Info</strong><br>${window.location.href}</div>
  </div>`;
}
</script>

</body>
</html>
