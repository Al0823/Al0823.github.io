<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A.t.A. Projects, Websites &amp; Games - Video File Type Converter V0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}
:root{
    --accent:#ED01FC;
    --green:#0DFF92;
    --bg:#212121;
    --bg2:#161616;
    --bg3:#2C2C2C;
    --bg4:#373737;
    --text:#A1A1A1;
    --text-bright:#D2D2D2;
    --divider:#3C3C3C;
    --font-main:'Rajdhani',sans-serif;
    --font-mono:'Share Tech Mono',monospace;
}
body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-main);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.converter-shell{
    width:min(700px,100%);
    background:var(--bg2);
    border:1px solid var(--divider);
    border-radius:4px;
    overflow:hidden;
    position:relative;
}
.converter-shell::before{
    content:'';
    position:absolute;
    inset:0;
    background: repeating-linear-gradient(to bottom, transparent, transparent 3px, #0000000F 3px, #0000000F 4px);
    pointer-events:none;
}
.header{
    background:var(--bg);
    padding:12px 18px;
    border-bottom:1px solid var(--divider);
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.header-title{
    color:var(--accent);
    font-family:var(--font-mono);
    letter-spacing:3px;
    font-size:12px;
}
.header-dots{
    display:flex;
    gap:6px;
}
.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--divider);
}
.dot.active{
    background:var(--green);
    box-shadow:0 0 8px var(--green);
}
.drop-zone{
    height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--divider);
    cursor:pointer;
}
.drop-zone.drag{
    background:#ED01FC10;
}
.upload-icon{
    font-size:60px;
}
.drop-text{
    font-size:20px;
    color:var(--text-bright);
}
.drop-sub{
    font-family:var(--font-mono);
    font-size:11px;
}
.panel{
    padding:16px;
    border-bottom:1px solid var(--divider);
}
.section-title{
    color:var(--accent);
    font-family:var(--font-mono);
    letter-spacing:2px;
    font-size:11px;
    margin-bottom:12px;
}
.info-grid{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:8px;
}
.label{
    font-family:var(--font-mono);
    font-size:11px;
}
.value{
    color:var(--text-bright);
}
.select{
    width:100%;
    background:var(--bg3);
    border:1px solid var(--divider);
    color:var(--text-bright);
    padding:10px;
    font-family:var(--font-main);
}
.progress-track{
    width:100%;
    height:8px;
    background:var(--bg3);
    border-radius:999px;
    overflow:hidden;
}
.progress-fill{
    width:0%;
    height:100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
}
.status{
    margin-top:12px;
    font-family:var(--font-mono);
    color:var(--green);
}
.actions{
    padding:16px;
    display:flex;
    gap:12px;
}
.btn{
    flex:1;
    background:none;
    border:1px solid var(--accent);
    color:var(--accent);
    padding:12px;
    font-family:var(--font-main);
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}
.btn:hover{
    background:var(--accent);
    color:#000000;
}
.btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}
#fileInput{
    display:none;
}
.option-grid{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:10px;
    align-items:center;
}
.log-panel{
    background:var(--bg);
    border:1px solid var(--divider);
    padding:12px;
    height:140px;
    overflow-y:auto;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--green);
    white-space:pre-wrap;
    line-height:1.6;
}
.progress-row{
    display:flex;
    align-items:center;
    gap:12px;
}
.progress-track{
    flex:1;
}
#progressPercent{
    width:50px;
    text-align:right;
    color:var(--accent);
    font-family:var(--font-mono);
    font-size:12px;
}
</style>
</head>
<body>
<div class="converter-shell">
    <div class="header">
        <div class="header-title">VIDEO TRANSCODER</div>
        <div class="header-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div class="drop-zone" id="dropZone">
        <div class="upload-icon">
            &#127909;
        </div>
        <div class="drop-text">Drop Video Here</div>
        <div class="drop-sub">OR CLICK TO SELECT</div>
    </div>
    <div class="panel">
        <div class="section-title">FILE ANALYSIS</div>
<div class="info-grid">
    <div class="label">NAME</div>
    <div class="value" id="fileName">---</div>
    <div class="label">SIZE</div>
    <div class="value" id="fileSize">---</div>
    <div class="label">TYPE</div>
    <div class="value" id="fileType">---</div>
    <div class="label">VIDEO CODEC</div>
    <div class="value" id="videoCodec">---</div>
    <div class="label">AUDIO CODEC</div>
    <div class="value" id="audioCodec">---</div>
    <div class="label">RESOLUTION</div>
    <div class="value" id="resolution">---</div>
    <div class="label">DURATION</div>
    <div class="value" id="duration">---</div>
    <div class="label">FPS</div>
    <div class="value" id="fps">---</div>
</div>
    </div>
<div class="panel">
    <div class="section-title">OUTPUT OPTIONS</div>
    <div class="option-grid">
        <label class="label">FORMAT</label>
        <select id="formatSelect" class="select">
												<option value="mp4">MP4</option>
												<option value="webm">WEBM</option>
												<option value="mkv">MKV</option>
												<!--<option value="mov">MOV</option>-->
        </select>
        <label class="label">QUALITY</label>
        <select id="qualitySelect" class="select">
            <option value="high">HIGH</option>
            <option value="medium">MEDIUM</option>
            <option value="low">LOW</option>
        </select>
    </div>
 </div>
<div class="panel">
    <div class="section-title">CONVERSION LOG</div>
    <div id="logPanel" class="log-panel">&gt; SYSTEM READY</div>
</div>
    <div class="panel">
        <div class="section-title">STATUS</div>
<div class="progress-row">
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div id="progressPercent">0%</div>
</div>
<div class="status" id="status">WAITING FOR FILE...</div>
    </div>
<div class="actions">
    <button class="btn" id="convertBtn" disabled>CONVERT</button>
    <button class="btn" id="downloadBtn" disabled>DOWNLOAD</button>
</div>
</div>
<input type="file" id="fileInput" accept="video/*">
<script type="module">
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js";
import { fetchFile }
from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js";
let selectedFile = null;
const dropZone =
    document.getElementById("dropZone");
const fileInput =
    document.getElementById("fileInput");
const convertBtn =
    document.getElementById("convertBtn");
const logPanel =
    document.getElementById("logPanel");
function addLog(message){
    const time =
        new Date()
        .toLocaleTimeString();
    logPanel.innerHTML +=`<div>[${time}] ${message}</div>`;
    logPanel.scrollTop = logPanel.scrollHeight;
}
async function loadFFmpeg(){

    if(ffmpegLoaded)
        return;

    try{

        addLog(
            "LOADING FFMPEG CORE..."
        );

        document
            .getElementById("status")
            .textContent =
            "LOADING FFMPEG";
await ffmpeg.load({

    workerURL:
        "/videofileconverter/assets/worker.js",

    coreURL:
        "/videofileconverter/assets/ffmpeg-core.js",

    wasmURL:
        "/videofileconverter/assets/ffmpeg-core.wasm"

});

        ffmpegLoaded = true;

        addLog(
            "FFMPEG READY"
        );

        document
            .getElementById("status")
            .textContent =
            "READY";

    }
    catch(error){

        console.error(error);

        addLog(
            "FFMPEG LOAD FAILED"
        );

        throw error;
    }
}
function formatBytes(bytes){
    if(bytes < 1024)
        return bytes + " B";
    if(bytes < 1024 * 1024)
        return (bytes/1024).toFixed(1) + " KB";
    if(bytes < 1024*1024*1024)
        return (bytes/1024/1024).toFixed(1) + " MB";
    return (bytes/1024/1024/1024).toFixed(1) + " GB";
}
function loadFile(file){
    selectedFile = file;
    document.getElementById("fileName")
        .textContent = file.name;
    document.getElementById("fileSize")
        .textContent = formatBytes(file.size);
    document.getElementById("fileType")
        .textContent = file.type || "Unknown";
    document.getElementById("status")
        .textContent = "SYSTEM READY";
    convertBtn.disabled = false;
    addLog(`VIDEO LOADED: ${file.name}`);
    addLog(`SIZE: ${formatBytes(file.size)}`);
}
const ffmpeg = new FFmpeg({
    log: true
});
ffmpeg.on(
    "log",
    ({ message }) => {

        addLog(message);

    }
);
ffmpeg.on(
    "progress",
    ({ progress }) => {

        const pct =
            Math.round(
                progress * 100
            );

        document
            .getElementById(
                "progressFill"
            )
            .style.width =
            pct + "%";

        document
            .getElementById(
                "progressPercent"
            )
            .textContent =
            pct + "%";

    }
);
let ffmpegLoaded = false;
let outputBlob = null;
dropZone.addEventListener("click", () => {fileInput.click();});
fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if(file)
        loadFile(file);
});
dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("drag");
});
dropZone.addEventListener("dragleave", () => {dropZone.classList.remove("drag");});
dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag");
    const file =
        e.dataTransfer.files[0];
    if(file)
        loadFile(file);
});

convertBtn.addEventListener(
    "click",
    async () => {

        try{

            if(!selectedFile)
                return;

            convertBtn.disabled = true;
document.getElementById(
    "progressFill"
).style.width = "0%";

document.getElementById(
    "progressPercent"
).textContent = "0%";
            await loadFFmpeg();

            addLog(
                "WRITING INPUT FILE"
            );

            const inputName =
                selectedFile.name;

            const format =
                document
                .getElementById(
                    "formatSelect"
                )
                .value;

            const outputName =
                "output." + format;
try{
    await ffmpeg.deleteFile(outputName);
}
catch{}
            await ffmpeg.writeFile(
                inputName,
                await fetchFile(
                    selectedFile
                )
            );

            addLog(
                "STARTING TRANSCODE"
            );

            document
                .getElementById(
                    "status"
                )
                .textContent =
                "TRANSCODING";

            await ffmpeg.exec([
                "-i",
                inputName,
                outputName
            ]);

            addLog(
                "READING OUTPUT"
            );

            const data =
                await ffmpeg.readFile(
                    outputName
                );

            outputBlob =
                new Blob(
                    [data.buffer]
                );

            document
                .getElementById(
                    "status"
                )
                .textContent =
                "COMPLETE";

            addLog(
                "TRANSCODE COMPLETE"
            );

            document
                .getElementById(
                    "downloadBtn"
                )
                .disabled =
                false;

        }
        catch(error){

            console.error(error);

            addLog(
                "ERROR: " +
                error.message
            );

            document
                .getElementById(
                    "status"
                )
                .textContent =
                "ERROR";
        }

        finally{

            convertBtn.disabled =
                false;
        }

    }
);

document
    .getElementById(
        "downloadBtn"
    )
    .addEventListener(
        "click",
        () => {

            if(!outputBlob)
                return;

            const format =
                document
                .getElementById(
                    "formatSelect"
                )
                .value;

            const url =
                URL.createObjectURL(
                    outputBlob
                );

            const a =
                document
                .createElement("a");

            a.href = url;

            a.download =
                "converted." +
                format;

            a.click();

            URL.revokeObjectURL(
                url
            );
        }
    );

</script>

</body>
</html>
