<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Converter (Stable FFmpeg WASM)</title>

<style>
body {
    background:#1e1e1e;
    color:#ddd;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box {
    width:600px;
    background:#2a2a2a;
    border:1px solid #444;
    padding:20px;
    border-radius:8px;
}

.drop {
    border:2px dashed #666;
    padding:40px;
    text-align:center;
    cursor:pointer;
    margin-bottom:15px;
}

.drop.drag {
    border-color:#0f0;
    background:#0f0a;
}

button {
    padding:10px 15px;
    margin-right:10px;
    cursor:pointer;
}

progress {
    width:100%;
    height:20px;
}
</style>
</head>

<body>

<div class="box">

    <div id="drop" class="drop">
        Drop video here or click
    </div>

    <input type="file" id="file" hidden>

    <select id="format">
        <option value="mp4">MP4</option>
        <option value="webm">WEBM</option>
        <option value="mkv">MKV</option>
    </select>

    <br><br>

    <button id="convert" disabled>Convert</button>
    <button id="download" disabled>Download</button>

    <br><br>

    <progress id="progress" value="0" max="100"></progress>

    <p id="status">Idle</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.10.0/dist/ffmpeg.min.js"></script>

<script>
const { createFFmpeg, fetchFile } = FFmpeg;

const ffmpeg = createFFmpeg({
    log: false,
    corePath: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js"
});

let fileData = null;
let outputBlob = null;

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const convertBtn = document.getElementById("convert");
const downloadBtn = document.getElementById("download");
const progress = document.getElementById("progress");
const status = document.getElementById("status");

// ---------------- LOAD ----------------
async function load() {
    if (ffmpeg.isLoaded()) return;

    status.textContent = "Loading FFmpeg...";
    await ffmpeg.load();
    status.textContent = "Ready";
}

// ---------------- FILE ----------------
drop.onclick = () => fileInput.click();

fileInput.onchange = e => {
    fileData = e.target.files[0];
    convertBtn.disabled = false;
    status.textContent = "File loaded: " + fileData.name;
};

drop.ondragover = e => {
    e.preventDefault();
    drop.classList.add("drag");
};

drop.ondragleave = () => drop.classList.remove("drag");

drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove("drag");

    fileData = e.dataTransfer.files[0];
    convertBtn.disabled = false;
    status.textContent = "File loaded: " + fileData.name;
};

// ---------------- PROGRESS ----------------
ffmpeg.setProgress(({ ratio }) => {
    progress.value = Math.round(ratio * 100);
});

// ---------------- CONVERT ----------------
convertBtn.onclick = async () => {
    if (!fileData) return;

    try {
        convertBtn.disabled = true;
        downloadBtn.disabled = true;

        await load();

        const inputName = "input.mp4";
        const format = document.getElementById("format").value;
        const outputName = `output.${format}`;

        status.textContent = "Writing file...";

        ffmpeg.FS("writeFile", inputName, await fetchFile(fileData));

        status.textContent = "Converting...";

        await ffmpeg.run("-i", inputName, outputName);

        status.textContent = "Reading output...";

        const data = ffmpeg.FS("readFile", outputName);

        outputBlob = new Blob([data.buffer], {
            type: "video/" + format
        });

        status.textContent = "Done";
        downloadBtn.disabled = false;

    } catch (err) {
        console.error(err);
        status.textContent = "Error: " + err.message;

    } finally {
        convertBtn.disabled = false;
    }
};

// ---------------- DOWNLOAD ----------------
downloadBtn.onclick = () => {
    if (!outputBlob) return;

    const url = URL.createObjectURL(outputBlob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "converted." + document.getElementById("format").value;
    a.click();

    URL.revokeObjectURL(url);
};
</script>

</body>
</html>
